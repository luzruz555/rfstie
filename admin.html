<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - 호감도 분석</title>
    <style>
        body { font-family: monospace; background: #1a1a2e; color: #eee; padding: 20px; }
        h1 { color: #9d8ec2; margin-bottom: 20px; }
        h2 { color: #d4a0a8; margin: 30px 0 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        h3 { color: #8aadc0; margin: 20px 0 10px; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
        th, td { border: 1px solid #444; padding: 8px 12px; text-align: left; }
        th { background: #2a2a4e; }
        tr:nth-child(even) { background: #1e1e3a; }
        .positive { color: #7eca7e; }
        .negative { color: #e07070; }
        .zero { color: #888; }
        .summary { background: #2a2a4e; padding: 15px; border-radius: 8px; margin: 20px 0; }
        .login-box { max-width: 300px; margin: 100px auto; text-align: center; }
        .login-box input { padding: 10px; width: 100%; margin: 10px 0; background: #2a2a4e; border: 1px solid #444; color: #eee; }
        .login-box button { padding: 10px 20px; background: #9d8ec2; border: none; color: #1a1a2e; cursor: pointer; }
        #content { display: none; }
        .loading { text-align: center; padding: 50px; color: #9d8ec2; }
        .error { color: #e07070; padding: 20px; }
        .chapter-section { margin-bottom: 40px; }
        .refresh-btn { padding: 10px 20px; background: #4a4a6e; border: none; color: #eee; cursor: pointer; margin-bottom: 20px; }
        .refresh-btn:hover { background: #5a5a7e; }
    </style>
</head>
<body>
    <div class="login-box" id="loginBox">
        <h2>Admin Access</h2>
        <input type="password" id="password" placeholder="비밀번호 입력">
        <button onclick="checkPassword()">입장</button>
    </div>

    <div id="content">
        <h1>📊 호감도 분석 - 제국 최강이 되기까지</h1>
        <button class="refresh-btn" onclick="loadData()">🔄 새로고침</button>
        <div id="dataContainer" class="loading">데이터 로딩 중...</div>
    </div>

    <script>
        const HEROINES = ['lizette', 'selene', 'adeline', 'karen', 'elia', 'luna'];
        const HEROINE_NAMES = {
            lizette: '리제트',
            selene: '셀레네', 
            adeline: '아델린',
            karen: '카렌',
            elia: '엘리아',
            luna: '루나'
        };

        let STORY = null;
        let DEFAULT_AFFECTION = null;

        function checkPassword() {
            const pw = document.getElementById('password').value;
            if (pw === 'admin1234') {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                loadData();
            } else {
                alert('비밀번호가 틀립니다.');
            }
        }

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });

        async function loadData() {
            document.getElementById('dataContainer').innerHTML = '<div class="loading">데이터 로딩 중...</div>';
            
            try {
                // index.html 가져오기 (캐시 방지)
                const response = await fetch('index.html?t=' + Date.now());
                const html = await response.text();
                
                // DEFAULT_AFFECTION 추출
                const affectionMatch = html.match(/const DEFAULT_AFFECTION\s*=\s*\{([^}]+)\}/);
                if (affectionMatch) {
                    const affectionCode = 'const DEFAULT_AFFECTION = {' + affectionMatch[1] + '}';
                    const affFunc = new Function(affectionCode + '\nreturn DEFAULT_AFFECTION;');
                    DEFAULT_AFFECTION = affFunc();
                } else {
                    // 못 찾으면 기본값 사용
                    DEFAULT_AFFECTION = { lizette: 30, selene: 10, adeline: 15, karen: 10, elia: 10, luna: 0 };
                }
                
                // STORY 객체 추출
                const storyStart = html.indexOf('const STORY = {');
                if (storyStart === -1) {
                    throw new Error('STORY 데이터를 찾을 수 없습니다.');
                }
                
                // 중괄호 매칭으로 끝 찾기
                let braceCount = 0;
                let storyEnd = storyStart;
                let inString = false;
                let stringChar = '';
                
                for (let i = storyStart; i < html.length; i++) {
                    const char = html[i];
                    const prevChar = html[i-1];
                    
                    if ((char === '"' || char === "'" || char === '`') && prevChar !== '\\') {
                        if (!inString) {
                            inString = true;
                            stringChar = char;
                        } else if (char === stringChar) {
                            inString = false;
                        }
                    }
                    
                    if (!inString) {
                        if (char === '{') braceCount++;
                        if (char === '}') {
                            braceCount--;
                            if (braceCount === 0) {
                                storyEnd = i + 1;
                                break;
                            }
                        }
                    }
                }
                
                const storyCode = html.substring(storyStart, storyEnd);
                
                const func = new Function(storyCode + '\nreturn STORY;');
                STORY = func();

                renderData();
            } catch (error) {
                document.getElementById('dataContainer').innerHTML = 
                    `<div class="error">❌ 오류: ${error.message}<br><br>index.html과 같은 폴더에 있는지 확인해주세요.</div>`;
                console.error(error);
            }
        }

        function renderData() {
            let html = '';

            // 기본 호감도 표시 (index.html에서 읽어온 값)
            html += `<div class="summary">
                <strong>📌 기본 호감도 (index.html에서 읽어옴):</strong><br>
                ${HEROINES.map(h => `${HEROINE_NAMES[h]}(${DEFAULT_AFFECTION[h] || 0})`).join(', ')}
            </div>`;

            // 챕터별 총합 저장
            const chapterTotals = {};
            HEROINES.forEach(h => chapterTotals[h] = { max: 0, min: 0 });

            // 챕터별 분석
            const chapters = Object.keys(STORY).filter(k => k.startsWith('chapter'));
            
            chapters.forEach(chapterId => {
                const chapter = STORY[chapterId];
                html += `<div class="chapter-section">`;
                html += `<h2>${chapter.title}: ${chapter.subtitle}</h2>`;
                
                // 선택지 찾기
                const choices = [];
                chapter.scenes.forEach(scene => {
                    if (scene.choices) {
                        scene.choices.forEach(choice => {
                            choices.push({
                                sceneId: scene.id,
                                text: choice.text,
                                affection: choice.affection || {}
                            });
                        });
                    }
                });

                if (choices.length === 0) {
                    html += `<p class="zero">선택지 없음</p>`;
                } else {
                    html += `<table>
                        <tr>
                            <th>씬</th>
                            <th>선택지</th>
                            ${HEROINES.map(h => `<th>${HEROINE_NAMES[h]}</th>`).join('')}
                        </tr>`;

                    const sceneMaxes = {};
                    
                    choices.forEach(c => {
                        html += `<tr>
                            <td>${c.sceneId}</td>
                            <td>${c.text.substring(0, 30)}${c.text.length > 30 ? '...' : ''}</td>`;
                        
                        HEROINES.forEach(h => {
                            const val = c.affection[h] || 0;
                            let cssClass = 'zero';
                            let display = '-';
                            
                            if (val > 0) {
                                cssClass = 'positive';
                                display = '+' + val;
                            } else if (val < 0) {
                                cssClass = 'negative';
                                display = val;
                            }
                            
                            html += `<td class="${cssClass}">${display}</td>`;

                            if (!sceneMaxes[c.sceneId]) {
                                sceneMaxes[c.sceneId] = {};
                                HEROINES.forEach(hh => sceneMaxes[c.sceneId][hh] = { max: -999, min: 999 });
                            }
                            sceneMaxes[c.sceneId][h].max = Math.max(sceneMaxes[c.sceneId][h].max, val);
                            sceneMaxes[c.sceneId][h].min = Math.min(sceneMaxes[c.sceneId][h].min, val);
                        });
                        
                        html += `</tr>`;
                    });

                    html += `</table>`;

                    html += `<h3>${chapter.title} 요약</h3><div class="summary">`;
                    
                    HEROINES.forEach(h => {
                        let maxSum = 0;
                        let minSum = 0;
                        Object.values(sceneMaxes).forEach(scene => {
                            if (scene[h].max !== -999) maxSum += scene[h].max;
                            if (scene[h].min !== 999) minSum += scene[h].min;
                        });
                        
                        if (maxSum !== 0 || minSum !== 0) {
                            chapterTotals[h].max += maxSum;
                            chapterTotals[h].min += minSum;
                            html += `<strong>${HEROINE_NAMES[h]}:</strong> 
                                최소 <span class="${minSum >= 0 ? 'positive' : 'negative'}">${minSum >= 0 ? '+' : ''}${minSum}</span> ~ 
                                최대 <span class="${maxSum >= 0 ? 'positive' : 'negative'}">${maxSum >= 0 ? '+' : ''}${maxSum}</span><br>`;
                        }
                    });
                    
                    html += `</div>`;
                }
                
                html += `</div>`;
            });

            // 전체 요약
            html += `<h2>📈 전체 루트 요약 (Chapter 1~${chapters.length})</h2>`;
            html += `<table>
                <tr>
                    <th>캐릭터</th>
                    <th>시작</th>
                    <th>최소 획득</th>
                    <th>최대 획득</th>
                    <th>최소 합계</th>
                    <th>최대 합계</th>
                </tr>`;
            
            HEROINES.forEach(h => {
                const start = DEFAULT_AFFECTION[h] || 0;
                const minTotal = start + chapterTotals[h].min;
                const maxTotal = Math.min(100, start + chapterTotals[h].max);
                const rawMax = start + chapterTotals[h].max;
                
                html += `<tr>
                    <td>${HEROINE_NAMES[h]}</td>
                    <td>${start}</td>
                    <td class="${chapterTotals[h].min >= 0 ? 'positive' : 'negative'}">${chapterTotals[h].min >= 0 ? '+' : ''}${chapterTotals[h].min}</td>
                    <td class="${chapterTotals[h].max >= 0 ? 'positive' : 'negative'}">${chapterTotals[h].max >= 0 ? '+' : ''}${chapterTotals[h].max}</td>
                    <td>${minTotal}</td>
                    <td class="${maxTotal >= 100 ? 'positive' : ''}">${maxTotal}${rawMax > 100 ? ' (원래 ' + rawMax + ')' : ''}</td>
                </tr>`;
            });
            
            html += `</table>`;

            // 밸런스 체크
            html += `<div class="summary">
                <strong>⚠️ 자동 밸런스 체크:</strong><br>`;
            
            HEROINES.forEach(h => {
                const start = DEFAULT_AFFECTION[h] || 0;
                const maxTotal = start + chapterTotals[h].max;
                if (maxTotal >= 100) {
                    html += `<span class="positive">✓ ${HEROINE_NAMES[h]}: 100 도달 가능 (최대 ${maxTotal})</span><br>`;
                } else if (maxTotal < 50) {
                    html += `<span class="negative">✗ ${HEROINE_NAMES[h]}: 호감도 부족 (최대 ${maxTotal}) - 추가 이벤트 필요</span><br>`;
                } else {
                    html += `<span class="zero">△ ${HEROINE_NAMES[h]}: 중간 (최대 ${maxTotal})</span><br>`;
                }
            });
            
            html += `</div>`;

            html += `<p class="zero" style="margin-top: 30px; text-align: center;">
                마지막 업데이트: ${new Date().toLocaleString('ko-KR')}
            </p>`;

            document.getElementById('dataContainer').innerHTML = html;
        }
    </script>
</body>
</html>
