                    <button onClick={() => setShowChapters(false)} style={{ marginTop: '24px', padding: '8px 24px', background: 'transparent', border: '1px solid #3d3850', borderRadius: '4px', color: '#6b6480', cursor: 'pointer', fontSize: '0.8rem' }}>뒤로</button>
                </div>

            return (

                    <Particles />
                    {isMobile ? (<><div style={{ position: 'absolute', left: 0, top: '50%', transform: 'translateY(-50%)', width: '50%', display: 'flex', justifyContent: 'center', alignItems: 'center' }}><CharArea /></div><div style={{ position: 'absolute', right: 0, top: 0, bottom: 0, width: '50%', background: 'linear-gradient(90deg, transparent, rgba(10,8,16,0.85) 15%)', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', zIndex: 10 }}><div style={{ marginBottom: '14px' }}><TitleLogo /></div><div style={{ display: 'flex', flexDirection: 'column', gap: '5px', alignItems: 'center' }}><MenuBtn text="GAME START" onClick={() => { playSfx('click'); onStart(); }} main /><MenuBtn text="CHAPTER" onClick={() => { playSfx('click'); setShowChapters(true); }} /><MenuBtn text="CONFIG" onClick={() => playSfx('click')} /></div></div></>) : (<><div style={{ position: 'absolute', left: '-3%', top: '50%', transform: 'translateY(-45%)' }}><CharArea /></div><div style={{ position: 'absolute', right: 0, top: 0, bottom: 0, width: '45%', background: 'linear-gradient(90deg, transparent, rgba(10,8,16,0.85) 20%)', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', zIndex: 10 }}><div style={{ marginBottom: '35px' }}><TitleLogo /></div><div style={{ display: 'flex', flexDirection: 'column', gap: '8px', alignItems: 'center' }}><MenuBtn text="GAME START" onClick={() => { playSfx('click'); onStart(); }} main /><MenuBtn text="CHAPTER SELECT" onClick={() => { playSfx('click'); setShowChapters(true); }} /><MenuBtn text="CONFIG" onClick={() => playSfx('click')} /></div><div style={{ position: 'absolute', bottom: '16px', fontSize: '0.6rem', color: '#3d3850' }}>made by CowardMole</div></div></>)}

        // ========== 게임 화면 ==========
        function GameScreen({ startChapter, onGlitch }) {
            const [currentChapter, setCurrentChapter] = useState(startChapter || 'chapter1');
            const [sceneIndex, setSceneIndex] = useState(0);
            const [dialogIndex, setDialogIndex] = useState(0);
            const [displayedText, setDisplayedText] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [showChoices, setShowChoices] = useState(false);
            const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);
            const [isAuto, setIsAuto] = useState(false);
            const [canProceed, setCanProceed] = useState(false);
            const [showChapterTitle, setShowChapterTitle] = useState(true);

            useEffect(() => { const h = () => setIsMobile(window.innerWidth <= 768); window.addEventListener('resize', h); return () => window.removeEventListener('resize', h); }, []);

            const chapter = STORY[currentChapter];
            const scene = chapter?.scenes[sceneIndex];
            const dialog = scene?.dialogs[dialogIndex];

            useEffect(() => { if (chapter) { setShowChapterTitle(true); playBgm(chapter.bgm || 'default'); const t = setTimeout(() => setShowChapterTitle(false), 2500); return () => clearTimeout(t); } }, [currentChapter]);

            useEffect(() => {
                if (!dialog || showChapterTitle) return;
                setIsTyping(true); setDisplayedText(''); setCanProceed(false);
                let i = 0;
                const iv = setInterval(() => { if (i < dialog.text.length) { setDisplayedText(dialog.text.slice(0, i + 1)); i++; } else { clearInterval(iv); setIsTyping(false); setCanProceed(true); } }, 30);
                return () => clearInterval(iv);
            }, [dialog, dialogIndex, sceneIndex, currentChapter, showChapterTitle]);

            useEffect(() => { if (!isAuto || isTyping || !canProceed || showChoices) return; const t = setTimeout(proceed, 1500); return () => clearTimeout(t); }, [isAuto, isTyping, canProceed, showChoices]);

            const proceed = useCallback(() => {
                if (!canProceed || showChoices) return;
                if (dialogIndex < scene.dialogs.length - 1) setDialogIndex(d => d + 1);
                else if (scene.choices) setShowChoices(true);
                else if (scene.next) goToScene(scene.next);
            }, [canProceed, showChoices, dialogIndex, scene]);

            const goToScene = (nextId) => {
                if (nextId === 'glitch') { onGlitch(); return; }
                if (nextId.startsWith('chapter')) { setCurrentChapter(nextId); setSceneIndex(0); setDialogIndex(0); return; }
                const idx = chapter.scenes.findIndex(s => s.id === nextId);
                if (idx !== -1) { setSceneIndex(idx); setDialogIndex(0); }
            };

            const handleChoice = (choice) => { playSfx('decision'); setShowChoices(false); goToScene(choice.next); };
            const handleClick = (e) => {
                if (showChoices || e.target.closest('button') || showChapterTitle) return;
                if (isTyping) { setDisplayedText(dialog.text); setIsTyping(false); setCanProceed(true); } else proceed();
            };

            if (!chapter || !scene) return null;

            if (showChapterTitle) return (<div style={{ height: '100vh', background: '#0a0810', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', animation: 'fadeIn 0.5s' }}><div style={{ fontSize: isMobile ? '0.8rem' : '1rem', color: '#6b6480', letterSpacing: '0.3em', marginBottom: '12px' }}>{chapter.title}</div><div style={{ fontSize: isMobile ? '1.5rem' : '2.2rem', color: '#e8e6ed', fontFamily: "'Noto Serif KR', serif", fontWeight: 700 }}>{chapter.subtitle}</div></div>);

            const getCharPosition = (chars, idx) => {
                const count = chars.length;
                if (count === 1) return { left: '50%', transform: 'translateX(-50%)' };
                if (count === 2) return idx === 0 ? { left: '25%' } : { right: '25%' };
                const positions = [{ left: '5%' }, { left: '18%' }, { left: '31%' }, { right: '31%' }, { right: '18%' }, { right: '5%' }];
                return positions[idx] || positions[0];
            };

            const currentSpeaker = dialog?.speaker === 'narrator' || dialog?.speaker === 'you' ? null : dialog?.speaker;
            const speakerData = dialog?.speaker === 'you' ? { name: '당신', color: '#9d8ec2' } : dialog?.speaker === 'narrator' ? { name: '', color: '#7a7888' } : { name: characters[dialog?.speaker]?.name || '', color: characters[dialog?.speaker]?.color || '#fff' };
            const getEmotionAnimation = (emotion) => ({ happy: 'happyBounce 1.5s ease-in-out infinite', angry: 'angryTremble 1s ease-in-out infinite', sad: 'sadDroop 4s ease-in-out infinite', default: 'speaking 3s ease-in-out infinite' }[emotion] || 'speaking 3s ease-in-out infinite');
            const bgUrl = IMAGES[scene.bg];

            return (
                <div onClick={handleClick} style={{ height: '100vh', position: 'relative', background: '#0a0810', overflow: 'hidden', cursor: showChoices ? 'default' : 'pointer' }}>
                    <div style={{ position: 'absolute', inset: 0, background: bgUrl ? `url(${bgUrl}) center/cover` : '#100e16', transition: 'background 0.5s' }}>{!bgUrl && <div style={{ position: 'absolute', top: '40%', left: '50%', transform: 'translate(-50%, -50%)', color: '#1a1820', fontSize: '0.7rem' }}>[ {scene.bg} ]</div>}</div>

                    {!isMobile && (<div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: '42px', background: 'linear-gradient(#0a0810, transparent)', display: 'flex', alignItems: 'center', padding: '0 16px', gap: '6px', zIndex: 60 }}>{['SAVE', 'LOAD', 'TITLE', 'CONFIG'].map(t => (<button key={t} onClick={e => { e.stopPropagation(); playSfx('click'); }} style={{ padding: '4px 12px', fontSize: '0.68rem', background: 'transparent', border: '1px solid #252230', color: '#6b6480', borderRadius: '10px', cursor: 'pointer' }}>{t}</button>))}</div>)}

                    {scene.chars.map((char, idx) => {
                        const isSpeaking = currentSpeaker === char.id;
                        const emotion = isSpeaking && dialog?.emotion ? dialog.emotion : char.emotion;
                        const charImg = IMAGES[char.id]?.[emotion] || IMAGES[char.id]?.default;
                        const pos = getCharPosition(scene.chars, idx);
                        return (<div key={`${char.id}-${idx}`} style={{ position: 'absolute', ...pos, bottom: isMobile ? '100px' : '120px', width: isMobile ? '140px' : '260px', height: isMobile ? '220px' : '420px', display: 'flex', justifyContent: 'center', alignItems: 'flex-end', transition: 'filter 0.5s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)', filter: isSpeaking ? 'brightness(1) drop-shadow(0 0 12px rgba(255,255,255,0.12))' : 'brightness(0.5)', transform: isSpeaking ? 'scale(1.12)' : 'scale(0.95)', animation: isSpeaking ? getEmotionAnimation(emotion) : 'idleBreathing 5s ease-in-out infinite', zIndex: isSpeaking ? 50 : 1 }}>{charImg ? <img src={charImg} style={{ maxHeight: '100%', maxWidth: '100%', objectFit: 'contain', objectPosition: 'bottom' }} /> : <div style={{ color: '#2a2836', fontSize: '0.55rem', padding: '15px', border: '1px dashed #2a2836', borderRadius: '4px' }}>[{characters[char.id]?.name} - {emotion}]</div>}</div>);
                    })}

                    {!showChoices && (<div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, padding: isMobile ? '10px' : '16px', zIndex: 60 }}><div style={{ maxWidth: '880px', margin: '0 auto', background: 'rgba(10, 8, 16, 0.96)', border: '1px solid #252230', borderRadius: isMobile ? '8px' : '10px', padding: isMobile ? '12px 14px' : '18px 24px', position: 'relative' }}>{speakerData.name && (<div style={{ position: 'absolute', top: isMobile ? '-11px' : '-13px', left: isMobile ? '12px' : '20px', background: speakerData.color, padding: isMobile ? '2px 12px' : '3px 16px', borderRadius: '12px', color: '#0a0810', fontSize: isMobile ? '0.72rem' : '0.78rem', fontWeight: 600 }}>{speakerData.name}</div>)}<div style={{ fontSize: isMobile ? '0.88rem' : '0.98rem', lineHeight: 1.8, color: dialog?.speaker === 'narrator' ? '#7a7888' : '#e8e6ed', fontStyle: dialog?.speaker === 'narrator' ? 'italic' : 'normal', minHeight: isMobile ? '42px' : '52px', paddingTop: speakerData.name ? '6px' : 0, display: 'flex', alignItems: 'center' }}><span>{displayedText}</span>{isTyping && <span style={{ borderRight: '2px solid #9d8ec2', marginLeft: '1px', animation: 'blink 0.5s infinite' }}>&nbsp;</span>}{!isTyping && canProceed && <span style={{ marginLeft: '8px', color: '#9d8ec2', fontSize: '0.75rem', animation: 'arrowBounce 0.7s infinite' }}>▼</span>}</div><div style={{ position: 'absolute', bottom: isMobile ? '7px' : '10px', right: isMobile ? '8px' : '14px', display: 'flex', gap: isMobile ? '4px' : '6px' }}>{['SKIP', 'AUTO', 'LOG'].map(t => (<button key={t} onClick={e => { e.stopPropagation(); if (t === 'AUTO') setIsAuto(!isAuto); playSfx('click'); }} style={{ padding: isMobile ? '2px 8px' : '4px 10px', fontSize: isMobile ? '0.56rem' : '0.66rem', background: t === 'AUTO' && isAuto ? 'rgba(157, 142, 194, 0.2)' : 'transparent', border: `1px solid ${t === 'AUTO' && isAuto ? '#9d8ec2' : '#252230'}`, color: t === 'AUTO' && isAuto ? '#b8aed0' : '#6b6480', borderRadius: '8px', cursor: 'pointer' }}>{t}</button>))}</div></div></div>)}

                    {showChoices && scene.choices && (<div style={{ position: 'absolute', top: isMobile ? '35%' : '40%', left: '50%', transform: 'translate(-50%, -50%)', display: 'flex', flexDirection: 'column', gap: isMobile ? '8px' : '12px', animation: 'fadeIn 0.4s', zIndex: 200, width: isMobile ? '80%' : 'auto', maxWidth: '420px' }}>{scene.choices.map((choice, i) => (<button key={i} onClick={() => handleChoice(choice)} style={{ padding: isMobile ? '12px 16px' : '18px 28px', fontSize: isMobile ? '0.8rem' : '0.95rem', background: 'rgba(10, 8, 16, 0.96)', border: '1px solid #3d3850', color: '#e8e6ed', cursor: 'pointer', borderRadius: '8px', textAlign: 'left', width: '100%' }}><span style={{ color: '#9d8ec2', marginRight: '8px' }}>▸</span>{choice.text}</button>))}</div>)}
                </div>
            );
        }

        // ========== 글리치 화면 ==========
        function GlitchScreen({ onComplete }) {
            const [phase, setPhase] = useState(0);
            const msgs = ["ERROR: UNEXPECTED_ENTITY_DETECTED", "WARNING: NARRATIVE_BREACH", "FATAL: OBSERVER_OVERFLOW", "SYSTEM FAILURE..."];
            useEffect(() => { playSfx('glitch'); stopBgm(); const timers = [setTimeout(() => setPhase(1), 200), setTimeout(() => setPhase(2), 700), setTimeout(() => setPhase(3), 1200), setTimeout(() => setPhase(4), 1700), setTimeout(onComplete, 3000)]; return () => timers.forEach(clearTimeout); }, [onComplete]);
            return (<div style={{ height: '100vh', background: '#050508', display: 'flex', justifyContent: 'center', alignItems: 'center', position: 'relative', overflow: 'hidden' }}><div style={{ position: 'absolute', inset: 0, background: 'repeating-linear-gradient(0deg, rgba(0,0,0,0.08), rgba(0,0,0,0.08) 1px, transparent 1px, transparent 2px)' }} />{phase >= 1 && [...Array(12)].map((_, i) => (<div key={i} style={{ position: 'absolute', top: `${Math.random() * 100}%`, left: 0, right: 0, height: `${Math.random() * 3 + 1}px`, background: `rgba(160, 100, 130, ${Math.random() * 0.3 + 0.1})`, transform: `translateX(${Math.random() * 10 - 5}px)` }} />))}<div style={{ fontFamily: 'monospace', fontSize: '0.9rem', color: '#a06880', textShadow: '0 0 8px rgba(160, 100, 130, 0.6)', animation: 'glitchText 0.12s infinite', textAlign: 'center', zIndex: 10 }}>{phase > 0 && msgs[phase - 1]}</div></div>);
        }

        // ========== 캐릭터 사이트 ==========

                        {list.map(([k, c], i) => (<div key={k} onClick={() => { playSfx('click'); setSelected(k); }} style={{ background: '#14121a', border: '1px solid #1a1820', borderRadius: '10px', overflow: 'hidden', cursor: 'pointer', animation: `slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) ${i * 0.05}s both` }}><div style={{ width: '100%', height: isMobile ? '140px' : '195px', background: '#100e16', display: 'flex', justifyContent: 'center', alignItems: 'center', borderBottom: '1px solid #1a1820' }}>{IMAGES[`full${k.charAt(0).toUpperCase()}${k.slice(1)}`] ? <img src={IMAGES[`full${k.charAt(0).toUpperCase()}${k.slice(1)}`]} style={{ maxHeight: '100%', maxWidth: '100%', objectFit: 'cover' }} /> : <span style={{ color: '#2a2836', fontSize: '0.55rem' }}>[ {c.name} ]</span>}</div><div style={{ padding: isMobile ? '9px' : '12px' }}><div style={{ color: c.color, fontSize: isMobile ? '0.52rem' : '0.6rem', marginBottom: '2px' }}>{c.description}</div><h3 style={{ color: '#e8e6ed', fontSize: isMobile ? '0.85rem' : '0.95rem', marginBottom: '4px', fontWeight: 500 }}>{c.fullName}</h3>{c.personality && <div style={{ color: '#6b6480', fontSize: isMobile ? '0.62rem' : '0.7rem' }}>{c.personality}</div>}</div></div>))}

ttom: '14px' }}>{characters[selected].tags.map((t, i) => <span key={i} style={{ padding: '3px 9px', background: `${characters[selected].color}18`, border: `1px solid ${characters[selected].color}30`, borderRadius: '10px', fontSize: '0.65rem', color: characters[selected].color }}>{t}</span>)}</div><div style={{ width: '100%', height: '1px', background: '#1a1820', marginBottom: '14px' }} /><div style={{ padding: '10px 14px', background: '#0a0810', borderRadius: '8px', borderLeft: `2px solid ${characters[selected].color}`, marginBottom: '14px' }}><div style={{ color: '#6b6480', fontSize: '0.6rem', marginBottom: '3px' }}>QUOTE</div><div style={{ color: '#c8c4d4', fontSize: isMobile ? '0.82rem' : '0.9rem', fontStyle: 'italic', lineHeight: 1.5 }}>"{characters[selected].quote}"</div></div></div></div></div>)}

        // ========== 메인 앱 ==========
        function App() {
            const [screen, setScreen] = useState('title');
            const [startChapter, setStartChapter] = useState('chapter1');
            const handleStart = () => { setStartChapter('chapter1'); setScreen('game'); };
            const handleChapterSelect = (chapterId) => { setStartChapter(chapterId); setScreen('game'); };
            return (<div id="game-container" style={{ minHeight: '100vh' }}>{screen === 'title' && <TitleScreen onStart={handleStart} onChapterSelect={handleChapterSelect} />}{screen === 'game' && <GameScreen startChapter={startChapter} onGlitch={() => setScreen('glitch')} />}{screen === 'glitch' && <GlitchScreen onComplete={() => setScreen('site')} />}{screen === 'site' && <CharacterSite />}</div>);
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
