<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>제국 최강이 되기까지</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #0a0810; color: #e8e6ed; overflow: hidden; }
    #root { height: 100vh; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    .text-shake { animation: shake 0.1s infinite; display: inline-block; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
const { useState, useEffect, useCallback, useMemo } = React;

// ════════════════════════════════════════════════════════════════════════════
// 설정 및 데이터
// ════════════════════════════════════════════════════════════════════════════
const SAVE_SLOTS = 3;

const IMAGES = {
    bgRoom: 'img/bg_room.png', bgGarden: 'img/bg_garden.png', bgHall: 'img/bg_hall.png', 
    bgThrone: 'img/bg_throne.png', bgCarriage: 'img/bg_carriage.png', bgNight: 'img/bg_night.png',
    bgBlack: '',
    lizette: { default:'img/l.png', happy:'img/l_happy.png', sad:'img/l_sad.png', angry:'img/l_angry.png' },
    adeline: { default:'img/a.png', happy:'img/a_happy.png', sad:'img/a_sad.png', angry:'img/a_angry.png' },
    selene: { default:'img/s.png', happy:'img/s_happy.png' },
    karen: { default:'img/c.png' },
    elia: { default:'img/e.png' },
    luna: { default:'img/lu.png' }
};

const characters = {
    lizette: { name: "리제트", color: "#d4a0a8" },
    adeline: { name: "아델린", color: "#c4b090" },
    selene: { name: "셀레네", color: "#a890b8" },
    karen: { name: "카렌", color: "#8aadc0" },
    elia: { name: "엘리아", color: "#c49898" },
    luna: { name: "루나", color: "#c8909c" },
    narrator: { name: "", color: "#ffffff" },
    you: { name: "카이른", color: "#9d8ec2" }
};

const STORY = {
    chapter1: {
        title: "Chapter 1", subtitle: "사생아의 비밀", bgm: "default",
        scenes: [
            { id:"1-1", bg:"bgRoom", chars:[], dialogs:[
                { speaker:"narrator", text:"내 이름은 카이른. 제국의 버려진 사생아다." },
                { speaker:"narrator", text:"하지만 오늘, 모든 것이 바뀌었다." }
            ], next: "1-2"},
            { id:"1-2", bg:"bgRoom", chars:[{id:"lizette",pos:"center",emotion:"default"}], dialogs:[
                { speaker:"lizette", text:"도련님, 황궁에서 사람이 왔어요!" }
            ], choices:[
                { text:"가자, 황궁으로.", next:"chapter4" }, // 테스트를 위해 챕터4로 바로가기 가능하게 설정
                { text:"조금 더 준비가 필요해.", next:"1-1" }
            ]}
        ]
    },
    chapter4: {
        title: "Chapter 4", subtitle: "첫 번째 시험", bgm: "tense",
        scenes: [
            { id:"4-12", bg:"bgThrone", chars:[], dialogs:[
                { speaker:"narrator", text:"드디어 첫 번째 시험이다." },
                { speaker:"narrator", text:"시험관: 이제부터 빛이 나오는 순서를 외워야 한다. 준비됐나?" }
            ], next: "minigame-memory"},
            { id:"4-pass", bg:"bgThrone", chars:[{id:"selene",pos:"center",emotion:"happy"}], dialogs:[
                { speaker:"selene", text:"축하해요 오빠! 통과하셨네요!" }
            ], next: "chapter1"}, // 성공시 챕터1로 복귀 (데모)
            { id:"4-fail", bg:"bgBlack", chars:[], dialogs:[
                { speaker:"narrator", text:"결국 시험에서 떨어지고 말았다..." }
            ], next: "badend1"},
            { id:"badend1", bg:"bgBlack", chars:[], dialogs:[
                { speaker:"narrator", text:"당신은 제국에서 추방되었습니다." }
            ], ending:"badend1"}
        ]
    }
};

// ════════════════════════════════════════════════════════════════════════════
// 미니게임 컴포넌트
// ════════════════════════════════════════════════════════════════════════════
const MemoryGame = ({ onPass, onFail }) => {
    const [sequence, setSequence] = useState([]);
    const [playerSeq, setPlayerSeq] = useState([]);
    const [isShowing, setIsShowing] = useState(false);
    const [activeBtn, setActiveBtn] = useState(null);
    const [round, setRound] = useState(1);
    const [started, setStarted] = useState(false);
    const maxRound = 3; // 테스트를 위해 3라운드

    const colors = ['#ff6b6b', '#48dbfb', '#1dd1a1', '#feca57'];

    const startRound = (r) => {
        setPlayerSeq([]);
        const newSeq = Array.from({length: r + 1}, () => Math.floor(Math.random() * 4));
        setSequence(newSeq);
        showSeq(newSeq);
    };

    const showSeq = async (seq) => {
        setIsShowing(true);
        for (let val of seq) {
            await new Promise(res => setTimeout(res, 600));
            setActiveBtn(val);
            await new Promise(res => setTimeout(res, 400));
            setActiveBtn(null);
        }
        setIsShowing(false);
    };

    const handleBtnClick = (idx) => {
        if (isShowing || !started) return;
        const newPlayerSeq = [...playerSeq, idx];
        setPlayerSeq(newPlayerSeq);
        
        setActiveBtn(idx);
        setTimeout(() => setActiveBtn(null), 200);

        if (sequence[newPlayerSeq.length - 1] !== idx) {
            onFail();
            return;
        }

        if (newPlayerSeq.length === sequence.length) {
            if (round >= maxRound) {
                onPass();
            } else {
                setRound(round + 1);
                setTimeout(() => startRound(round + 1), 800);
            }
        }
    };

    return (
        <div onClick={e => e.stopPropagation()} style={{position:'absolute', inset:0, background:'rgba(0,0,0,0.95)', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', zIndex:1000}}>
            <h2 style={{color:'#9d8ec2', marginBottom:'20px'}}>빛의 순서를 기억하세요 ({round}/{maxRound})</h2>
            {!started ? (
                <button onClick={() => {setStarted(true); startRound(1);}} style={{padding:'15px 40px', background:'#9d8ec2', border:'none', borderRadius:'8px', cursor:'pointer', fontWeight:'bold'}}>시험 시작</button>
            ) : (
                <div style={{display:'grid', gridTemplateColumns:'100px 100px', gap:'20px'}}>
                    {colors.map((c, i) => (
                        <div key={i} onClick={() => handleBtnClick(i)} style={{width:'100px', height:'100px', background: activeBtn===i ? '#fff' : c, borderRadius:'15px', cursor:'pointer', border:'3px solid #333'}} />
                    ))}
                </div>
            )}
            <p style={{marginTop:'20px', color:'#666'}}>{isShowing ? "기억하는 중..." : "따라 클릭하세요!"}</p>
        </div>
    );
};

// ════════════════════════════════════════════════════════════════════════════
// 메인 게임 화면
// ════════════════════════════════════════════════════════════════════════════
const GameScreen = ({ onTitle }) => {
    const [curChap, setCurChap] = useState('chapter1');
    const [sceneIdx, setSceneIdx] = useState(0);
    const [dialIdx, setDialIdx] = useState(0);
    const [displayText, setDisplayText] = useState('');
    const [isTyping, setIsTyping] = useState(false);
    const [showChoices, setShowChoices] = useState(false);
    const [showMinigame, setShowMinigame] = useState(null);
    const [affection, setAffection] = useState({ lizette: 20 });

    const chapter = STORY[curChap];
    const scene = chapter.scenes[sceneIdx];
    const dialog = scene.dialogs[dialIdx];

    // 텍스트 타이핑 효과
    useEffect(() => {
        if (!dialog) return;
        setIsTyping(true);
        setDisplayText('');
        let i = 0;
        const timer = setInterval(() => {
            if (i < dialog.text.length) {
                setDisplayText(prev => prev + dialog.text.charAt(i));
                i++;
            } else {
                clearInterval(timer);
                setIsTyping(false);
            }
        }, 30);
        return () => clearInterval(timer);
    }, [curChap, sceneIdx, dialIdx]);

    // 장면 이동 로직
    const goToScene = useCallback((target) => {
        if (target === "minigame-memory") {
            setShowMinigame('memory');
            return;
        }
        if (STORY[target]) {
            setCurChap(target); setSceneIdx(0); setDialIdx(0); setShowChoices(false);
            return;
        }
        const nextIdx = chapter.scenes.findIndex(s => s.id === target);
        if (nextIdx !== -1) {
            setSceneIdx(nextIdx); setDialIdx(0); setShowChoices(false);
        }
    }, [curChap, chapter]);

    const handleNext = () => {
        if (isTyping) {
            setDisplayText(dialog.text);
            setIsTyping(false);
            return;
        }
        if (dialIdx < scene.dialogs.length - 1) {
            setDialIdx(dialIdx + 1);
        } else if (scene.choices) {
            setShowChoices(true);
        } else if (scene.next) {
            goToScene(scene.next);
        }
    };

    const handleChoice = (c) => {
        if (c.affection) {
            // 호감도 로직 (필요시)
        }
        goToScene(c.next);
    };

    return (
        <div onClick={handleNext} style={{height:'100vh', position:'relative', overflow:'hidden', background:'#000'}}>
            {/* 배경 이미지 (없을 경우 색상 처리) */}
            <div style={{
                position:'absolute', inset:0, 
                background: IMAGES[scene.bg] ? `url(${IMAGES[scene.bg]}) center/cover` : '#1a1a2e',
                transition: '0.5s'
            }} />

            {/* 미니게임 */}
            {showMinigame === 'memory' && (
                <MemoryGame 
                    onPass={() => {setShowMinigame(null); goToScene('4-pass');}} 
                    onFail={() => {setShowMinigame(null); goToScene('4-fail');}} 
                />
            )}

            {/* 캐릭터 */}
            {scene.chars.map((char, i) => (
                <div key={i} style={{
                    position:'absolute', bottom:0, left: char.pos==='center'?'50%':(char.pos==='left'?'25%':'75%'),
                    transform:'translateX(-50%)', height:'80%', width:'auto'
                }}>
                    <img 
                        src={IMAGES[char.id]?.[char.emotion || 'default']} 
                        style={{height:'100%', opacity: IMAGES[char.id] ? 1 : 0}} 
                        onError={(e) => e.target.style.display = 'none'}
                    />
                    {!IMAGES[char.id] && <div style={{color:'#fff'}}>[{char.id}]</div>}
                </div>
            ))}

            {/* 대화창 */}
            <div style={{position:'absolute', bottom:20, left:'50%', transform:'translateX(-50%)', width:'90%', maxWidth:'800px', background:'rgba(0,0,0,0.85)', padding:'20px', borderRadius:'15px', border:'1px solid #3d3850', zIndex:100}}>
                <div style={{color: characters[dialog.speaker].color, fontWeight:'bold', marginBottom:'10px'}}>
                    {characters[dialog.speaker].name}
                </div>
                <div style={{fontSize:'1.1rem', lineHeight:'1.6', minHeight:'3em'}}>
                    {displayText}
                </div>
            </div>

            {/* 선택지 */}
            {showChoices && (
                <div style={{position:'absolute', top:'40%', left:'50%', transform:'translate(-50%,-50%)', display:'flex', flexDirection:'column', gap:'10px', zIndex:200}}>
                    {scene.choices.map((c, i) => (
                        <button key={i} onClick={(e) => {e.stopPropagation(); handleChoice(c);}} style={{padding:'15px 30px', background:'rgba(15,15,25,0.95)', border:'1px solid #9d8ec2', color:'#fff', borderRadius:'8px', cursor:'pointer', minWidth:'250px'}}>
                            {c.text}
                        </button>
                    ))}
                </div>
            )}

            {/* 배드엔딩 UI */}
            {scene.ending === 'badend1' && (
                <div style={{position:'absolute', inset:0, background:'rgba(0,0,0,0.95)', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', zIndex:500}}>
                    <h1 style={{color:'#ff4d4d', fontSize:'3rem', marginBottom:'20px'}}>GAME OVER</h1>
                    <p style={{marginBottom:'40px'}}>첫 번째 시험에서 탈락하여 추방당했습니다.</p>
                    <div style={{display:'flex', gap:'20px'}}>
                        <button onClick={(e)=>{e.stopPropagation(); goToScene('4-12');}} style={{padding:'12px 40px', background:'#9d8ec2', border:'none', borderRadius:'8px', fontWeight:'bold', cursor:'pointer'}}>🔄 시험 재도전</button>
                        <button onClick={onTitle} style={{padding:'12px 40px', background:'transparent', border:'1px solid #3d3850', color:'#6b6480', borderRadius:'8px', cursor:'pointer'}}>타이틀로</button>
                    </div>
                </div>
            )}
        </div>
    );
};

// ════════════════════════════════════════════════════════════════════════════
// 앱 시작점
// ════════════════════════════════════════════════════════════════════════════
const App = () => {
    const [view, setView] = useState('title');
    if (view === 'title') return (
        <div style={{height:'100vh', display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'center', background:'#0a0810'}}>
            <h1 style={{fontSize:'3rem', marginBottom:'40px'}}>제국 최강이 되기까지</h1>
            <button onClick={() => setView('game')} style={{padding:'15px 50px', background:'#9d8ec2', border:'none', borderRadius:'5px', cursor:'pointer', fontSize:'1.2rem'}}>게임 시작</button>
        </div>
    );
    return <GameScreen onTitle={() => setView('title')} />;
};

ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
