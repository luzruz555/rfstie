// ════════════════════════════════════════════════════════════════════════════
const SAVE_SLOTS = 3;

const saveGame = (slot, gameState) => {
    const saveData = { ...gameState, timestamp: new Date().toISOString(), version: '1.0' };
    localStorage.setItem(`visualnovel_save_${slot}`, JSON.stringify(saveData));
    return true;
};

const loadGame = (slot) => {
    const data = localStorage.getItem(`visualnovel_save_${slot}`);
    return data ? JSON.parse(data) : null;
};

const getSaveInfo = (slot) => {
    const data = localStorage.getItem(`visualnovel_save_${slot}`);
    if (data) {
        const parsed = JSON.parse(data);
        return { exists: true, chapter: parsed.currentChapter, timestamp: parsed.timestamp, affection: parsed.affection };
    }
    return { exists: false };
};

const deleteSave = (slot) => { localStorage.removeItem(`visualnovel_save_${slot}`); };

let currentBgm = null;
const playBgm = (type) => { 
    if(currentBgm){currentBgm.pause();} 
    const src=SOUNDS[`bgm${type.charAt(0).toUpperCase()+type.slice(1)}`]; 
    if(src){currentBgm=new Audio(src);currentBgm.loop=true;currentBgm.volume=0.3;currentBgm.play().catch(()=>{});} 
};
const stopBgm = () => { if(currentBgm){currentBgm.pause();currentBgm=null;} };
const playSfx = (type) => { const src=SOUNDS[`sfx${type.charAt(0).toUpperCase()+type.slice(1)}`]; if(src)new Audio(src).play().catch(()=>{}); };

function Particles() {
    const particles = useMemo(() => Array.from({length:20},(_,i)=>({id:i,left:Math.random()*100,top:20+Math.random()*70,size:2+Math.random()*3,duration:8+Math.random()*6,delay:Math.random()*8,opacity:0.3+Math.random()*0.4})),[]);
    return (<div style={{position:'absolute',inset:0,overflow:'hidden',pointerEvents:'none',zIndex:5}}>{particles.map(p=>(<div key={p.id} style={{position:'absolute',left:`${p.left}%`,top:`${p.top}%`,width:`${p.size}px`,height:`${p.size}px`,background:`rgba(255,255,255,${p.opacity})`,borderRadius:'50%',animation:`particleDrift ${p.duration}s ease-in-out ${p.delay}s infinite`}}/>))}</div>);
}

function SaveLoadPanel({ mode, onClose, onSave, onLoad, currentState, isMobile }) {
    const [saves, setSaves] = useState([]);
    const [confirmDelete, setConfirmDelete] = useState(null);

    useEffect(() => {
        const saveInfos = [];
        for (let i = 1; i <= SAVE_SLOTS; i++) { saveInfos.push({ slot: i, ...getSaveInfo(i) }); }
        setSaves(saveInfos);
    }, []);

    const handleSave = (slot) => {
        if (onSave) {
            onSave(slot);
            setSaves(prev => prev.map(s => s.slot === slot ? { slot, ...getSaveInfo(slot) } : s));
        }
    };

    const handleLoad = (slot) => {
        const data = loadGame(slot);
        if (data && onLoad) { onLoad(data); onClose(); }
    };

    const handleDelete = (slot) => {
        deleteSave(slot);
        setSaves(prev => prev.map(s => s.slot === slot ? { slot, exists: false } : s));
        setConfirmDelete(null);
    };

    const formatDate = (isoString) => {
        if (!isoString) return '';
        const date = new Date(isoString);
        return `${date.getFullYear()}.${String(date.getMonth()+1).padStart(2,'0')}.${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
    };

    const getChapterTitle = (chapterId) => {
        if (!chapterId) return '???';
        const chapter = STORY[chapterId];
        return chapter ? chapter.subtitle : chapterId;
    };

    return (
        <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(5,4,10,0.95)',display:'flex',justifyContent:'center',alignItems:'center',zIndex:1000,animation:'fadeIn 0.3s'}}>
            <div onClick={e => e.stopPropagation()} style={{width:'90%',maxWidth:'450px',background:'#14121a',border:'1px solid #3d3850',borderRadius:'12px',padding:isMobile?'16px':'24px',position:'relative'}}>
                <div style={{textAlign:'center',marginBottom:'20px'}}>
                    <div style={{fontSize:'0.65rem',color:'#6b6480',letterSpacing:'0.15em',marginBottom:'4px'}}>{mode === 'save' ? 'SAVE GAME' : 'LOAD GAME'}</div>
                    <h2 style={{fontSize:isMobile?'1.1rem':'1.3rem',color:'#e8e6ed',fontFamily:"'Noto Serif KR',serif"}}>{mode === 'save' ? '게임 저장' : '게임 불러오기'}</h2>
                </div>
                <button onClick={onClose} style={{position:'absolute',top:'12px',right:'12px',background:'transparent',border:'1px solid #3d3850',color:'#6b6480',width:'28px',height:'28px',cursor:'pointer',fontSize:'0.9rem',borderRadius:'50%'}}>✕</button>
                <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
                    {saves.map(save => (
                        <div key={save.slot} style={{background:'#0a0810',border:'1px solid #2a2836',borderRadius:'8px',padding:'14px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                            <div style={{flex:1}}>
                                <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'4px'}}>
                                    <span style={{color:'#9d8ec2',fontSize:'0.75rem',fontWeight:600}}>SLOT {save.slot}</span>

                                        ) : (
                                            <button onClick={() => save.exists && handleLoad(save.slot)} disabled={!save.exists} style={{padding:'6px 12px',fontSize:'0.75rem',background:save.exists?'#9d8ec2':'#2a2836',border:'none',color:save.exists?'#0a0810':'#4a4658',borderRadius:'4px',cursor:save.exists?'pointer':'not-allowed',fontWeight:500}}>불러오기</button>
                                        )}
                                        {save.exists && <button onClick={() => setConfirmDelete(save.slot)} style={{padding:'6px 8px',fontSize:'0.7rem',background:'transparent',border:'1px solid #5a3a3a',color:'#a06060',borderRadius:'4px',cursor:'pointer'}}>🗑</button>}
                                    </>

                    ))}

                </div>
            </div>
        </div>
    );
}

function MemoryGame({ onPass, onFail }) {
    const [sequence, setSequence] = useState([]);
    const [playerSequence, setPlayerSequence] = useState([]);
    const [isShowingSequence, setIsShowingSequence] = useState(false);
    const [activeButton, setActiveButton] = useState(null);
    const [round, setRound] = useState(1);
    const [message, setMessage] = useState('준비하세요...');
    const [gameStarted, setGameStarted] = useState(false);
    const [canClick, setCanClick] = useState(false);

    const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f'];
    const maxRound = 5;

    const generateSequence = (length) => {
        const seq = [];
        for (let i = 0; i < length; i++) {
            seq.push(Math.floor(Math.random() * 4));
        }
        return seq;
    };

    const startGame = () => {
        setGameStarted(true);
        setRound(1);
        startRound(1);
    };

    const startRound = (r) => {
        setMessage(`라운드 ${r} / ${maxRound}`);
        setPlayerSequence([]);
        setCanClick(false);
        
        const newSeq = generateSequence(r + 1);
        setSequence(newSeq);
        
        setTimeout(() => {
            showSequence(newSeq);
        }, 1000);
    };

    const showSequence = async (seq) => {
        setIsShowingSequence(true);
        setMessage('순서를 기억하세요!');
        
        for (let i = 0; i < seq.length; i++) {
            await new Promise(resolve => setTimeout(resolve, 600));
            setActiveButton(seq[i]);
            await new Promise(resolve => setTimeout(resolve, 400));
            setActiveButton(null);
        }
        
        setIsShowingSequence(false);
        setCanClick(true);
        setMessage('순서대로 클릭하세요!');
    };

    const handleClick = (index) => {
        if (!canClick || isShowingSequence) return;
        
        const newPlayerSeq = [...playerSequence, index];
        setPlayerSequence(newPlayerSeq);
        
        setActiveButton(index);
        setTimeout(() => setActiveButton(null), 200);
        
        // 틀렸을 때
        if (sequence[newPlayerSeq.length - 1] !== index) {
            setCanClick(false);
            setMessage('틀렸습니다!');
            setTimeout(() => onFail(), 1500);
            return;
        }
        
        // 현재 라운드 완료
        if (newPlayerSeq.length === sequence.length) {
            setCanClick(false);
            
            if (round >= maxRound) {
                setMessage('축하합니다! 통과!');
                setTimeout(() => onPass(), 1500);
            } else {
                setMessage('정답! 다음 라운드...');
                setTimeout(() => {
                    setRound(r => r + 1);
                    startRound(round + 1);
                }, 1000);
            }
        }
    };

    return (
        <div style={{
            position: 'absolute',
            inset: 0,
            background: 'rgba(10,8,16,0.95)',
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
            justifyContent: 'center',
            zIndex: 200
        }}>
            <h2 style={{ color: '#9d8ec2', marginBottom: '10px', fontSize: '1.5rem' }}>
                첫 번째 시험: 지략
            </h2>
            <p style={{ color: '#b8aed0', marginBottom: '30px', fontSize: '1rem' }}>
                {message}
            </p>
            
            {!gameStarted ? (
                <button
                    onClick={startGame}
                    style={{
                        padding: '15px 40px',
                        fontSize: '1.2rem',
                        background: 'linear-gradient(135deg, #9d8ec2, #6b5a8e)',
                        border: 'none',
                        borderRadius: '10px',
                        color: '#fff',
                        cursor: 'pointer'
                    }}
                >
                    시작하기
                </button>
            ) : (
                <>
                    <div style={{
                        display: 'grid',
                        gridTemplateColumns: 'repeat(2, 1fr)',
                        gap: '15px',
                        marginBottom: '30px'
                    }}>
                        {colors.map((color, i) => (
                            <button
                                key={i}
                                onClick={() => handleClick(i)}
                                disabled={!canClick}
                                style={{
                                    width: '100px',
                                    height: '100px',
                                    background: activeButton === i ? '#fff' : color,
                                    border: 'none',
                                    borderRadius: '15px',
                                    cursor: canClick ? 'pointer' : 'default',
                                    opacity: activeButton === i ? 1 : 0.7,
                                    transform: activeButton === i ? 'scale(1.1)' : 'scale(1)',
                                    transition: 'all 0.15s ease',
                                    boxShadow: activeButton === i 
                                        ? `0 0 30px ${color}` 
                                        : '0 4px 8px rgba(0,0,0,0.3)'
                                }}
                            />
                        ))}
                    </div>
                    
                    <div style={{ color: '#6b6480', fontSize: '0.9rem' }}>
                        진행: {playerSequence.length} / {sequence.length}
                    </div>
                </>
            )}
        </div>
    );
}

function GameScreen({ startChapter, startSceneIndex = 0, startDialogIndex = 0, onGlitch, onTitle, affection, setAffection }) {
    const [currentChapter, setCurrentChapter] = useState(startChapter || 'chapter1');
    const [sceneIndex, setSceneIndex] = useState(startSceneIndex);
    const [dialogIndex, setDialogIndex] = useState(startDialogIndex);
    const [displayedText, setDisplayedText] = useState('');
    const [isTyping, setIsTyping] = useState(false);
    const [showChoices, setShowChoices] = useState(false);
    const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);
    const [isAuto, setIsAuto] = useState(false);
    const [canProceed, setCanProceed] = useState(false);
    const [showChapterTitle, setShowChapterTitle] = useState(true);
    const [showAffection, setShowAffection] = useState(false);
    const [affectionPopup, setAffectionPopup] = useState(null);
    const [showSaveLoad, setShowSaveLoad] = useState(null);
    const [history, setHistory] = useState([]);
    const [dialogLog, setDialogLog] = useState([]);
    const [showLog, setShowLog] = useState(false);
    const [showMinigame, setShowMinigame] = useState(null);
    
    useEffect(() => { const h=()=>setIsMobile(window.innerWidth<=768); window.addEventListener('resize',h); return()=>window.removeEventListener('resize',h); }, []);

    const chapter = STORY[currentChapter];
    const scene = chapter?.scenes[sceneIndex];
    const dialog = scene?.dialogs[dialogIndex];

    useEffect(() => { 
        if(chapter){
            setShowChapterTitle(true);
            playBgm(chapter.bgm||'default');
            const t=setTimeout(()=>setShowChapterTitle(false),2500);
            return()=>clearTimeout(t);
        } 
    }, [currentChapter]);

    // 씬별 BGM 변경
    useEffect(() => {
        if(scene?.bgm) { playBgm(scene.bgm); }
    }, [sceneIndex, currentChapter]);

    // 뒤로가기 중인지 체크하는 ref
    const isGoingBack = useRef(false);

    useEffect(() => {
        if(!dialog||showChapterTitle)return;
        if(dialog.sfx)playSfx(dialog.sfx);
        
        // 뒤로가기 중이면 로그에 추가하지 않음
        if (!isGoingBack.current) {
            setDialogLog(prev => {
                // 마지막 항목과 같으면 추가하지 않음 (중복 방지)
                const lastLog = prev[prev.length - 1];
                if (lastLog && lastLog.speaker === dialog.speaker && lastLog.text === dialog.text) {
                    return prev;
                }
                return [...prev, { speaker: dialog.speaker, text: dialog.text }];
            });
        }
        isGoingBack.current = false;
        
        setIsTyping(true);setDisplayedText('');setCanProceed(false);
        let i=0;
        const iv=setInterval(()=>{
            if(i<dialog.text.length){setDisplayedText(dialog.text.slice(0,i+1));i++;}
            else{clearInterval(iv);setIsTyping(false);setCanProceed(true);}
        },30);
        return()=>clearInterval(iv);
    }, [dialog, dialogIndex, sceneIndex, currentChapter, showChapterTitle]);

    useEffect(() => { 
        if(!isAuto||isTyping||!canProceed||showChoices)return; 
        const t=setTimeout(proceed,1500); 
        return()=>clearTimeout(t); 
    }, [isAuto, isTyping, canProceed, showChoices]);

    useEffect(() => {
        const handleKeyDown = (e) => {
            if (showLog || showSaveLoad || showChoices || !dialog) return;
    
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                if (isTyping) {
                    setDisplayedText(dialog.text);
                    setIsTyping(false);
                    setCanProceed(true);
                } else if (canProceed) {
                    proceed();
                }
            }
    
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                goBack();
            }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
    }, [isTyping, canProceed, showLog, showSaveLoad, showChoices, dialog]);

    const determineEnding = useCallback((route) => {
        const values = HEROINES.map(h => affection[h] || 0);
        const allMax = values.every(v => v >= 100);
        const hasMax = values.some(v => v >= 100);
        
        if (route === 'a') {
            // 루트 A: 황제 도전
            if (hasMax) {
                const maxVal = Math.max(...values);
                const maxIdx = values.indexOf(maxVal);
                return `ending_${HEROINES[maxIdx]}`;
            }
            return 'ending_emperor_alone';
        } else {
            // 루트 B: 2인자
            if (allMax) return 'ending_harem';
            if (hasMax) {
                const maxVal = Math.max(...values);
                const maxIdx = values.indexOf(maxVal);
                return `ending_${HEROINES[maxIdx]}`;
            }
            return 'ending_bad_betrayal';
        }
    }, [affection]);

    const proceed = useCallback(() => {
        if(!canProceed||showChoices)return;
        
        // 히스토리에 현재 상태 저장 (호감도 포함)
        setHistory(prev => [...prev, { 
            chapter: currentChapter, 
            scene: sceneIndex, 
            dialog: dialogIndex,
            affection: {...affection}  // 호감도도 저장
        }]);
        
        if(dialogIndex<scene.dialogs.length-1){setDialogIndex(d=>d+1);}
        else if(scene.choices){setShowChoices(true);}
        else if(scene.next === 'minigame-memory') {
        setShowMinigame('memory');
        return;
    }
        else if(scene.next){goToScene(scene.next);}
        else if(sceneIndex<chapter.scenes.length-1){setSceneIndex(s=>s+1);setDialogIndex(0);}
    }, [canProceed, showChoices, dialogIndex, scene, sceneIndex, chapter, currentChapter, affection]);

    // SKIP 모드 상태
    const [isSkipping, setIsSkipping] = useState(false);
    const skipIntervalRef = useRef(null);

    // SKIP 모드 - 꾹 누르면 대화 빠르게 넘기기
    useEffect(() => {
        if (isSkipping && !showChoices && !showMinigame) {
            skipIntervalRef.current = setInterval(() => {
                if (isTyping) {
                    // 타이핑 중이면 즉시 완료
                    setDisplayedText(dialog?.text || '');
                    setIsTyping(false);
                    setCanProceed(true);
                } else if (canProceed && !showChoices) {
                    // 다음으로 진행
                    proceed();
                }
            }, 80); // 80ms 간격으로 빠르게 진행
        } else {
            if (skipIntervalRef.current) {
                clearInterval(skipIntervalRef.current);
                skipIntervalRef.current = null;
            }
        }
        
        return () => {
            if (skipIntervalRef.current) {
                clearInterval(skipIntervalRef.current);
            }
        };
    }, [isSkipping, isTyping, canProceed, showChoices, showMinigame, dialog, proceed]);

    // 스킵 시작/종료 핸들러
    const startSkip = () => setIsSkipping(true);
    const stopSkip = () => setIsSkipping(false);

    // BACK 버튼 - 호감도도 복원
    const goBack = useCallback(() => {
        if (history.length === 0) return;
        const prev = history[history.length - 1];
        setHistory(h => h.slice(0, -1));
        
        // 뒤로가기 플래그 설정 (로그 중복 방지)
        isGoingBack.current = true;
        
        // 호감도 복원
        if (prev.affection) {
            setAffection(prev.affection);
        }
        
        if (prev.chapter !== currentChapter) {
            setCurrentChapter(prev.chapter);
        }
        setSceneIndex(prev.scene);
        setDialogIndex(prev.dialog);
        setShowChoices(false);
    }, [history, currentChapter]);

    const goToScene = (nextId) => {
        if(nextId==='glitch'){onGlitch();return;}
        if(nextId==='ending_check_a'){
            const ending = determineEnding('a');
            setCurrentChapter(ending);setSceneIndex(0);setDialogIndex(0);return;
        }
        if(scene?.ending === 'badend1') {
    // 배드엔딩 화면 표시 (재도전 버튼 포함)
        }
        if(nextId==='ending_check_b'){
            const ending = determineEnding('b');
            setCurrentChapter(ending);setSceneIndex(0);setDialogIndex(0);return;
        }
        if(nextId.startsWith('chapter')||nextId.startsWith('ending')){
            setCurrentChapter(nextId);setSceneIndex(0);setDialogIndex(0);return;
        }
        const idx=chapter.scenes.findIndex(s=>s.id===nextId);
        if(idx!==-1){setSceneIndex(idx);setDialogIndex(0);}
    };

    const handleChoice = (choice) => {
        playSfx('decision');
        setShowChoices(false);
        if(choice.affection){
            const newAff = {...affection};
            let changes = [];
            Object.entries(choice.affection).forEach(([char,delta])=>{
                newAff[char] = Math.max(0, Math.min(100, (newAff[char]||0)+delta));
                if(delta !== 0) changes.push({char,delta});
            });
            setAffection(newAff);
            if(changes.length>0){
                setAffectionPopup(changes);
                setTimeout(()=>setAffectionPopup(null),1500);
            }
        }
        goToScene(choice.next);
    };

    const handleClick = (e) => {
        if(showChoices||e.target.closest('button')||showChapterTitle||showAffection||showSaveLoad||showLog||showMinigame)return;
        
        // 타이핑 중이면 즉시 완료 (스킵)
        if(isTyping){
            setDisplayedText(dialog.text);
            setIsTyping(false);
            setCanProceed(true);
        } else {
            proceed();
        }
    };

    const handleSave = (slot) => {
        const gameState = { currentChapter, sceneIndex, dialogIndex, affection };
        saveGame(slot, gameState);
        playSfx('decision');
    };

    const handleLoadInGame = (saveData) => {
        setCurrentChapter(saveData.currentChapter);
        setSceneIndex(saveData.sceneIndex);
        setDialogIndex(saveData.dialogIndex);
        setAffection(saveData.affection);
        setShowSaveLoad(null);
        setShowChapterTitle(true);
        setHistory([]);
    };

    // ═══════════════════════════════════════
    // 미니게임 핸들러
    // ═══════════════════════════════════════
    const handleMinigamePass = useCallback(() => {
        setShowMinigame(null);
        // 4-pass 씬으로 이동
        const idx = chapter?.scenes?.findIndex(s => s.id === '4-pass');
        if (idx !== -1) {
            setSceneIndex(idx);
            setDialogIndex(0);
        }
    }, [chapter]);

    const handleMinigameFail = useCallback(() => {
        setShowMinigame(null);
        // 4-fail 씬으로 이동
        const idx = chapter?.scenes?.findIndex(s => s.id === '4-fail');
        if (idx !== -1) {
            setSceneIndex(idx);
            setDialogIndex(0);
        }
    }, [chapter]);

    if(!chapter||!scene)return null;

    if(showChapterTitle)return(
        <div style={{height:'100vh',background:'#0a0810',display:'flex',flexDirection:'column',justifyContent:'center',alignItems:'center',animation:'fadeIn 0.5s'}}>
            <div style={{fontSize:isMobile?'0.8rem':'1rem',color:'#6b6480',letterSpacing:'0.3em',marginBottom:'12px'}}>{chapter.title}</div>
            <div style={{fontSize:isMobile?'1.5rem':'2.2rem',color:'#e8e6ed',fontFamily:"'Noto Serif KR',serif",fontWeight:700}}>{chapter.subtitle}</div>
        </div>
    );

    const getCharPosition = (chars,idx) => {
        const count=chars.length;
        if(count===1)return{left:'30%',transform:'translateX(-50%)'};
        if(count===2)return idx===0?{left:'15%'}:{right:'15%'};
        const positions=[{left:'5%'},{left:'18%'},{left:'31%'},{right:'31%'},{right:'18%'},{right:'5%'}];
        return positions[idx]||positions[0];
    };

    const currentSpeaker = dialog?.speaker==='narrator'||dialog?.speaker==='you'?null:dialog?.speaker;
    const speakerData = dialog?.speaker==='you'
    ? {name:'당신',color:'#9d8ec2'}
    : dialog?.speaker==='narrator'
        ? {name:'',color:'#7a7888'}
        : characters[dialog?.speaker]
            ? {name:characters[dialog.speaker].name, color:characters[dialog.speaker].color}
            : {name:dialog?.speaker||'', color:'#c8c4d4'};
    const getEmotionAnimation = (emotion) => ({happy:'happyBounce 1.5s ease-in-out infinite',angry:'angryTremble 1s ease-in-out infinite',sad:'sadDroop 4s ease-in-out infinite',default:'speaking 3s ease-in-out infinite'}[emotion]||'speaking 3s ease-in-out infinite');
    const bgUrl = IMAGES[scene.bg];

    return (
        <div onClick={handleClick} style={{height:'100vh',position:'relative',background:'#0a0810',overflow:'hidden',cursor:showChoices?'default':'pointer'}}>
            <div style={{position:'absolute',inset:0,background:bgUrl?`url(${bgUrl}) center/cover`:'#100e16',transition:'background 0.5s'}}>{!bgUrl&&<div style={{position:'absolute',top:'40%',left:'50%',transform:'translate(-50%,-50%)',color:'#1a1820',fontSize:'0.7rem'}}>[ {scene.bg} ]</div>}</div>
            {scene?.ending === 'badend1' && (
                <div style={{
                    position: 'absolute',
                    inset: 0,
                    background: 'rgba(0,0,0,0.9)',
                    display: 'flex',
                    flexDirection: 'column',
                    alignItems: 'center',
                    justifyContent: 'center',
                    zIndex: 300
                }}>
                    <h1 style={{ color: '#e07070', fontSize: '2rem', marginBottom: '20px' }}>
                        BAD END 1
                    </h1>
                    <p style={{ color: '#b8aed0', marginBottom: '40px' }}>
                        실패한 황자
                    </p>
                    <div style={{ display: 'flex', gap: '20px' }}>
                        <button
                            onClick={() => goToScene('4-12c')}
                            style={{
                                padding: '12px 30px',
                                background: 'linear-gradient(135deg, #9d8ec2, #6b5a8e)',
                                border: 'none',
                                borderRadius: '8px',
                                color: '#fff',
                                cursor: 'pointer',
                                fontSize: '1rem'
                            }}
                        >
                            🔄 재도전
                        </button>
                        <button
                            onClick={onTitle}
                            style={{
                                padding: '12px 30px',
                                background: 'transparent',
                                border: '1px solid #6b6480',
                                borderRadius: '8px',
                                color: '#6b6480',
                                cursor: 'pointer',
                                fontSize: '1rem'
                            }}
                        >
                            타이틀로
                        </button>
                    </div>
                </div>
            )}

            {/* 상단 UI */}
            <div style={{position:'absolute',top:0,left:0,right:0,height:'42px',background:'linear-gradient(#0a0810,transparent)',display:'flex',alignItems:'center',padding:'0 16px',gap:'6px',zIndex:60}}>
                <button onClick={e=>{e.stopPropagation();playSfx('click');setShowAffection(true);}} style={{padding:'4px 12px',fontSize:'0.68rem',background:'rgba(157,142,194,0.2)',border:'1px solid #9d8ec2',color:'#b8aed0',borderRadius:'10px',cursor:'pointer'}}>💕 호감도</button>
                <button onClick={e=>{e.stopPropagation();playSfx('click');setShowSaveLoad('save');}} style={{padding:'4px 10px',fontSize:'0.65rem',background:'rgba(60,50,80,0.7)',border:'1px solid #4a4060',color:'#b0a0c8',borderRadius:'10px',cursor:'pointer'}}>💾 SAVE</button>
                <button onClick={e=>{e.stopPropagation();playSfx('click');setShowSaveLoad('load');}} style={{padding:'4px 10px',fontSize:'0.65rem',background:'rgba(60,50,80,0.7)',border:'1px solid #4a4060',color:'#b0a0c8',borderRadius:'10px',cursor:'pointer'}}>📂 LOAD</button>
                {!isMobile && <button onClick={e=>{e.stopPropagation();playSfx('click');if(onTitle)onTitle();}} style={{padding:'4px 12px',fontSize:'0.68rem',background:'transparent',border:'1px solid #252230',color:'#6b6480',borderRadius:'10px',cursor:'pointer'}}>TITLE</button>}
            </div>

            {/* 호감도 변동 팝업 */}
            {affectionPopup && (
                <div style={{position:'absolute',top:'80px',right:'20px',zIndex:100,animation:'slideDown 0.3s'}}>
                    {affectionPopup.map((item,i)=>(
                        <div key={i} style={{background:item.delta>0?'rgba(157,142,194,0.2)':'rgba(180,80,80,0.2)',border:`1px solid ${item.delta>0?'#9d8ec2':'#b05050'}`,borderRadius:'8px',padding:'8px 16px',marginBottom:'4px',display:'flex',alignItems:'center',gap:'8px',animation:'heartPop 0.5s'}}>
                            <span style={{color:characters[item.char]?.color}}>{characters[item.char]?.name}</span>
                            <span style={{color:item.delta>0?'#d4a0a8':'#e07070'}}>{item.delta>0?'+':''}{item.delta} {item.delta>0?'💕':'💔'}</span>
                        </div>
                    ))}
                </div>
            )}
            {showLog && (
    <div onClick={()=>setShowLog(false)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.9)',display:'flex',justifyContent:'center',alignItems:'center',zIndex:1000}}>
        <div onClick={e=>e.stopPropagation()} style={{width:'90%',maxWidth:'600px',height:'70vh',background:'#14121a',border:'1px solid #3d3850',borderRadius:'12px',display:'flex',flexDirection:'column'}}>
            {/* 헤더 */}
            <div style={{padding:'16px',borderBottom:'1px solid #252230',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <h3 style={{color:'#9d8ec2',fontSize:'1rem'}}>📜 대화 기록</h3>
                <button onClick={()=>setShowLog(false)} style={{background:'transparent',border:'1px solid #3d3850',color:'#6b6480',width:'28px',height:'28px',borderRadius:'50%',cursor:'pointer'}}>✕</button>
            </div>
            {/* 로그 내용 */}
            <div style={{flex:1,overflow:'auto',padding:'16px',display:'flex',flexDirection:'column',gap:'12px'}}>
                {dialogLog.map((log,i) => {
                    const isNarrator = log.speaker === 'narrator';
                    const isYou = log.speaker === 'you';
                    const charData = characters[log.speaker];
                    const name = isYou ? '당신' : isNarrator ? '' : (charData?.name || log.speaker);
                    const color = isYou ? '#9d8ec2' : isNarrator ? '#6b6480' : (charData?.color || '#c8c4d4');
                    return (
                        <div key={i} style={{padding:'10px 12px',background:'rgba(0,0,0,0.3)',borderRadius:'6px',borderLeft:`3px solid ${color}`}}>
                                    {name && <div style={{color:color,fontSize:'0.75rem',fontWeight:600,marginBottom:'4px'}}>{name}</div>}
                                    <div style={{color:isNarrator?'#7a7888':'#e8e6ed',fontSize:'0.85rem',fontStyle:isNarrator?'italic':'normal',lineHeight:1.6}}>{log.text}</div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            </div>
        )}

            {/* 캐릭터들  */}
            {scene.chars.map((char,idx)=>{
                const isSpeaking=currentSpeaker===char.id;
                const emotion=isSpeaking&&dialog?.emotion?dialog.emotion:char.emotion;
                const charImg=IMAGES[char.id]?.[emotion]||IMAGES[char.id]?.default;
                const pos=getCharPosition(scene.chars,idx);
                return(
                    <div key={`${char.id}-${idx}`} style={{
                        position:'absolute',...pos,
                        bottom:isMobile?'50px':'80px',  // 더 아래로
                        width:isMobile?'240px':'550px',   // 크기 증가
                        height:isMobile?'340px':'760px',  // 크기 증가
                        display:'flex',justifyContent:'center',alignItems:'flex-end',
                        transition:'filter 0.5s ease,transform 0.5s cubic-bezier(0.34,1.56,0.64,1)',
                        filter:isSpeaking?'brightness(1) drop-shadow(0 0 12px rgba(255,255,255,0.12))':'brightness(0.5)',
                        transform:isSpeaking?'scale(1.08)':'scale(0.92)',
                        animation:isSpeaking?getEmotionAnimation(emotion):'idleBreathing 5s ease-in-out infinite',
                        zIndex:isSpeaking?50:1
                    }}>
                        {charImg?<img src={charImg} style={{maxHeight:'100%',maxWidth:'100%',objectFit:'contain',objectPosition:'bottom'}}/>
                        :<div style={{color:'#2a2836',fontSize:'0.55rem',padding:'15px',border:'1px dashed #2a2836',borderRadius:'4px'}}>[{characters[char.id]?.name}-{emotion}]</div>}
                    </div>
                );
            })}

            {/* 대화창 */}
            {!showChoices&&(
                <div style={{position:'absolute',bottom:0,left:0,right:0,padding:isMobile?'10px':'16px',zIndex:60}}>
                    <div style={{maxWidth:'880px',margin:'0 auto',background:'rgba(10,8,16,0.96)',border:'1px solid #252230',borderRadius:isMobile?'8px':'10px',padding:isMobile?'12px 14px':'18px 24px',position:'relative'}}>
                        {speakerData.name&&(<div style={{position:'absolute',top:isMobile?'-11px':'-13px',left:isMobile?'12px':'20px',background:speakerData.color,padding:isMobile?'2px 12px':'3px 16px',borderRadius:'12px',color:'#0a0810',fontSize:isMobile?'0.72rem':'0.78rem',fontWeight:600}}>{speakerData.name}</div>)}
                        <div style={{fontSize:isMobile?'0.88rem':'0.98rem',lineHeight:1.8,color:dialog?.speaker==='narrator'?'#7a7888':'#e8e6ed',fontStyle:dialog?.speaker==='narrator'?'italic':'normal',minHeight:isMobile?'42px':'52px',paddingTop:speakerData.name?'6px':0,display:'flex',alignItems:'center'}}>
                            <span className={dialog?.effect ? `text-${dialog.effect}` : ''}>{displayedText}</span>
                            {isTyping&&<span style={{borderRight:'2px solid #9d8ec2',marginLeft:'1px',animation:'blink 0.5s infinite'}}>&nbsp;</span>}
                            {!isTyping&&canProceed&&<span style={{marginLeft:'8px',color:'#9d8ec2',fontSize:'0.75rem',animation:'arrowBounce 0.7s infinite'}}>▼</span>}
                        </div>
                        <div style={{position:'absolute',bottom:isMobile?'7px':'10px',right:isMobile?'8px':'14px',display:'flex',gap:isMobile?'4px':'6px'}}>
                            <button onClick={e=>{e.stopPropagation();playSfx('click');goBack();}} disabled={history.length===0} style={{padding:isMobile?'2px 8px':'4px 10px',fontSize:isMobile?'0.56rem':'0.66rem',background:history.length>0?'rgba(100,80,120,0.3)':'transparent',border:`1px solid ${history.length>0?'#6b5a80':'#252230'}`,color:history.length>0?'#a090b0':'#3d3850',borderRadius:'8px',cursor:history.length>0?'pointer':'not-allowed'}}>◀ BACK</button>
                            <button 
                                onMouseDown={e=>{e.stopPropagation();startSkip();}} 
                                onMouseUp={stopSkip} 
                                onMouseLeave={stopSkip}
                                onTouchStart={e=>{e.stopPropagation();startSkip();}} 
                                onTouchEnd={stopSkip}
                                style={{padding:isMobile?'2px 8px':'4px 10px',fontSize:isMobile?'0.56rem':'0.66rem',background:isSkipping?'rgba(180,100,100,0.4)':'rgba(180,100,100,0.15)',border:`1px solid ${isSkipping?'#c07070':'#a06060'}`,color:isSkipping?'#ffb0b0':'#d09090',borderRadius:'8px',cursor:'pointer',transition:'all 0.1s'}}
                            >▶▶ SKIP</button>
                            <button onClick={e=>{e.stopPropagation();setIsAuto(!isAuto);playSfx('click');}} style={{padding:isMobile?'2px 8px':'4px 10px',fontSize:isMobile?'0.56rem':'0.66rem',background:isAuto?'rgba(157,142,194,0.2)':'transparent',border:`1px solid ${isAuto?'#9d8ec2':'#252230'}`,color:isAuto?'#b8aed0':'#6b6480',borderRadius:'8px',cursor:'pointer'}}>AUTO</button>
                            <button onClick={e=>{e.stopPropagation();playSfx('click');setShowLog(true);}} style={{padding:isMobile?'2px 8px':'4px 10px',fontSize:isMobile?'0.56rem':'0.66rem',background:'transparent',border:'1px solid #252230',color:'#6b6480',borderRadius:'8px',cursor:'pointer'}}>LOG</button>
                        </div>
                    </div>
                </div>
            )}

            {/* 선택지 */}
            {showChoices&&scene.choices&&(
                <div style={{position:'absolute',top:isMobile?'35%':'40%',left:'50%',transform:'translate(-50%,-50%)',display:'flex',flexDirection:'column',gap:isMobile?'8px':'12px',animation:'fadeIn 0.4s',zIndex:200,width:isMobile?'85%':'auto',maxWidth:'450px'}}>
                    {scene.choices.map((choice,i)=>(
                        <button key={i} onClick={()=>handleChoice(choice)} style={{padding:isMobile?'12px 16px':'18px 28px',fontSize:isMobile?'0.8rem':'0.95rem',background:'rgba(10,8,16,0.96)',border:'1px solid #3d3850',color:'#e8e6ed',cursor:'pointer',borderRadius:'8px',textAlign:'left',width:'100%'}}>
                            <span style={{color:'#9d8ec2',marginRight:'8px'}}>▸</span>{choice.text}
                            {choice.affection&&<span style={{float:'right',color:'#d4a0a8',fontSize:'0.75rem'}}>💕</span>}
                        </button>
                    ))}
                </div>
            )}

            {showAffection && <AffectionPanel affection={affection} onClose={()=>setShowAffection(false)} isMobile={isMobile}/>}
            {showSaveLoad && <SaveLoadPanel mode={showSaveLoad} onClose={() => setShowSaveLoad(null)} onSave={handleSave} onLoad={handleLoadInGame} currentState={{ currentChapter, sceneIndex, dialogIndex, affection }} isMobile={isMobile}/>}
            
            {/* 미니게임 렌더링 */}
            {showMinigame === 'memory' && (
                <MemoryGame 
                    onPass={handleMinigamePass} 
                    onFail={handleMinigameFail} 
                />
            )}
        </div>
    );
}

function GlitchScreen({ onComplete }) {
    const [phase, setPhase] = useState(0);
    const msgs = ["ERROR: UNEXPECTED_ENTITY_DETECTED","WARNING: NARRATIVE_BREACH","FATAL: OBSERVER_OVERFLOW","SYSTEM FAILURE..."];
    useEffect(() => { playSfx('glitch');stopBgm();const timers=[setTimeout(()=>setPhase(1),200),setTimeout(()=>setPhase(2),700),setTimeout(()=>setPhase(3),1200),setTimeout(()=>setPhase(4),1700),setTimeout(onComplete,3000)];return()=>timers.forEach(clearTimeout); }, [onComplete]);
    return (<div style={{height:'100vh',background:'#050508',display:'flex',justifyContent:'center',alignItems:'center',position:'relative',overflow:'hidden'}}><div style={{position:'absolute',inset:0,background:'repeating-linear-gradient(0deg,rgba(0,0,0,0.08),rgba(0,0,0,0.08) 1px,transparent 1px,transparent 2px)'}}/>{phase>=1&&[...Array(12)].map((_,i)=>(<div key={i} style={{position:'absolute',top:`${Math.random()*100}%`,left:0,right:0,height:`${Math.random()*3+1}px`,background:`rgba(160,100,130,${Math.random()*0.3+0.1})`,transform:`translateX(${Math.random()*10-5}px)`}}/>))}<div style={{fontFamily:'monospace',fontSize:'0.9rem',color:'#a06880',textShadow:'0 0 8px rgba(160,100,130,0.6)',animation:'glitchText 0.12s infinite',textAlign:'center',zIndex:10}}>{phase>0&&msgs[phase-1]}</div></div>);
}

function CharacterSite({ onBack }) {
    const [selected, setSelected] = useState(null);
    const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);
    useEffect(() => { const h=()=>setIsMobile(window.innerWidth<=768); window.addEventListener('resize',h); return()=>window.removeEventListener('resize',h); }, []);

    const list = Object.entries(characters);

    return (
        <div style={{minHeight:'100vh',background:'#0a0810',padding:isMobile?'20px 12px':'32px 18px'}}>
            <header style={{textAlign:'center',marginBottom:isMobile?'22px':'36px'}}>
                <button onClick={onBack} style={{position:'absolute',top:'20px',left:'20px',padding:'8px 16px',background:'rgba(60,50,80,0.7)',border:'1px solid #4a4060',color:'#b0a0c8',borderRadius:'8px',cursor:'pointer',fontSize:'0.8rem'}}>← 돌아가기</button>
                <div style={{fontSize:'0.65rem',color:'#6b6480',letterSpacing:'0.2em',marginBottom:'6px'}}>CHARACTER</div>
                <h1 style={{fontFamily:"'Noto Serif KR',serif",fontSize:isMobile?'1.3rem':'1.7rem',color:'#e8e6ed'}}>등장인물</h1>
                <div style={{width:'50px',height:'1px',background:'#3d3850',margin:'10px auto 0'}}/>
            </header>

            <div style={{display:'grid',gridTemplateColumns:isMobile?'repeat(2,1fr)':'repeat(auto-fit,minmax(170px,1fr))',gap:isMobile?'8px':'14px',maxWidth:'980px',margin:'0 auto'}}>
                {list.map(([k,c],i)=>(
                    <div key={k} onClick={()=>{playSfx('click');setSelected(k);}} style={{background:'#14121a',border:'1px solid #1a1820',borderRadius:'10px',overflow:'hidden',cursor:'pointer',animation:`slideUp 0.5s cubic-bezier(0.16,1,0.3,1) ${i*0.05}s both`}}>
                        <div style={{width:'100%',height:isMobile?'140px':'195px',background:'#100e16',display:'flex',justifyContent:'center',alignItems:'center',borderBottom:'1px solid #1a1820'}}>
                            {IMAGES[`full${k.charAt(0).toUpperCase()+k.slice(1)}`]?<img src={IMAGES[`full${k.charAt(0).toUpperCase()+k.slice(1)}`]} style={{maxHeight:'100%',maxWidth:'100%',objectFit:'cover'}}/>:<span style={{color:'#2a2836',fontSize:'0.55rem'}}>[ {c.name} ]</span>}
                        </div>
                        <div style={{padding:isMobile?'9px':'12px'}}>
                            <div style={{color:c.color,fontSize:isMobile?'0.52rem':'0.6rem',marginBottom:'2px'}}>{c.description}</div>
                            <h3 style={{color:'#e8e6ed',fontSize:isMobile?'0.85rem':'0.95rem',marginBottom:'4px',fontWeight:500}}>{c.fullName}</h3>
                            {c.personality&&<div style={{color:'#6b6480',fontSize:isMobile?'0.62rem':'0.7rem'}}>{c.personality}</div>}
                        </div>
                    </div>
                ))}
            </div>

            {selected&&(
                <div onClick={()=>setSelected(null)} style={{position:'fixed',inset:0,background:'rgba(5,4,10,0.95)',display:'flex',justifyContent:'center',alignItems:'center',zIndex:1000,padding:'12px',animation:'fadeIn 0.35s'}}>
                    <div onClick={e=>e.stopPropagation()} style={{width:'100%',maxWidth:isMobile?'100%':'800px',height:isMobile?'86vh':'76vh',maxHeight:isMobile?'none':'540px',background:'#100e16',border:`1px solid ${characters[selected].color}40`,borderRadius:'14px',display:'flex',flexDirection:isMobile?'column':'row',position:'relative',overflow:'hidden'}}>
                        <div style={{flex:isMobile?'0 0 40%':1,background:'#0a0810',display:'flex',justifyContent:'center',alignItems:'center',borderRight:isMobile?'none':'1px solid #1a1820',borderBottom:isMobile?'1px solid #1a1820':'none'}}>
                            {IMAGES[`full${selected.charAt(0).toUpperCase()+selected.slice(1)}`]?<img src={IMAGES[`full${selected.charAt(0).toUpperCase()+selected.slice(1)}`]} style={{maxHeight:'100%',maxWidth:'100%',objectFit:'contain'}}/>:<div style={{color:'#2a2836',fontSize:'0.7rem'}}>[ 전신 이미지 ]</div>}
                        </div>
                        <div style={{flex:1,padding:isMobile?'16px':'24px',display:'flex',flexDirection:'column',overflow:'auto'}}>
                            <button onClick={()=>setSelected(null)} style={{position:'absolute',top:'10px',right:'10px',background:'transparent',border:'1px solid #3d3850',color:'#6b6480',width:'28px',height:'28px',cursor:'pointer',fontSize:'0.9rem',borderRadius:'50%'}}>✕</button>
                            <div style={{marginBottom:'14px'}}>
                                <div style={{color:characters[selected].color,fontSize:'0.65rem',marginBottom:'4px'}}>{characters[selected].description}</div>
                                <h2 style={{color:'#e8e6ed',fontSize:isMobile?'1.3rem':'1.5rem',fontFamily:"'Noto Serif KR',serif"}}>{characters[selected].fullName}</h2>
                            </div>
                            <div style={{display:'flex',flexWrap:'wrap',gap:'5px',marginBottom:'14px'}}>
                                {characters[selected].tags.map((t,i)=><span key={i} style={{padding:'3px 9px',background:`${characters[selected].color}18`,border:`1px solid ${characters[selected].color}30`,borderRadius:'10px',fontSize:'0.65rem',color:characters[selected].color}}>{t}</span>)}
                            </div>
                            <div style={{width:'100%',height:'1px',background:'#1a1820',marginBottom:'14px'}}/>
                            <div style={{padding:'10px 14px',background:'#0a0810',borderRadius:'8px',borderLeft:`2px solid ${characters[selected].color}`,marginBottom:'14px'}}>
                                <div style={{color:'#6b6480',fontSize:'0.6rem',marginBottom:'3px'}}>QUOTE</div>
                                <div style={{color:'#c8c4d4',fontSize:isMobile?'0.82rem':'0.9rem',fontStyle:'italic',lineHeight:1.5}}>"{characters[selected].quote}"</div>
                            </div>
                        </div>
                    </div>
                </div>
            )}

            <footer style={{textAlign:'center',marginTop:isMobile?'30px':'45px',padding:'18px',borderTop:'1px solid #1a1820'}}><p style={{color:'#3d3850',fontSize:'0.6rem'}}>made by CowardMole</p></footer>
        </div>
    );
}

function App() {
    const [screen, setScreen] = useState('popup');
    const [startChapter, setStartChapter] = useState('chapter1');
    const [startSceneIndex, setStartSceneIndex] = useState(0);
    const [startDialogIndex, setStartDialogIndex] = useState(0);
    const [affection, setAffection] = useState({...DEFAULT_AFFECTION});

    const handleStart = () => { 
        setAffection({...DEFAULT_AFFECTION}); 
        setStartChapter('chapter1'); 
        setStartSceneIndex(0);
        setStartDialogIndex(0);
        setScreen('game'); 
    };
    
    const handleLoadFromTitle = (saveData) => {
        setStartChapter(saveData.currentChapter);
        setStartSceneIndex(saveData.sceneIndex);
        setStartDialogIndex(saveData.dialogIndex);
        setAffection(saveData.affection);
        setScreen('game');
    };

    const handleTitle = () => { setScreen('title'); };
    const handleCharacter = () => { setScreen('character'); };

    return (
        <div id="game-container" style={{minHeight:'100vh'}}>
            {screen === 'popup' && <StartPopup onClose={()=>setScreen('title')}/>}
            {screen === 'title' && <TitleScreen onStart={handleStart} onLoad={handleLoadFromTitle} onCharacter={handleCharacter}/>}
            {screen === 'character' && <CharacterSite onBack={()=>setScreen('title')}/>}
            {screen === 'game' && <GameScreen 
                startChapter={startChapter} 
                startSceneIndex={startSceneIndex}
                startDialogIndex={startDialogIndex}
                onGlitch={()=>setScreen('glitch')} 
                onTitle={handleTitle}
                affection={affection} 
                setAffection={setAffection}
            />}
            {screen === 'glitch' && <GlitchScreen onComplete={()=>setScreen('character')}/>}
        </div>
    );
}

ReactDOM.render(<App/>, document.getElementById('root'));
    </script>
</body>
