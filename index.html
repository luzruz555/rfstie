const SAVE_SLOTS = 3;

const saveGame = (slot, gameState) => {
    const saveData = {
        ...gameState,
        timestamp: new Date().toISOString(),
        version: '1.0'
    };
    localStorage.setItem(`visualnovel_save_${slot}`, JSON.stringify(saveData));
    return true;
};

const loadGame = (slot) => {
    const data = localStorage.getItem(`visualnovel_save_${slot}`);
    if (data) {
        return JSON.parse(data);
    }
    return null;
};

const getSaveInfo = (slot) => {
    const data = localStorage.getItem(`visualnovel_save_${slot}`);
    if (data) {
        const parsed = JSON.parse(data);
        return {
            exists: true,
            chapter: parsed.currentChapter,
            timestamp: parsed.timestamp,
            affection: parsed.affection
        };
    }
    return { exists: false };
};

const deleteSave = (slot) => {
    localStorage.removeItem(`visualnovel_save_${slot}`);
};

const stopBgm = () => { if(currentBgm){currentBgm.pause();currentBgm=null;} };
