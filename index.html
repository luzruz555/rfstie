<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>제국 최강이 되기까지</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #1a1520;
            color: #f5f0f8;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #root {
            min-height: 100vh;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.03); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes glitch {
            0% { transform: translate(0); filter: hue-rotate(0deg); }
            20% { transform: translate(-5px, 5px); filter: hue-rotate(90deg); }
            40% { transform: translate(-5px, -5px); filter: hue-rotate(180deg); }
            60% { transform: translate(5px, 5px); filter: hue-rotate(270deg); }
            80% { transform: translate(5px, -5px); filter: hue-rotate(360deg); }
            100% { transform: translate(0); filter: hue-rotate(0deg); }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes triangleBlink {
            0%, 100% { opacity: 1; transform: translateY(0); }
            50% { opacity: 0.3; transform: translateY(3px); }
        }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .char-idle { animation: float 3s ease-in-out infinite; }
        .char-happy { animation: bounce 0.5s ease-in-out; }
        .char-angry { animation: shake 0.35s ease-in-out; }
        .char-sad { filter: brightness(0.85) saturate(0.9); }
        .char-surprise { animation: pulse 0.4s ease-in-out; }

        @media (max-width: 768px) {
            .desktop-only { display: none !important; }
        }
        @media (min-width: 769px) {
            .mobile-only { display: none !important; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1520; }
        ::-webkit-scrollbar-thumb { background: #c9a0dc; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        // ========================================
        // 🎵 효과음 설정
        // ========================================
        const SOUNDS = {
            click: null,
            select: null,
            type: null,
            transition: null,
            glitch: null,
            error: null,
        };

        const playSound = (type) => {
            if (SOUNDS[type]) {
                const audio = new Audio(SOUNDS[type]);
                audio.volume = 0.5;
                audio.play().catch(() => {});
            }
        };

        // ========================================
        // 🖼️ 이미지 설정
        // ========================================
        const IMAGES = {
            titleLogo: null,
            titleBackground: null,
            titleCharacter: null,
            gameBackground: null,
            charKairen: null,
            charLizette: null,
            charAdeline: null,
            charKaren: null,
            charElia: null,
            charSelene: null,
            charLuna: null,
            fullKairen: null,
            fullLizette: null,
            fullAdeline: null,
            fullKaren: null,
            fullElia: null,
            fullSelene: null,
            fullLuna: null,
        };

        // ========================================
        // 캐릭터 데이터
        // ========================================
        const characters = {
            kairen: {
                name: "카이른",
                fullName: "카이른 폰 레이센",
                color: "#c9a0dc",
                subColor: "#e8d5f0",
                description: "숨겨진 황자",
                tags: ["#숨겨진_황자", "#계산적", "#온화한_미소", "#먼치킨"],
                quote: "모두 내게 소중하지만... 가장 소중한 건 따로 있지.",
                standingImage: IMAGES.charKairen,
                fullImage: IMAGES.fullKairen
            },
            lizette: {
                name: "리제트",
                fullName: "리제트 밀러",
                color: "#ffb6c1",
                subColor: "#ffe4e8",
                affection: 97,
                personality: "소심 · 집착",
                description: "남주 소꿉친구 하녀",
                tags: ["#소꿉친구", "#소심", "#조용한_집착", "#하녀"],
                quote: "도, 도련님... 저는 언제까지나 곁에 있을게요...",
                standingImage: IMAGES.charLizette,
                fullImage: IMAGES.fullLizette
            },
            adeline: {
                name: "아델린",
                fullName: "아델린 폰 크로이츠",
                color: "#ffd700",
                subColor: "#fff4cc",
                affection: 89,
                personality: "츤데레",
                description: "공작가 영애",
                tags: ["#공작영애", "#츤데레", "#도도함", "#순정"],
                quote: "착각하지 마세요. 전 그저 의무를 다할 뿐이에요.",
                standingImage: IMAGES.charAdeline,
                fullImage: IMAGES.fullAdeline
            },
            karen: {
                name: "카렌",
                fullName: "카렌 폰 슈테른",
                color: "#87ceeb",
                subColor: "#d4f1f9",
                affection: 85,
                personality: "무감정",
                description: "황실 근위대장",
                tags: ["#근위대장", "#무표정", "#실력주의", "#쿨뷰티"],
                quote: "...명령이라면 따르겠습니다.",
                standingImage: IMAGES.charKaren,
                fullImage: IMAGES.fullKaren
            },
            elia: {
                name: "엘리아",
                fullName: "엘리아 폰 베른트",
                color: "#ff8a80",
                subColor: "#ffcdd2",
                affection: 82,
                personality: "욕데레",
                description: "유저 소꿉친구 기사",
                tags: ["#소꿉친구", "#욕쟁이", "#츤츤", "#여린_속마음"],
                quote: "하... 진짜, 너 같은 멍청이는 내가 없으면 안 돼.",
                standingImage: IMAGES.charElia,
                fullImage: IMAGES.fullElia
            },
            selene: {
                name: "셀레네",
                fullName: "셀레네 아르카디엔",
                color: "#da70d6",
                subColor: "#f0d0f0",
                affection: 94,
                personality: "소유욕",
                description: "제3황녀",
                tags: ["#황녀", "#소유욕", "#우아함", "#집착"],
                quote: "후후, 폐하는 제 것이에요. 누구도 가져갈 수 없죠.",
                standingImage: IMAGES.charSelene,
                fullImage: IMAGES.fullSelene
            },
            luna: {
                name: "루나",
                fullName: "루나",
                color: "#ff9a9e",
                subColor: "#fecfef",
                affection: 78,
                personality: "메스가키",
                description: "유저 의붓동생",
                tags: ["#의붓동생", "#메스가키", "#츤데레", "#경멸"],
                quote: "흥, 뭐야 그 눈. 오빠라고? 웃기지 마세요~",
                standingImage: IMAGES.charLuna,
                fullImage: IMAGES.fullLuna
            }
        };

        // ========================================
        // 타이틀 화면
        // ========================================
        function TitleScreen({ onStart }) {
            const [sparkles, setSparkles] = useState([]);
            const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);

            useEffect(() => {
                const handleResize = () => setIsMobile(window.innerWidth <= 768);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            useEffect(() => {
                const interval = setInterval(() => {
                    setSparkles(prev => [...prev.slice(-15), {
                        id: Date.now(),
                        x: Math.random() * 100,
                        y: Math.random() * 100,
                        size: Math.random() * 6 + 3,
                        color: ['#ffb6c1', '#c9a0dc', '#87ceeb', '#ffd700'][Math.floor(Math.random() * 4)]
                    }]);
                }, 300);
                return () => clearInterval(interval);
            }, []);

            const handleStart = () => {
                playSound('select');
                setTimeout(onStart, 100);
            };

            const renderTitleLogo = () => {
                if (IMAGES.titleLogo) {
                    return <img src={IMAGES.titleLogo} alt="제국 최강이 되기까지" style={{ maxWidth: isMobile ? '280px' : '400px', height: 'auto' }} />;
                }
                return (
                    <div style={{ padding: '30px 40px', border: '2px dashed rgba(201, 160, 220, 0.4)', borderRadius: '15px', background: 'rgba(201, 160, 220, 0.05)' }}>
                        <div style={{ fontSize: '0.75rem', color: '#c9a0dc', marginBottom: '8px', opacity: 0.7 }}>[ 타이틀 로고 이미지 ]</div>
                        <div style={{ fontSize: isMobile ? '1.6rem' : '2.2rem', fontFamily: "'Noto Serif KR', serif", fontWeight: 900, color: '#e8d5f0', textShadow: '0 0 20px rgba(201, 160, 220, 0.5)' }}>
                            제국 최강이 되기까지
                        </div>
                    </div>
                );
            };

            const MenuButton = ({ text, isMain, onClick, delay }) => (
                <button
                    onClick={onClick}
                    style={{
                        padding: isMobile ? '14px 30px' : '16px 40px',
                        fontSize: isMobile ? '0.95rem' : '1rem',
                        fontFamily: "'Noto Sans KR', sans-serif",
                        fontWeight: isMain ? 700 : 500,
                        background: isMain
                            ? 'linear-gradient(135deg, #c9a0dc 0%, #e8d5f0 50%, #c9a0dc 100%)'
                            : 'linear-gradient(135deg, rgba(60, 50, 70, 0.9) 0%, rgba(40, 35, 50, 0.9) 100%)',
                        border: isMain ? 'none' : '1px solid rgba(201, 160, 220, 0.3)',
                        color: isMain ? '#2a1f35' : '#c9a0dc',
                        borderRadius: '25px',
                        cursor: isMain ? 'pointer' : 'default',
                        letterSpacing: '0.08em',
                        transition: 'all 0.3s ease',
                        boxShadow: isMain ? '0 4px 20px rgba(201, 160, 220, 0.4)' : 'none',
                        opacity: isMain ? 1 : 0.5,
                        animation: `fadeIn 0.4s ease-out ${delay}s both`,
                        width: '100%',
                        maxWidth: '240px'
                    }}
                >
                    {isMain && <span style={{ marginRight: '8px' }}>▶</span>}
                    {text}
                </button>
            );

            if (isMobile) {
                return (
                    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', background: 'linear-gradient(180deg, #2a1f35 0%, #1a1520 100%)', position: 'relative', overflow: 'hidden' }}>
                        <div style={{ position: 'absolute', inset: 0, background: IMAGES.titleBackground ? `url(${IMAGES.titleBackground}) center/cover` : 'radial-gradient(ellipse at 50% 30%, rgba(201, 160, 220, 0.1) 0%, transparent 60%)' }} />
                        
                        {sparkles.map(s => (
                            <div key={s.id} style={{ position: 'absolute', left: `${s.x}%`, top: `${s.y}%`, width: s.size, height: s.size, background: s.color, borderRadius: '50%', animation: 'sparkle 1.5s ease-out forwards', pointerEvents: 'none', boxShadow: `0 0 ${s.size}px ${s.color}` }} />
                        ))}

                        <div style={{ flex: 1, display: 'flex', justifyContent: 'center', alignItems: 'flex-end', padding: '20px', position: 'relative', zIndex: 1 }}>
                            {IMAGES.titleCharacter ? (
                                <img src={IMAGES.titleCharacter} alt="" style={{ maxHeight: '100%', maxWidth: '100%', objectFit: 'contain' }} />
                            ) : (
                                <div style={{ color: 'rgba(201, 160, 220, 0.3)', fontSize: '0.75rem', padding: '40px', border: '1px dashed rgba(201, 160, 220, 0.2)', borderRadius: '10px' }}>[ 타이틀 캐릭터 이미지 ]</div>
                            )}
                        </div>

                        <div style={{ background: 'linear-gradient(180deg, transparent, rgba(26, 21, 32, 0.98) 30%)', padding: '30px 20px 40px', position: 'relative', zIndex: 2 }}>
                            <div style={{ textAlign: 'center', marginBottom: '25px' }}>{renderTitleLogo()}</div>
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', alignItems: 'center' }}>
                                {['GAME START', 'DATA LOAD', 'CONFIG', 'GALLERY', 'EXIT'].map((text, i) => (
                                    <MenuButton key={text} text={text} isMain={text === 'GAME START'} onClick={text === 'GAME START' ? handleStart : () => playSound('click')} delay={i * 0.05} />
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div style={{ height: '100vh', position: 'relative', overflow: 'hidden', background: 'linear-gradient(135deg, #2a1f35 0%, #1a1520 100%)' }}>
                    <div style={{ position: 'absolute', inset: 0, background: IMAGES.titleBackground ? `url(${IMAGES.titleBackground}) center/cover` : 'radial-gradient(ellipse at 30% 50%, rgba(201, 160, 220, 0.08) 0%, transparent 50%)' }}>
                        <div style={{ position: 'absolute', left: '0', bottom: 0, width: '55%', height: '95%', display: 'flex', justifyContent: 'center', alignItems: 'flex-end' }}>
                            {IMAGES.titleCharacter ? (
                                <img src={IMAGES.titleCharacter} alt="" style={{ maxHeight: '100%', maxWidth: '100%', objectFit: 'contain' }} />
                            ) : (
                                <div style={{ color: 'rgba(201, 160, 220, 0.3)', fontSize: '0.85rem', padding: '50px', border: '1px dashed rgba(201, 160, 220, 0.2)', borderRadius: '12px' }}>[ 타이틀 캐릭터 이미지 ]</div>
                            )}
                        </div>
                    </div>

                    {sparkles.map(s => (
                        <div key={s.id} style={{ position: 'absolute', left: `${s.x}%`, top: `${s.y}%`, width: s.size, height: s.size, background: s.color, borderRadius: '50%', animation: 'sparkle 1.5s ease-out forwards', pointerEvents: 'none', boxShadow: `0 0 ${s.size}px ${s.color}` }} />
                    ))}

                    <div style={{ position: 'absolute', right: 0, top: 0, bottom: 0, width: '45%', background: 'linear-gradient(90deg, transparent, rgba(26, 21, 32, 0.97) 25%)', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', padding: '40px' }}>
                        <div style={{ textAlign: 'center', marginBottom: '50px' }}>{renderTitleLogo()}</div>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', alignItems: 'center', width: '100%' }}>
                            {['GAME START', 'DATA LOAD', 'CONFIG', 'GALLERY', 'EXIT'].map((text, i) => (
                                <MenuButton key={text} text={text} isMain={text === 'GAME START'} onClick={text === 'GAME START' ? handleStart : () => playSound('click')} delay={i * 0.06} />
                            ))}
                        </div>
                        <div style={{ position: 'absolute', bottom: '20px', fontSize: '0.7rem', color: 'rgba(201, 160, 220, 0.3)' }}>© 2024 Imperial Romance Studio</div>
                    </div>
                </div>
            );
        }

        // ========================================
        // 로딩 화면
        // ========================================
        function LoadingScreen({ onComplete }) {
            const [progress, setProgress] = useState(0);
            const [showCheckpoint, setShowCheckpoint] = useState(false);

            useEffect(() => {
                const interval = setInterval(() => {
                    setProgress(prev => {
                        if (prev >= 100) {
                            clearInterval(interval);
                            playSound('transition');
                            setTimeout(() => setShowCheckpoint(true), 400);
                            return 100;
                        }
                        return prev + Math.random() * 15 + 8;
                    });
                }, 150);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                if (showCheckpoint) {
                    const timer = setTimeout(() => { playSound('select'); onComplete(); }, 2000);
                    return () => clearTimeout(timer);
                }
            }, [showCheckpoint, onComplete]);

            return (
                <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', background: 'linear-gradient(180deg, #2a1f35 0%, #1a1520 100%)', padding: '20px' }}>
                    {!showCheckpoint ? (
                        <>
                            <div style={{ marginBottom: '1.5rem', color: '#c9a0dc', letterSpacing: '0.2em', fontSize: 'clamp(0.8rem, 2vw, 0.9rem)' }}>Now Loading...</div>
                            <div style={{ width: '100%', maxWidth: '300px', height: '8px', background: 'rgba(201, 160, 220, 0.1)', borderRadius: '4px', overflow: 'hidden' }}>
                                <div style={{ width: `${Math.min(progress, 100)}%`, height: '100%', background: 'linear-gradient(90deg, #c9a0dc, #ffb6c1, #c9a0dc)', backgroundSize: '200% 100%', animation: 'shimmer 1.5s infinite', transition: 'width 0.15s ease', borderRadius: '4px' }} />
                            </div>
                            <div style={{ marginTop: '1rem', color: 'rgba(201, 160, 220, 0.5)', fontSize: '0.8rem' }}>{Math.min(Math.floor(progress), 100)}%</div>
                        </>
                    ) : (
                        <div style={{ textAlign: 'center', animation: 'fadeIn 0.4s ease-out' }}>
                            <div style={{ fontSize: 'clamp(1rem, 3vw, 1.2rem)', color: '#ffb6c1', marginBottom: '1rem' }}>💾 저장 데이터 발견</div>
                            <div style={{ fontSize: 'clamp(0.9rem, 2.5vw, 1rem)', color: '#e8d5f0' }}>마지막 체크포인트에서 시작합니다</div>
                            <div style={{ marginTop: '1.5rem', fontSize: 'clamp(0.8rem, 2vw, 0.9rem)', color: '#c9a0dc', padding: '12px 30px', background: 'rgba(201, 160, 220, 0.1)', border: '1px solid rgba(201, 160, 220, 0.2)', borderRadius: '20px' }}>Chapter 12: 황제의 즉위식</div>
                        </div>
                    )}
                </div>
            );
        }

        // ========================================
        // 호감도 UI (PC 더 크게)
        // ========================================
        function AffectionUI({ affections, isMobile }) {
            const charList = ['lizette', 'adeline', 'karen', 'elia', 'selene', 'luna'];

            if (isMobile) {
                return (
                    <div style={{ position: 'absolute', top: '10px', right: '10px', background: 'rgba(26, 21, 32, 0.95)', border: '1px solid rgba(201, 160, 220, 0.3)', borderRadius: '12px', padding: '10px 12px', minWidth: '130px', zIndex: 100, backdropFilter: 'blur(10px)' }}>
                        <div style={{ textAlign: 'center', fontSize: '0.65rem', color: '#ffb6c1', marginBottom: '8px', paddingBottom: '6px', borderBottom: '1px solid rgba(201, 160, 220, 0.2)' }}>♥ AFFECTION</div>
                        {charList.map(key => (
                            <div key={key} style={{ marginBottom: '5px' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.6rem', marginBottom: '2px' }}>
                                    <span style={{ color: characters[key].color }}>{characters[key].name}</span>
                                    <span style={{ color: '#e8d5f0' }}>{affections[key]}</span>
                                </div>
                                <div style={{ height: '4px', background: 'rgba(201, 160, 220, 0.1)', borderRadius: '2px', overflow: 'hidden' }}>
                                    <div style={{ width: `${affections[key]}%`, height: '100%', background: `linear-gradient(90deg, ${characters[key].color}88, ${characters[key].color})`, transition: 'width 0.5s ease', borderRadius: '2px' }} />
                                </div>
                            </div>
                        ))}
                    </div>
                );
            }

            return (
                <div style={{ position: 'absolute', top: '15px', right: '15px', background: 'linear-gradient(135deg, rgba(30, 25, 38, 0.97) 0%, rgba(26, 21, 32, 0.97) 100%)', border: '2px solid rgba(201, 160, 220, 0.4)', borderRadius: '16px', padding: '20px 25px', minWidth: '250px', boxShadow: '0 8px 32px rgba(0,0,0,0.4)', zIndex: 100, backdropFilter: 'blur(10px)' }}>
                    <div style={{ textAlign: 'center', fontSize: '1rem', color: '#ffb6c1', marginBottom: '18px', paddingBottom: '14px', borderBottom: '1px solid rgba(201, 160, 220, 0.2)', letterSpacing: '0.1em', fontWeight: 600 }}>♥ AFFECTION ♥</div>
                    {charList.map(key => (
                        <div key={key} style={{ marginBottom: '14px' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.95rem', marginBottom: '5px', alignItems: 'center' }}>
                                <span style={{ color: characters[key].color, fontWeight: 500 }}>{characters[key].name}</span>
                                <span style={{ color: '#e8d5f0', fontSize: '1rem', fontWeight: 700 }}>{affections[key]}</span>
                            </div>
                            <div style={{ height: '10px', background: 'rgba(201, 160, 220, 0.1)', borderRadius: '5px', overflow: 'hidden' }}>
                                <div style={{ width: `${affections[key]}%`, height: '100%', background: `linear-gradient(90deg, ${characters[key].color}66, ${characters[key].color})`, transition: 'width 0.5s ease', borderRadius: '5px', boxShadow: `0 0 12px ${characters[key].color}40` }} />
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        // ========================================
        // 게임 화면
        // ========================================
        function GameScreen({ onGlitch }) {
            const [dialogIndex, setDialogIndex] = useState(0);
            const [showChoices, setShowChoices] = useState(false);
            const [selectedChoice, setSelectedChoice] = useState(null);
            const [charEmotion, setCharEmotion] = useState('idle');
            const [displayedText, setDisplayedText] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [phase, setPhase] = useState('dialog');
            const [affections, setAffections] = useState({ lizette: 97, adeline: 89, karen: 85, elia: 82, selene: 94, luna: 78 });
            const [afterChoiceIndex, setAfterChoiceIndex] = useState(0);
            const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);
            const [currentSpeaker, setCurrentSpeaker] = useState(null);
            const [isAuto, setIsAuto] = useState(false);
            const [canProceed, setCanProceed] = useState(false);

            useEffect(() => {
                const handleResize = () => setIsMobile(window.innerWidth <= 768);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const dialogs = useMemo(() => [
                { speaker: "selene", text: "폐하, 오늘 즉위식 정말 멋지셨어요.", emotion: "happy" },
                { speaker: "selene", text: "역시 제 남편이시네요. 후후.", emotion: "happy" },
                { speaker: "adeline", text: "...흥, 황후라고 너무 나서는 거 아니에요?", emotion: "angry" },
                { speaker: "adeline", text: "폐하께서는 모두의 것이에요.", emotion: "angry" },
                { speaker: "selene", text: "후후, 무슨 말씀이세요. 폐하는 제 것인걸요.", emotion: "happy" },
                { speaker: "lizette", text: "저, 저기... 저도 폐하 곁에 있고 싶어요...", emotion: "sad" },
                { speaker: "elia", text: "하... 진짜 꼴보기 싫다. 너네 둘 다 좀 조용히 해.", emotion: "angry" },
                { speaker: "luna", text: "흥, 언니들 싸우는 거 재밌네요~ 폐하는 어떻게 생각하세요?", emotion: "happy" },
                { speaker: "karen", text: "...시끄럽군.", emotion: "idle" },
                { speaker: "narrator", text: "여섯 쌍의 눈이 당신을 바라본다.", emotion: "idle" }
            ], []);

            const choices = useMemo(() => [
                { text: "셀레네의 손을 잡으며 웃는다", effects: { selene: +5, adeline: -8, lizette: -5, luna: -3 } },
                { text: "조용히 미소만 짓는다", effects: { karen: +3 } },
                { text: "리제트에게 다가가 머리를 쓰다듬는다", effects: { lizette: +10, selene: -10, adeline: -5, luna: -5 } }
            ], []);

            const afterDialogs = useMemo(() => [
                [
                    { speaker: "selene", text: "후후... 역시 폐하는 절 가장 사랑하시는 거죠?", emotion: "happy" },
                    { speaker: "adeline", text: "...!", emotion: "surprise" },
                    { speaker: "lizette", text: "도련님... 아, 폐하...", emotion: "sad" },
                    { speaker: "kairen", text: "모두 내게 소중하지만, 오늘은—", emotion: "idle" }
                ],
                [
                    { speaker: "luna", text: "에이~ 폐하 비겁해요! 확실히 말해주세요!", emotion: "angry" },
                    { speaker: "karen", text: "...현명한 판단이군.", emotion: "idle" },
                    { speaker: "elia", text: "뭐야, 재미없게. 그냥 아무나 찍어.", emotion: "angry" },
                    { speaker: "kairen", text: "허허, 모두 진정하게. 나는—", emotion: "idle" }
                ],
                [
                    { speaker: "lizette", text: "폐, 폐하...! 저, 저는... 행복해요...", emotion: "happy" },
                    { speaker: "selene", text: "...폐하?", emotion: "angry" },
                    { speaker: "adeline", text: "저, 저 하녀한테...?!", emotion: "surprise" },
                    { speaker: "kairen", text: "리제트, 너는 처음부터 내 곁에—", emotion: "idle" }
                ]
            ], []);

            const getCurrentDialog = useCallback(() => {
                if (phase === 'afterChoice' && selectedChoice !== null) {
                    return afterDialogs[selectedChoice][afterChoiceIndex];
                }
                return dialogs[dialogIndex];
            }, [phase, selectedChoice, afterChoiceIndex, dialogIndex, afterDialogs, dialogs]);

            // 타이핑 효과
            useEffect(() => {
                const current = getCurrentDialog();
                if (!current) return;

                setIsTyping(true);
                setDisplayedText('');
                setCharEmotion(current.emotion);
                setCurrentSpeaker(current.speaker);
                setCanProceed(false);
                let i = 0;

                const interval = setInterval(() => {
                    if (i < current.text.length) {
                        setDisplayedText(current.text.slice(0, i + 1));
                        if (i % 3 === 0) playSound('type');
                        i++;
                    } else {
                        clearInterval(interval);
                        setIsTyping(false);
                        setCanProceed(true);
                    }
                }, 30);

                return () => clearInterval(interval);
            }, [dialogIndex, afterChoiceIndex, phase, selectedChoice, getCurrentDialog]);

            // 오토 모드
            useEffect(() => {
                if (!isAuto || isTyping || !canProceed) return;

                const timer = setTimeout(() => {
                    proceedDialog();
                }, 1500);

                return () => clearTimeout(timer);
            }, [isAuto, isTyping, canProceed]);

            const proceedDialog = useCallback(() => {
                if (!canProceed) return;

                playSound('click');

                if (phase === 'dialog') {
                    if (dialogIndex < dialogs.length - 1) {
                        setDialogIndex(d => d + 1);
                    } else {
                        setPhase('choice');
                        setShowChoices(true);
                    }
                } else if (phase === 'afterChoice' && selectedChoice !== null) {
                    const arr = afterDialogs[selectedChoice];
                    if (afterChoiceIndex < arr.length - 1) {
                        setAfterChoiceIndex(i => i + 1);
                    } else {
                        setPhase('glitch');
                        onGlitch();
                    }
                }
            }, [canProceed, phase, dialogIndex, dialogs.length, afterDialogs, selectedChoice, afterChoiceIndex, onGlitch]);

            const handleChoice = (index) => {
                playSound('select');
                setShowChoices(false);
                setSelectedChoice(index);

                const fx = choices[index].effects;
                setAffections(prev => {
                    const n = { ...prev };
                    Object.entries(fx).forEach(([k, v]) => { n[k] = Math.max(0, Math.min(100, n[k] + v)); });
                    return n;
                });

                setAfterChoiceIndex(0);
                setPhase('afterChoice');
            };

            const handleScreenClick = (e) => {
                if (showChoices) return;
                if (e.target.closest('button')) return;
                
                if (isTyping) {
                    // 타이핑 중이면 전체 표시 (스킵)
                    return;
                }
                
                proceedDialog();
            };

            const current = getCurrentDialog();
            if (!current) return null;

            const speaker = current.speaker === 'narrator'
                ? { name: '', color: '#a0a0a0' }
                : { name: characters[current.speaker]?.name || '', color: characters[current.speaker]?.color || '#fff' };

            const emotionClass = { happy: 'char-happy', angry: 'char-angry', sad: 'char-sad', surprise: 'char-surprise', idle: 'char-idle' }[charEmotion] || 'char-idle';
            const currentStandingImage = currentSpeaker && currentSpeaker !== 'narrator' ? characters[currentSpeaker]?.standingImage : null;

            return (
                <div onClick={handleScreenClick} style={{ height: '100vh', position: 'relative', background: '#1a1520', overflow: 'hidden', cursor: showChoices ? 'default' : 'pointer' }}>
                    {/* 배경 */}
                    <div style={{ position: 'absolute', inset: 0, background: IMAGES.gameBackground ? `url(${IMAGES.gameBackground}) center/cover` : 'linear-gradient(180deg, rgba(42, 31, 53, 0.6) 0%, rgba(26, 21, 32, 0.8) 100%), radial-gradient(ellipse at 50% 30%, rgba(201, 160, 220, 0.05) 0%, transparent 60%), linear-gradient(135deg, #2a1f35, #1a1520)' }}>
                        {!IMAGES.gameBackground && (
                            <div style={{ position: 'absolute', top: '40%', left: '50%', transform: 'translate(-50%, -50%)', color: 'rgba(201, 160, 220, 0.2)', fontSize: isMobile ? '0.7rem' : '0.8rem' }}>[ 황궁 대전 배경 ]</div>
                        )}
                    </div>

                    {/* 상단 바 (데스크톱) */}
                    {!isMobile && (
                        <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: '50px', background: 'linear-gradient(180deg, rgba(26, 21, 32, 0.95) 0%, transparent 100%)', display: 'flex', justifyContent: 'flex-start', alignItems: 'center', padding: '0 20px', gap: '10px' }}>
                            {['SAVE', 'LOAD', 'TITLE', 'CONFIG'].map(t => (
                                <button key={t} onClick={(e) => { e.stopPropagation(); playSound('click'); }} style={{ padding: '6px 16px', fontSize: '0.75rem', background: 'rgba(201, 160, 220, 0.1)', border: '1px solid rgba(201, 160, 220, 0.3)', color: '#c9a0dc', borderRadius: '15px', cursor: 'pointer' }}>{t}</button>
                            ))}
                        </div>
                    )}

                    <AffectionUI affections={affections} isMobile={isMobile} />

                    {/* 캐릭터 */}
                    <div className={emotionClass} style={{ position: 'absolute', bottom: isMobile ? '170px' : '200px', left: '50%', transform: 'translateX(-50%)', width: isMobile ? '280px' : '400px', height: isMobile ? '320px' : '480px', display: 'flex', justifyContent: 'center', alignItems: 'flex-end' }}>
                        {currentStandingImage ? (
                            <img src={currentStandingImage} alt={speaker.name} style={{ maxHeight: '100%', maxWidth: '100%', objectFit: 'contain' }} />
                        ) : (
                            <div style={{ color: 'rgba(201, 160, 220, 0.3)', fontSize: isMobile ? '0.7rem' : '0.8rem', textAlign: 'center', padding: isMobile ? '20px' : '30px', border: '1px dashed rgba(201, 160, 220, 0.2)', borderRadius: '10px' }}>[ {speaker.name || '캐릭터'} 스탠딩 ]</div>
                        )}
                    </div>

                    {/* 대화창 */}
                    <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, padding: isMobile ? '12px' : '20px' }}>
                        <div style={{ maxWidth: '1000px', margin: '0 auto', background: 'linear-gradient(135deg, rgba(30, 25, 40, 0.97) 0%, rgba(40, 32, 50, 0.97) 100%)', border: '2px solid rgba(201, 160, 220, 0.4)', borderRadius: isMobile ? '12px' : '16px', padding: isMobile ? '15px 18px' : '22px 28px', position: 'relative', boxShadow: '0 -10px 40px rgba(0,0,0,0.4)', backdropFilter: 'blur(10px)' }}>
                            {/* 화자 이름 */}
                            {speaker.name && (
                                <div style={{ position: 'absolute', top: isMobile ? '-14px' : '-18px', left: isMobile ? '15px' : '25px', background: `linear-gradient(135deg, ${speaker.color}, ${characters[current.speaker]?.subColor || speaker.color})`, padding: isMobile ? '4px 18px' : '6px 25px', borderRadius: '20px', color: '#1a1520', fontSize: isMobile ? '0.8rem' : '0.9rem', fontWeight: 700, boxShadow: `0 3px 15px ${speaker.color}40` }}>{speaker.name}</div>
                            )}

                            {/* 대사 */}
                            <div style={{ fontSize: isMobile ? '0.95rem' : '1.1rem', lineHeight: 1.9, color: current.speaker === 'narrator' ? '#a0a0a0' : '#f5f0f8', fontStyle: current.speaker === 'narrator' ? 'italic' : 'normal', minHeight: isMobile ? '50px' : '65px', paddingTop: speaker.name ? '10px' : 0, display: 'flex', alignItems: 'center' }}>
                                <span>{displayedText}</span>
                                {isTyping && <span style={{ borderRight: '2px solid #c9a0dc', marginLeft: '2px', animation: 'blink 0.5s infinite' }}>&nbsp;</span>}
                                {!isTyping && canProceed && (
                                    <span style={{ marginLeft: '12px', color: '#ffb6c1', fontSize: '0.9rem', animation: 'triangleBlink 0.8s infinite' }}>▼</span>
                                )}
                            </div>

                            {/* 하단 버튼 */}
                            <div style={{ position: 'absolute', bottom: isMobile ? '10px' : '15px', right: isMobile ? '12px' : '20px', display: 'flex', gap: isMobile ? '6px' : '10px' }}>
                                {['SKIP', 'AUTO', 'LOG'].map(t => (
                                    <button key={t} onClick={(e) => { e.stopPropagation(); if (t === 'AUTO') { setIsAuto(!isAuto); } playSound('click'); }} style={{ padding: isMobile ? '4px 10px' : '6px 14px', fontSize: isMobile ? '0.65rem' : '0.75rem', background: t === 'AUTO' && isAuto ? 'rgba(255, 182, 193, 0.3)' : 'rgba(201, 160, 220, 0.1)', border: `1px solid ${t === 'AUTO' && isAuto ? '#ffb6c1' : 'rgba(201, 160, 220, 0.3)'}`, color: t === 'AUTO' && isAuto ? '#ffb6c1' : '#c9a0dc', borderRadius: '12px', cursor: 'pointer', fontWeight: t === 'AUTO' && isAuto ? 600 : 400 }}>{t}</button>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* 선택지 */}
                    {showChoices && (
                        <div style={{ position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)', display: 'flex', flexDirection: 'column', gap: isMobile ? '10px' : '12px', animation: 'fadeIn 0.3s ease-out', zIndex: 200, width: isMobile ? '90%' : 'auto', maxWidth: '450px' }}>
                            {choices.map((c, i) => (
                                <button key={i} onClick={() => handleChoice(i)} style={{ padding: isMobile ? '16px 24px' : '18px 35px', fontSize: isMobile ? '0.9rem' : '1rem', fontFamily: "'Noto Sans KR', sans-serif", background: 'linear-gradient(135deg, rgba(30, 25, 40, 0.98) 0%, rgba(45, 38, 55, 0.98) 100%)', border: '2px solid rgba(201, 160, 220, 0.5)', color: '#f5f0f8', cursor: 'pointer', borderRadius: '12px', textAlign: 'left', width: '100%', transition: 'all 0.2s ease' }}>
                                    <span style={{ color: '#ffb6c1', marginRight: '12px', fontWeight: 700 }}>▸</span>
                                    {c.text}
                                </button>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // ========================================
        // 글리치 화면
        // ========================================
        function GlitchScreen({ onComplete }) {
            const [phase, setPhase] = useState(0);
            const msgs = ["ERROR: UNEXPECTED_ENTITY_DETECTED", "WARNING: NARRATIVE_BREACH", "FATAL: OBSERVER_OVERFLOW", "SYSTEM FAILURE...", "TRANSFERRING...", "WELCOME TO YOUR NEW LIFE."];

            useEffect(() => {
                const timers = [
                    setTimeout(() => { setPhase(1); playSound('error'); }, 400),
                    setTimeout(() => { setPhase(2); playSound('glitch'); }, 1100),
                    setTimeout(() => { setPhase(3); playSound('glitch'); }, 1800),
                    setTimeout(() => { setPhase(4); playSound('error'); }, 2500),
                    setTimeout(() => { setPhase(5); playSound('transition'); }, 3200),
                    setTimeout(() => { setPhase(6); }, 4000),
                    setTimeout(onComplete, 5000)
                ];
                return () => timers.forEach(clearTimeout);
            }, [onComplete]);

            return (
                <div style={{ height: '100vh', background: '#000', display: 'flex', justifyContent: 'center', alignItems: 'center', position: 'relative', overflow: 'hidden' }}>
                    <div style={{ position: 'absolute', inset: 0, background: 'repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px)', pointerEvents: 'none', zIndex: 10 }} />
                    {phase >= 1 && phase < 5 && (
                        <div style={{ position: 'absolute', inset: 0, animation: 'glitch 0.1s infinite' }}>
                            {[...Array(15)].map((_, i) => (
                                <div key={i} style={{ position: 'absolute', top: `${Math.random() * 100}%`, left: 0, right: 0, height: `${Math.random() * 4 + 1}px`, background: `rgba(${200 + Math.random() * 55}, ${Math.random() * 100}, ${150 + Math.random() * 100}, ${Math.random() * 0.4 + 0.1})`, transform: `translateX(${Math.random() * 15 - 7}px)` }} />
                            ))}
                        </div>
                    )}
                    <div style={{ fontFamily: 'monospace', fontSize: phase >= 4 ? 'clamp(1.2rem, 4vw, 1.8rem)' : 'clamp(0.8rem, 2.5vw, 1rem)', color: phase >= 4 ? '#f5f0f8' : '#ff6b9d', textShadow: phase >= 4 ? '0 0 30px rgba(201, 160, 220, 0.8)' : '0 0 10px rgba(255, 107, 157, 0.8)', animation: phase < 4 ? 'glitch 0.25s infinite' : 'none', textAlign: 'center', zIndex: 20, padding: '20px' }}>{phase > 0 && msgs[phase - 1]}</div>
                </div>
            );
        }

        // ========================================
        // 캐릭터 사이트
        // ========================================
        function CharacterSite() {
            const [selected, setSelected] = useState(null);
            const [showIntro, setShowIntro] = useState(true);
            const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);

            useEffect(() => {
                const handleResize = () => setIsMobile(window.innerWidth <= 768);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            useEffect(() => {
                const t = setTimeout(() => { playSound('transition'); setShowIntro(false); }, 3000);
                return () => clearTimeout(t);
            }, []);

            if (showIntro) {
                return (
                    <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', background: 'linear-gradient(180deg, #2a1f35 0%, #1a1520 100%)', animation: 'fadeIn 0.8s ease-out', padding: '20px', textAlign: 'center' }}>
                        <div style={{ fontSize: 'clamp(1rem, 3vw, 1.3rem)', color: '#c9a0dc', marginBottom: '1rem', lineHeight: 1.8 }}>당신은 『제국 최강이 되기까지』의 세계에</div>
                        <div style={{ fontSize: 'clamp(2rem, 6vw, 2.8rem)', color: '#f5f0f8', fontWeight: 700, fontFamily: "'Noto Serif KR', serif", textShadow: '0 0 30px rgba(201, 160, 220, 0.5)' }}>빙의했습니다.</div>
                        <div style={{ marginTop: '3rem', padding: '18px 40px', background: 'rgba(201, 160, 220, 0.1)', border: '1px solid rgba(201, 160, 220, 0.3)', borderRadius: '25px' }}>
                            <div style={{ color: '#ffb6c1', fontSize: '0.8rem', marginBottom: '5px', letterSpacing: '0.1em' }}>YOUR ROLE</div>
                            <div style={{ color: '#f5f0f8', fontSize: 'clamp(1rem, 3vw, 1.2rem)', fontWeight: 500 }}>이름 없는 엑스트라 기사</div>
                        </div>
                    </div>
                );
            }

            const list = Object.entries(characters);

            return (
                <div style={{ minHeight: '100vh', background: 'linear-gradient(180deg, #1a1520 0%, #2a1f35 100%)', padding: isMobile ? '25px 15px' : '40px 20px' }}>
                    <header style={{ textAlign: 'center', marginBottom: isMobile ? '30px' : '45px', animation: 'fadeIn 0.6s ease-out' }}>
                        <div style={{ fontSize: '0.75rem', color: '#c9a0dc', letterSpacing: '0.3em', marginBottom: '10px' }}>✦ CHARACTER ✦</div>
                        <h1 style={{ fontFamily: "'Noto Serif KR', serif", fontSize: 'clamp(1.5rem, 4vw, 2.2rem)', color: '#f5f0f8', textShadow: '0 0 20px rgba(201, 160, 220, 0.3)' }}>등장인물</h1>
                        <div style={{ width: '100px', height: '2px', background: 'linear-gradient(90deg, transparent, #c9a0dc, transparent)', margin: '15px auto 0' }} />
                    </header>

                    <div style={{ display: 'grid', gridTemplateColumns: isMobile ? 'repeat(2, 1fr)' : 'repeat(auto-fit, minmax(200px, 1fr))', gap: isMobile ? '12px' : '18px', maxWidth: '1100px', margin: '0 auto' }}>
                        {list.map(([key, char], i) => (
                            <div key={key} onClick={() => { playSound('select'); setSelected(key); }} style={{ background: 'linear-gradient(135deg, rgba(35, 28, 45, 0.95) 0%, rgba(25, 20, 32, 0.95) 100%)', border: `2px solid ${char.color}30`, borderRadius: '16px', overflow: 'hidden', cursor: 'pointer', transition: 'all 0.3s ease', animation: `slideUp 0.4s ease-out ${i * 0.05}s both` }}>
                                <div style={{ width: '100%', height: isMobile ? '160px' : '230px', background: `linear-gradient(180deg, ${char.color}15, transparent)`, display: 'flex', justifyContent: 'center', alignItems: 'center', borderBottom: `1px solid ${char.color}20` }}>
                                    {char.fullImage ? <img src={char.fullImage} alt={char.name} style={{ maxHeight: '100%', maxWidth: '100%', objectFit: 'cover' }} /> : <span style={{ color: 'rgba(201, 160, 220, 0.2)', fontSize: '0.65rem' }}>[ 이미지 ]</span>}
                                </div>
                                <div style={{ padding: isMobile ? '12px' : '15px' }}>
                                    <div style={{ color: char.color, fontSize: isMobile ? '0.6rem' : '0.7rem', marginBottom: '4px' }}>{char.description}</div>
                                    <h3 style={{ color: '#f5f0f8', fontSize: isMobile ? '0.95rem' : '1.1rem', marginBottom: '6px', fontWeight: 600 }}>{char.fullName}</h3>
                                    {char.personality && <div style={{ color: '#a090b0', fontSize: isMobile ? '0.7rem' : '0.8rem' }}>{char.personality}</div>}
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* 모달 */}
                    {selected && (
                        <div onClick={() => { playSound('click'); setSelected(null); }} style={{ position: 'fixed', inset: 0, background: 'rgba(10, 8, 15, 0.95)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 1000, padding: '15px', animation: 'fadeIn 0.2s ease-out', backdropFilter: 'blur(10px)' }}>
                            <div onClick={e => e.stopPropagation()} style={{ width: '100%', maxWidth: isMobile ? '100%' : '900px', height: isMobile ? '90vh' : '80vh', maxHeight: isMobile ? 'none' : '600px', background: 'linear-gradient(135deg, #2a1f35 0%, #1a1520 100%)', border: `3px solid ${characters[selected].color}`, borderRadius: '20px', display: 'flex', flexDirection: isMobile ? 'column' : 'row', position: 'relative', overflow: 'hidden', boxShadow: `0 0 60px ${characters[selected].color}30` }}>
                                {/* 상단 글로우 */}
                                <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: '100px', background: `linear-gradient(180deg, ${characters[selected].color}20, transparent)`, pointerEvents: 'none' }} />

                                {/* 이미지 영역 */}
                                <div style={{ flex: isMobile ? '0 0 45%' : 1, background: `linear-gradient(180deg, ${characters[selected].color}10, transparent)`, display: 'flex', justifyContent: 'center', alignItems: 'center', borderRight: isMobile ? 'none' : `1px solid ${characters[selected].color}20`, borderBottom: isMobile ? `1px solid ${characters[selected].color}20` : 'none', position: 'relative' }}>
                                    {characters[selected].fullImage ? <img src={characters[selected].fullImage} alt={characters[selected].name} style={{ maxHeight: '100%', maxWidth: '100%', objectFit: 'contain' }} /> : <div style={{ color: 'rgba(201, 160, 220, 0.3)', fontSize: '0.8rem' }}>[ 전신 이미지 ]</div>}
                                </div>

                                {/* 정보 영역 */}
                                <div style={{ flex: 1, padding: isMobile ? '20px' : '30px', display: 'flex', flexDirection: 'column', position: 'relative', overflow: 'auto' }}>
                                    <button onClick={() => { playSound('click'); setSelected(null); }} style={{ position: 'absolute', top: '15px', right: '15px', background: 'rgba(201, 160, 220, 0.1)', border: `1px solid ${characters[selected].color}40`, color: characters[selected].color, width: '36px', height: '36px', cursor: 'pointer', fontSize: '1.1rem', borderRadius: '50%', display: 'flex', justifyContent: 'center', alignItems: 'center' }}>✕</button>

                                    {/* 이름 */}
                                    <div style={{ marginBottom: '20px' }}>
                                        <div style={{ color: characters[selected].color, fontSize: '0.8rem', letterSpacing: '0.15em', marginBottom: '6px' }}>{characters[selected].description}</div>
                                        <h2 style={{ color: '#f5f0f8', fontSize: isMobile ? '1.5rem' : '1.9rem', fontFamily: "'Noto Serif KR', serif", fontWeight: 700 }}>{characters[selected].fullName}</h2>
                                    </div>

                                    {/* 해시태그 */}
                                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px', marginBottom: '20px' }}>
                                        {characters[selected].tags.map((tag, i) => (
                                            <span key={i} style={{ padding: '5px 12px', background: `${characters[selected].color}20`, border: `1px solid ${characters[selected].color}40`, borderRadius: '15px', fontSize: '0.75rem', color: characters[selected].color }}>{tag}</span>
                                        ))}
                                    </div>

                                    {/* 구분선 */}
                                    <div style={{ width: '100%', height: '1px', background: `linear-gradient(90deg, ${characters[selected].color}, transparent)`, marginBottom: '20px' }} />

                                    {/* 대사 */}
                                    <div style={{ padding: '15px 20px', background: 'rgba(0, 0, 0, 0.2)', borderRadius: '12px', borderLeft: `3px solid ${characters[selected].color}`, marginBottom: '20px' }}>
                                        <div style={{ color: '#a090b0', fontSize: '0.7rem', marginBottom: '5px' }}>QUOTE</div>
                                        <div style={{ color: '#e8d5f0', fontSize: isMobile ? '0.9rem' : '1rem', fontStyle: 'italic', lineHeight: 1.7 }}>"{characters[selected].quote}"</div>
                                    </div>

                                    {/* 호감도 */}
                                    {characters[selected].affection && (
                                        <div>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                                                <span style={{ color: '#a090b0', fontSize: '0.75rem' }}>AFFECTION</span>
                                                <span style={{ color: characters[selected].color, fontSize: '0.9rem', fontWeight: 700 }}>♥ {characters[selected].affection}%</span>
                                            </div>
                                            <div style={{ height: '10px', background: 'rgba(201, 160, 220, 0.1)', borderRadius: '5px', overflow: 'hidden' }}>
                                                <div style={{ width: `${characters[selected].affection}%`, height: '100%', background: `linear-gradient(90deg, ${characters[selected].color}88, ${characters[selected].color})`, borderRadius: '5px', boxShadow: `0 0 15px ${characters[selected].color}50` }} />
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    <footer style={{ textAlign: 'center', marginTop: isMobile ? '40px' : '60px', padding: '25px', borderTop: '1px solid rgba(201, 160, 220, 0.1)' }}>
                        <p style={{ color: 'rgba(201, 160, 220, 0.3)', fontSize: '0.7rem' }}>© 2024 『제국 최강이 되기까지』</p>
                    </footer>
                </div>
            );
        }

        // ========================================
        // App
        // ========================================
        function App() {
            const [screen, setScreen] = useState('title');

            return (
                <>
                    {screen === 'title' && <TitleScreen onStart={() => setScreen('loading')} />}
                    {screen === 'loading' && <LoadingScreen onComplete={() => setScreen('game')} />}
                    {screen === 'game' && <GameScreen onGlitch={() => setScreen('glitch')} />}
                    {screen === 'glitch' && <GlitchScreen onComplete={() => setScreen('site')} />}
                    {screen === 'site' && <CharacterSite />}
                </>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
