    .rotate-notice .icon { font-size: 3rem; margin-bottom: 1rem; animation: rotateIcon 2s ease-in-out infinite; }
    @keyframes rotateIcon { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
    @media (max-width: 768px) and (orientation: portrait) { .rotate-notice { display: flex; } #game-container { display: none !important; } }
    ::-webkit-scrollbar { width: 4px; }

    <script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

// ════════════════════════════════════════════════════════════════════════════
// 스토리 데이터 합치기 (파서 사용)
// ════════════════════════════════════════════════════════════════════════════
const STORY = parseStory({
    chapter1: CHAPTER1,
    chapter2: CHAPTER2,
    chapter3: CHAPTER3,
    chapter4: CHAPTER4,
    chapter5: CHAPTER5,
    chapter6: CHAPTER6,
    chapter7: CHAPTER7,
    chapter8: CHAPTER8,
    chapter9a: CHAPTER9A,
    chapter9b: CHAPTER9B,
    chapter10b: CHAPTER10B,
    chapter11b: CHAPTER11B,
    ending_lizette: ENDING_LIZETTE,
    ending_selene: ENDING_SELENE,
    ending_adeline: ENDING_ADELINE,
    ending_karen: ENDING_KAREN,
    ending_elia: ENDING_ELIA,
    ending_luna: ENDING_LUNA,
    ending_harem: ENDING_HAREM,
    ending_emperor_alone: ENDING_EMPEROR_ALONE,
    ending_bad_execution: ENDING_BAD_EXECUTION,
    ending_bad_betrayal: ENDING_BAD_BETRAYAL,
    badend1: BADEND1,
});

// ════════════════════════════════════════════════════════════════════════════
// 세이브/로드 시스템
// ════════════════════════════════════════════════════════════════════════════
const SAVE_SLOTS = 3;

const saveGame = (slot, gameState) => {
    const saveData = { ...gameState, timestamp: new Date().toISOString(), version: '1.0' };
    localStorage.setItem(`visualnovel_save_${slot}`, JSON.stringify(saveData));
    return true;
};

const loadGame = (slot) => {
    const data = localStorage.getItem(`visualnovel_save_${slot}`);
    return data ? JSON.parse(data) : null;
};

const getSaveInfo = (slot) => {
    const data = localStorage.getItem(`visualnovel_save_${slot}`);
    if (data) {
        const parsed = JSON.parse(data);
        return { exists: true, chapter: parsed.currentChapter, timestamp: parsed.timestamp, affection: parsed.affection };
    }
    return { exists: false };
};

const deleteSave = (slot) => { localStorage.removeItem(`visualnovel_save_${slot}`); };

// ════════════════════════════════════════════════════════════════════════════
// 볼륨 설정 저장/로드
// ════════════════════════════════════════════════════════════════════════════
const getVolume = () => {
    const saved = localStorage.getItem('visualnovel_volume');
    return saved ? JSON.parse(saved) : { bgm: 0.3, sfx: 0.5 };
};

const saveVolume = (vol) => {
    localStorage.setItem('visualnovel_volume', JSON.stringify(vol));
};

// ════════════════════════════════════════════════════════════════════════════
// 사운드 설정 (볼륨 조절 지원)
// ════════════════════════════════════════════════════════════════════════════
const SOUNDS = {
    bgmDefault: 'audio/default.mp3',
    bgmTense: 'audio/tense.mp3',
    bgmRomantic: 'audio/romantic.mp3',
    bgmPeaceful: 'audio/peaceful.mp3',
    sfxClick: 'audio/click_sound.mp3',
    sfxDecision: 'audio/dcs.mp3',
    sfxSurprise: null,
    sfxHeartbeat: 'audio/heartbeat.mp3',
    sfxSword: 'audio/sword.mp3',
    sfxGlitch: 'audio/glitch.mp3',
};

let currentBgm = null;
let volumeSettings = getVolume();

const playBgm = (type) => { 
    if(currentBgm){currentBgm.pause();} 
    const src=SOUNDS[`bgm${type.charAt(0).toUpperCase()+type.slice(1)}`]; 
    if(src){
        currentBgm=new Audio(src);
        currentBgm.loop=true;
        currentBgm.volume=volumeSettings.bgm;
        currentBgm.play().catch(()=>{});
    } 
};
const stopBgm = () => { if(currentBgm){currentBgm.pause();currentBgm=null;} };
const playSfx = (type) => { 
    const src=SOUNDS[`sfx${type.charAt(0).toUpperCase()+type.slice(1)}`]; 
    if(src){
        const audio = new Audio(src);
        audio.volume = volumeSettings.sfx;
        audio.play().catch(()=>{});
    }
};

const updateBgmVolume = (vol) => {
    volumeSettings.bgm = vol;
    if(currentBgm) currentBgm.volume = vol;
    saveVolume(volumeSettings);
};

const updateSfxVolume = (vol) => {
    volumeSettings.sfx = vol;
    saveVolume(volumeSettings);
};

// ════════════════════════════════════════════════════════════════════════════
// 이미지 설정
// ════════════════════════════════════════════════════════════════════════════
const IMAGES = {
    titleLogo: 'img/tlogo.png',
    titleBackground: 'img/tbackground.png',
    titleCharacter: 'img/tchar.png',
    bgPalace: 'img/bg_palace.png',
    bgGarden: 'img/bg_garden.png',
    bgHall: 'img/bg_hall.png',
    bgRoom: 'img/bg_room.png',
    bgTraining: 'img/bg_training.png',
    bgThrone: 'img/bg_throne.png',
    bgNight: 'img/bg_night.png',
    bgEnding: 'img/bg_ending.png',
    bgCarriage: 'img/bg_carriage.png',
    bgDungeon: 'img/bg_dungeon.png',
    lizette: { default:'img/l.png', happy:'img/lizette_happy.png', sad:'img/lizette_sad.png', angry:'img/lizette_angry.png' },
    adeline: { default:'img/a.png', happy:'img/adeline_happy.png', sad:'img/adeline_sad.png', angry:'img/adeline_angry.png' },
    karen: { default:'img/c.png', happy:'img/karen_happy.png', sad:'img/karen_sad.png', angry:'img/karen_angry.png' },
    elia: { default:'img/e.png', happy:'img/elia_happy.png', sad:'img/elia_sad.png', angry:'img/elia_angry.png' },
    selene: { default:'img/s.png', happy:'img/selene_happy.png', sad:'img/selene_sad.png', angry:'img/selene_angry.png' },
    luna: { default:'img/lu.png', happy:'img/luna_happy.png', sad:'img/luna_sad.png', angry:'img/luna_angry.png' },
    fullKairen:'img/full_kairen.png', fullLizette:'img/fulll.png', fullAdeline:'img/fulla.png',
    fullKaren:'img/fullc.png', fullElia:'img/fulle.png', fullSelene:'img/fulls.png', fullLuna:'img/fulllu.png',
};

// ════════════════════════════════════════════════════════════════════════════
// 캐릭터 정보
// ════════════════════════════════════════════════════════════════════════════
const characters = {
    kairen: { name:"카이른", fullName:"카이른 폰 레이센", color:"#9d8ec2", description:"숨겨진 황자", tags:["#숨겨진_황자","#먼치킨"], quote:"모두가 내게 소중한 존재야." },
    lizette: { name:"리제트", fullName:"리제트 밀러", color:"#d4a0a8", personality:"소심·집착", description:"소꿉친구 하녀", tags:["#소꿉친구","#하녀","#집착"], quote:"저는 항상 도련님 편이에요.." },
    adeline: { name:"아델린", fullName:"아델린 폰 크로이츠", color:"#c4b090", personality:"츤데레", description:"2황녀", tags:["#2황녀","#츤데레"], quote:"착각하지 마세요." },
    karen: { name:"카렌", fullName:"카렌 폰 슈테른", color:"#8aadc0", personality:"무감정", description:"변경백", tags:["#변경백","#쿨뷰티"], quote:"...명령에 따를 뿐이다." },
    elia: { name:"엘리아", fullName:"엘리아 폰 베른트", color:"#c49898", personality:"욕데레", description:"하관", tags:["#하관","#욕쟁이"], quote:"너 같은 멍청이는 내가 없으면 안 돼." },
    selene: { name:"셀레네", fullName:"셀레네 아르카디엔", color:"#a890b8", personality:"소유욕", description:"1황녀", tags:["#1황녀","#소유욕"], quote:"폐하는 제 것이에요." },
    luna: { name:"루나", fullName:"루나", color:"#c8909c", personality:"메스가키", description:"기사의 동생", tags:["#기사의_동생","#메스가키"], quote:"흥, 쳐다보지 마." }
};

// ════════════════════════════════════════════════════════════════════════════
// 시스템 코드
// ════════════════════════════════════════════════════════════════════════════

const HEROINES = ['lizette','selene','adeline','karen','elia','luna'];
const DEFAULT_AFFECTION = { lizette:20, selene:10, adeline:15, karen:10, elia:10, luna:0 };

function Particles() {
    const particles = useMemo(() => Array.from({length:20},(_,i)=>({id:i,left:Math.random()*100,top:20+Math.random()*70,size:2+Math.random()*3,duration:8+Math.random()*6,delay:Math.random()*8,opacity:0.3+Math.random()*0.4})),[]);
    return (<div style={{position:'absolute',inset:0,overflow:'hidden',pointerEvents:'none',zIndex:5}}>{particles.map(p=>(<div key={p.id} style={{position:'absolute',left:`${p.left}%`,top:`${p.top}%`,width:`${p.size}px`,height:`${p.size}px`,background:`rgba(255,255,255,${p.opacity})`,borderRadius:'50%',animation:`particleDrift ${p.duration}s ease-in-out ${p.delay}s infinite`}}/>))}</div>);
}

// ════════════════════════════════════════════════════════════════════════════
// 볼륨 조절 패널
// ════════════════════════════════════════════════════════════════════════════
function VolumePanel({ onClose, isMobile }) {
    const [bgmVol, setBgmVol] = useState(volumeSettings.bgm);
    const [sfxVol, setSfxVol] = useState(volumeSettings.sfx);

    const handleBgmChange = (e) => {
        const vol = parseFloat(e.target.value);
        setBgmVol(vol);
        updateBgmVolume(vol);
    };

    const handleSfxChange = (e) => {
        const vol = parseFloat(e.target.value);
        setSfxVol(vol);
        updateSfxVolume(vol);
    };

    return (
        <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.85)',display:'flex',justifyContent:'center',alignItems:'center',zIndex:1000,animation:'fadeIn 0.3s'}}>
            <div onClick={e=>e.stopPropagation()} style={{background:'#14121a',border:'1px solid #3d3850',borderRadius:'16px',padding:isMobile?'20px':'32px',width:'90%',maxWidth:'400px'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'24px'}}>
                    <h3 style={{color:'#9d8ec2',fontSize:'1.2rem'}}>🔊 소리 설정</h3>
                    <button onClick={onClose} style={{background:'transparent',border:'1px solid #3d3850',color:'#6b6480',width:'28px',height:'28px',borderRadius:'50%',cursor:'pointer'}}>✕</button>
                </div>
                
                <div style={{marginBottom:'20px'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}}>
                        <span style={{color:'#c8c4d4',fontSize:'0.9rem'}}>🎵 배경음악</span>
                        <span style={{color:'#6b6480',fontSize:'0.8rem'}}>{Math.round(bgmVol * 100)}%</span>
                    </div>
                    <input 
                        type="range" 
                        min="0" 
                        max="1" 
                        step="0.05" 
                        value={bgmVol} 
                        onChange={handleBgmChange}
                    />
                </div>
                
                <div style={{marginBottom:'20px'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}}>
                        <span style={{color:'#c8c4d4',fontSize:'0.9rem'}}>🔔 효과음</span>
                        <span style={{color:'#6b6480',fontSize:'0.8rem'}}>{Math.round(sfxVol * 100)}%</span>
                    </div>
                    <input 
                        type="range" 
                        min="0" 
                        max="1" 
                        step="0.05" 
                        value={sfxVol} 
                        onChange={handleSfxChange}
                    />
                </div>
                
                <button 
                    onClick={() => { playSfx('click'); }}
                    style={{width:'100%',padding:'10px',background:'rgba(60,50,80,0.5)',border:'1px solid #4a4060',borderRadius:'8px',color:'#b0a0c8',cursor:'pointer',fontSize:'0.85rem'}}
                >
                    🔊 효과음 테스트
                </button>
            </div>
        </div>
    );
}

function StartPopup({ onClose }) {
    return (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.9)',display:'flex',justifyContent:'center',alignItems:'center',zIndex:10000,animation:'fadeIn 0.5s'}}>

function AffectionPanel({ affection, onClose, isMobile }) {

                </div>
                <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
                    {HEROINES.map(id => {
                        const char = characters[id];
                        const value = affection[id] || 0;
                        return (

function MemoryGame({ onPass, onFail }) {
    const [phase, setPhase] = useState('ready'); // ready, showing, input, result
    const [sequence, setSequence] = useState([]);
    const [playerInput, setPlayerInput] = useState([]);
    const [currentRound, setCurrentRound] = useState(1);
    const [showingIndex, setShowingIndex] = useState(-1);
    const [message, setMessage] = useState('빛의 순서를 기억하세요');
    const [canInput, setCanInput] = useState(false);
    const maxRounds = 5;
    const colors = ['#e07070', '#70e070', '#7070e0', '#e0e070'];

    const generateSequence = (round) => {
        const len = round + 2;
        return Array.from({length: len}, () => Math.floor(Math.random() * 4));
    };

    const startRound = () => {
        const newSeq = generateSequence(currentRound);
        setSequence(newSeq);
        setPlayerInput([]);
        setPhase('showing');
        setMessage(`라운드 ${currentRound}/${maxRounds}`);
        
        let i = 0;
        const showNext = () => {
            if (i < newSeq.length) {
                setShowingIndex(newSeq[i]);
                setTimeout(() => {
                    setShowingIndex(-1);
                    i++;
                    setTimeout(showNext, 300);
                }, 600);
            } else {
                setPhase('input');
                setCanInput(true);
                setMessage('순서대로 클릭하세요');
            }
        };
        setTimeout(showNext, 500);
    };

    const handleColorClick = (idx) => {
        if (!canInput || phase !== 'input') return;
        
        playSfx('click');
        const newInput = [...playerInput, idx];
        setPlayerInput(newInput);

        if (newInput[newInput.length - 1] !== sequence[newInput.length - 1]) {
            setCanInput(false);
            setPhase('result');
            setMessage('틀렸습니다...');
            setTimeout(onFail, 1500);
            return;
        }

        if (newInput.length === sequence.length) {
            setCanInput(false);
            if (currentRound >= maxRounds) {
                setPhase('result');
                setMessage('🎉 통과!');
                setTimeout(onPass, 1500);
            } else {
                setMessage('정답! 다음 라운드...');
                setTimeout(() => {
                    setCurrentRound(r => r + 1);
                    setPhase('ready');
                }, 1000);
            }
        }
    };

    useEffect(() => {
        if (phase === 'ready' && currentRound <= maxRounds) {
            const t = setTimeout(startRound, 1000);
            return () => clearTimeout(t);
        }
    }, [phase, currentRound]);

    return (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.95)',display:'flex',flexDirection:'column',justifyContent:'center',alignItems:'center',zIndex:500}}>
            <div style={{color:'#9d8ec2',fontSize:'1.5rem',marginBottom:'20px',fontFamily:"'Noto Serif KR',serif"}}>지략 시험</div>
            <div style={{color:'#c8c4d4',fontSize:'1rem',marginBottom:'30px'}}>{message}</div>
            
            <div style={{display:'grid',gridTemplateColumns:'repeat(2, 100px)',gap:'15px'}}>
                {colors.map((color, idx) => (
                    <div
                        key={idx}
                        onClick={() => handleColorClick(idx)}
                        style={{
                            width:'100px',
                            height:'100px',
                            background: showingIndex === idx ? color : `${color}40`,
                            borderRadius:'15px',
                            cursor: canInput ? 'pointer' : 'default',
                            transition:'all 0.2s',
                            boxShadow: showingIndex === idx ? `0 0 30px ${color}` : 'none',
                            transform: showingIndex === idx ? 'scale(1.1)' : 'scale(1)'
                        }}
                    />
                ))}
            </div>

            <div style={{marginTop:'30px',display:'flex',gap:'8px'}}>
                {Array.from({length: maxRounds}).map((_, i) => (
                    <div key={i} style={{
                        width:'12px',height:'12px',borderRadius:'50%',
                        background: i < currentRound ? '#9d8ec2' : '#3d3850'
                    }}/>
                ))}
            </div>
        </div>
    );
}

function GameScreen({ startChapter, startSceneIndex = 0, startDialogIndex = 0, onGlitch, onTitle, affection, setAffection }) {
    const [currentChapter, setCurrentChapter] = useState(startChapter || 'chapter1');
    const [sceneIndex, setSceneIndex] = useState(startSceneIndex);
    const [dialogIndex, setDialogIndex] = useState(startDialogIndex);
    const [displayedText, setDisplayedText] = useState('');
    const [isTyping, setIsTyping] = useState(false);
    const [showChoices, setShowChoices] = useState(false);
    const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);
    const [isAuto, setIsAuto] = useState(false);
    const [canProceed, setCanProceed] = useState(false);
    const [showChapterTitle, setShowChapterTitle] = useState(true);
    const [showAffection, setShowAffection] = useState(false);
    const [affectionPopup, setAffectionPopup] = useState(null);
    const [showSaveLoad, setShowSaveLoad] = useState(null);
    const [history, setHistory] = useState([]);
    const [dialogLog, setDialogLog] = useState([]);
    const [showLog, setShowLog] = useState(false);
    const [showMinigame, setShowMinigame] = useState(null);
    const [showVolume, setShowVolume] = useState(false);
    
    useEffect(() => { const h=()=>setIsMobile(window.innerWidth<=768); window.addEventListener('resize',h); return()=>window.removeEventListener('resize',h); }, []);

    const chapter = STORY[currentChapter];
    const scene = chapter?.scenes[sceneIndex];
    const dialog = scene?.dialogs[dialogIndex];

    useEffect(() => { 
        if(chapter){
            setShowChapterTitle(true);
            playBgm(chapter.bgm||'default');
            const t=setTimeout(()=>setShowChapterTitle(false),1300);
            return()=>clearTimeout(t);
        } 
    }, [currentChapter]);

    useEffect(() => {
        if(scene?.bgm) { playBgm(scene.bgm); }
    }, [sceneIndex, currentChapter]);

    const isGoingBack = useRef(false);

    useEffect(() => {
        if(!dialog||showChapterTitle)return;
        if(dialog.sfx)playSfx(dialog.sfx);
        
        if (!isGoingBack.current) {
            setDialogLog(prev => {
                const lastLog = prev[prev.length - 1];
                if (lastLog && lastLog.speaker === dialog.speaker && lastLog.text === dialog.text) {
                    return prev;
                }
                return [...prev, { speaker: dialog.speaker, text: dialog.text }];
            });
        }
        isGoingBack.current = false;
        
        setIsTyping(true);setDisplayedText('');setCanProceed(false);
        let i=0;
        const iv=setInterval(()=>{
            if(i<dialog.text.length){setDisplayedText(dialog.text.slice(0,i+1));i++;}
            else{clearInterval(iv);setIsTyping(false);setCanProceed(true);}
        },30);
        return()=>clearInterval(iv);
    }, [dialog, dialogIndex, sceneIndex, currentChapter, showChapterTitle]);

    useEffect(() => { 
        if(!isAuto||isTyping||!canProceed||showChoices)return; 
        const t=setTimeout(proceed,1500); 
        return()=>clearTimeout(t); 
    }, [isAuto, isTyping, canProceed, showChoices]);

    // ═══════════════════════════════════════
    // 키보드 이벤트 (스페이스바 + 화살표)
    // ═══════════════════════════════════════
    useEffect(() => {
        const handleKeyDown = (e) => {
            if (showLog || showSaveLoad || showChoices || showVolume || !dialog) return;

            // 스페이스바 또는 오른쪽 화살표
            if (e.key === ' ' || e.key === 'ArrowRight') {
                e.preventDefault();
                if (isTyping) {
                    setDisplayedText(dialog.text);
                    setIsTyping(false);
                    setCanProceed(true);
                } else if (canProceed) {
                    proceed();
                }
            }

            // 왼쪽 화살표 - 뒤로가기
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                goBack();
            }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
    }, [isTyping, canProceed, showLog, showSaveLoad, showChoices, showVolume, dialog]);

    const determineEnding = useCallback((route) => {
        const values = HEROINES.map(h => affection[h] || 0);
        const allMax = values.every(v => v >= 100);
        const hasMax = values.some(v => v >= 100);
        
        if (route === 'a') {
            if (hasMax) {
                const maxVal = Math.max(...values);
                const maxIdx = values.indexOf(maxVal);
                return `ending_${HEROINES[maxIdx]}`;
            }
            return 'ending_emperor_alone';
        } else {
            if (allMax) return 'ending_harem';
            if (hasMax) {
                const maxVal = Math.max(...values);
                const maxIdx = values.indexOf(maxVal);
                return `ending_${HEROINES[maxIdx]}`;
            }
            return 'ending_bad_betrayal';
        }
    }, [affection]);

    const proceed = useCallback(() => {
        if(!canProceed||showChoices)return;
        
        setHistory(prev => [...prev, { 
            chapter: currentChapter, 
            scene: sceneIndex, 
            dialog: dialogIndex,
            affection: {...affection}
        }]);
        
        if(dialogIndex<scene.dialogs.length-1){setDialogIndex(d=>d+1);}
        else if(scene.choices){setShowChoices(true);}
        else if(scene.next === 'minigame-memory') {
            setShowMinigame('memory');
            return;
        }
        else if(scene.next){goToScene(scene.next);}
        else if(sceneIndex<chapter.scenes.length-1){setSceneIndex(s=>s+1);setDialogIndex(0);}
    }, [canProceed, showChoices, dialogIndex, scene, sceneIndex, chapter, currentChapter, affection]);

    const [isSkipping, setIsSkipping] = useState(false);
    const skipIntervalRef = useRef(null);

    useEffect(() => {
        if (isSkipping && !showChoices && !showMinigame) {
            skipIntervalRef.current = setInterval(() => {
                if (isTyping) {
                    setDisplayedText(dialog?.text || '');
                    setIsTyping(false);
                    setCanProceed(true);
                } else if (canProceed && !showChoices) {
                    proceed();
                }
            }, 80);
        } else {
            if (skipIntervalRef.current) {
                clearInterval(skipIntervalRef.current);
                skipIntervalRef.current = null;
            }
        }
        
        return () => {
            if (skipIntervalRef.current) {
                clearInterval(skipIntervalRef.current);
            }
        };
    }, [isSkipping, isTyping, canProceed, showChoices, showMinigame, dialog, proceed]);

    const startSkip = () => setIsSkipping(true);
    const stopSkip = () => setIsSkipping(false);

    const goBack = useCallback(() => {
        if (history.length === 0) return;
        const prev = history[history.length - 1];
        setHistory(h => h.slice(0, -1));
        
        isGoingBack.current = true;
        
        if (prev.affection) {
            setAffection(prev.affection);
        }
        
        if (prev.chapter !== currentChapter) {
            setCurrentChapter(prev.chapter);
        }
        setSceneIndex(prev.scene);
        setDialogIndex(prev.dialog);
        setShowChoices(false);
    }, [history, currentChapter]);

    const goToScene = (nextId) => {
        if(nextId==='glitch'){onGlitch();return;}
        if(nextId==='ending_check_a'){
            const ending = determineEnding('a');
            setCurrentChapter(ending);setSceneIndex(0);setDialogIndex(0);return;
        }
        if(nextId==='ending_check_b'){
            const ending = determineEnding('b');
            setCurrentChapter(ending);setSceneIndex(0);setDialogIndex(0);return;
        }
        if(nextId.startsWith('chapter')||nextId.startsWith('ending')||nextId.startsWith('badend')){
            setCurrentChapter(nextId);setSceneIndex(0);setDialogIndex(0);return;
        }
        const idx=chapter.scenes.findIndex(s=>s.id===nextId);
        if(idx!==-1){setSceneIndex(idx);setDialogIndex(0);}
    };

    const handleChoice = (choice) => {
        playSfx('decision');
        setShowChoices(false);
        if(choice.affection){
            const newAff = {...affection};
            let changes = [];
            Object.entries(choice.affection).forEach(([char,delta])=>{
                newAff[char] = Math.max(0, Math.min(100, (newAff[char]||0)+delta));
                if(delta !== 0) changes.push({char,delta});
            });
            setAffection(newAff);
            if(changes.length>0){
                setAffectionPopup(changes);
                setTimeout(()=>setAffectionPopup(null),1500);
            }
        }
        goToScene(choice.next);
    };

    const handleClick = (e) => {
        if(showChoices||e.target.closest('button')||showChapterTitle||showAffection||showSaveLoad||showLog||showMinigame||showVolume)return;
        
        if(isTyping){
            setDisplayedText(dialog.text);
            setIsTyping(false);
            setCanProceed(true);
        } else {
            proceed();
        }
    };

    const handleSave = (slot) => {
        const gameState = { currentChapter, sceneIndex, dialogIndex, affection };
        saveGame(slot, gameState);
        playSfx('decision');
    };

    const handleLoadInGame = (saveData) => {
        setCurrentChapter(saveData.currentChapter);
        setSceneIndex(saveData.sceneIndex);
        setDialogIndex(saveData.dialogIndex);
        setAffection(saveData.affection);
        setShowSaveLoad(null);
        setShowChapterTitle(true);
        setTimeout(() => setShowChapterTitle(false), 2500);
        setHistory([]);
    };

    const handleMinigamePass = useCallback(() => {
        setShowMinigame(null);
        const idx = chapter?.scenes?.findIndex(s => s.id === '4-pass');
        if (idx !== -1) {
            setSceneIndex(idx);
            setDialogIndex(0);
        }
    }, [chapter]);

    const handleMinigameFail = useCallback(() => {
        setShowMinigame(null);
        const idx = chapter?.scenes?.findIndex(s => s.id === '4-fail');
        if (idx !== -1) {
            setSceneIndex(idx);
            setDialogIndex(0);
        }
    }, [chapter]);

    if(!chapter||!scene)return null;

    if(showChapterTitle)return(
        <div style={{height:'100vh',background:'#0a0810',display:'flex',flexDirection:'column',justifyContent:'center',alignItems:'center',animation:'fadeIn 0.5s'}}>
            <div style={{fontSize:isMobile?'0.8rem':'1rem',color:'#6b6480',letterSpacing:'0.3em',marginBottom:'12px'}}>{chapter.title}</div>
            <div style={{fontSize:isMobile?'1.5rem':'2.2rem',color:'#e8e6ed',fontFamily:"'Noto Serif KR',serif",fontWeight:700}}>{chapter.subtitle}</div>
        </div>
    );

    const getCharPosition = (chars,idx) => {
        const count=chars.length;
        if(count===1)return{left:'30%',transform:'translateX(-50%)'};
        if(count===2)return idx===0?{left:'15%'}:{right:'15%'};
        const positions=[{left:'5%'},{left:'18%'},{left:'31%'},{right:'31%'},{right:'18%'},{right:'5%'}];
        return positions[idx]||positions[0];
    };

    const currentSpeaker = dialog?.speaker==='narrator'||dialog?.speaker==='you'?null:dialog?.speaker;
    const speakerData = dialog?.speaker==='you'
        ? {name:'당신',color:'#9d8ec2'}
        : dialog?.speaker==='narrator'
            ? {name:'',color:'#7a7888'}
            : characters[dialog?.speaker]
                ? {name:characters[dialog.speaker].name, color:characters[dialog.speaker].color}
                : {name:dialog?.speaker||'', color:'#c8c4d4'};
    const getEmotionAnimation = (emotion) => ({happy:'happyBounce 1.5s ease-in-out infinite',angry:'angryTremble 1s ease-in-out infinite',sad:'sadDroop 4s ease-in-out infinite',default:'speaking 3s ease-in-out infinite'}[emotion]||'speaking 3s ease-in-out infinite');
    const bgUrl = IMAGES[scene.bg];

    return (
        <div onClick={handleClick} style={{height:'100vh',position:'relative',background:'#0a0810',overflow:'hidden',cursor:showChoices?'default':'pointer'}}>
            <div style={{position:'absolute',inset:0,background:bgUrl?`url(${bgUrl}) center/cover`:'#100e16',transition:'background 0.5s'}}>{!bgUrl&&<div style={{position:'absolute',top:'40%',left:'50%',transform:'translate(-50%,-50%)',color:'#1a1820',fontSize:'0.7rem'}}>[ {scene.bg} ]</div>}</div>
            
            {scene?.ending === 'badend1' && (
                <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.9)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',zIndex:300}}>
                    <h1 style={{color:'#e07070',fontSize:'2rem',marginBottom:'20px'}}>BAD END 1</h1>
                    <p style={{color:'#b8aed0',marginBottom:'40px'}}>실패한 황자</p>
                    <div style={{display:'flex',gap:'20px'}}>
                        <button onClick={()=>goToScene('4-12c')} style={{padding:'12px 30px',background:'linear-gradient(135deg,#9d8ec2,#6b5a8e)',border:'none',borderRadius:'8px',color:'#fff',cursor:'pointer',fontSize:'1rem'}}>🔄 재도전</button>
                        <button onClick={onTitle} style={{padding:'12px 30px',background:'transparent',border:'1px solid #6b6480',borderRadius:'8px',color:'#6b6480',cursor:'pointer',fontSize:'1rem'}}>타이틀로</button>
                    </div>
                </div>
            )}

            {scene.chars && scene.chars.map((char, idx) => {
                const charImages = IMAGES[char.id];
                const emotion = dialog?.speaker === char.id ? (dialog.emotion || char.emotion || 'default') : (char.emotion || 'default');
                const imgSrc = charImages?.[emotion] || charImages?.default;
                const isSpeaking = dialog?.speaker === char.id;
                const pos = getCharPosition(scene.chars, idx);
                
                return (
                    <div key={char.id} style={{position:'absolute',bottom:'15%',zIndex:10+idx,...pos,transition:'all 0.3s ease'}}>
                        {imgSrc ? (
                            <img src={imgSrc} style={{maxHeight:isMobile?'45vh':'55vh',filter:isSpeaking?'brightness(1.1)':'brightness(0.85)',transition:'all 0.3s',animation:isSpeaking?getEmotionAnimation(emotion):'idleBreathing 4s ease-in-out infinite'}}/>
                        ) : (
                            <div style={{width:'120px',height:'200px',background:'#2a2836',borderRadius:'8px',display:'flex',alignItems:'center',justifyContent:'center',color:'#4a4060',fontSize:'0.7rem'}}>[ {char.id} ]</div>
                        )}
                    </div>
                );
            })}

            <div style={{position:'absolute',top:isMobile?'8px':'12px',left:'50%',transform:'translateX(-50%)',display:'flex',gap:'8px',zIndex:100}}>
                <button onClick={()=>{playSfx('click');setShowSaveLoad('save');}} style={{padding:'6px 14px',background:'rgba(20,18,26,0.9)',border:'1px solid #3d3850',borderRadius:'8px',color:'#9d8ec2',fontSize:'0.75rem',cursor:'pointer'}}>💾 저장</button>
                <button onClick={()=>{playSfx('click');setShowSaveLoad('load');}} style={{padding:'6px 14px',background:'rgba(20,18,26,0.9)',border:'1px solid #3d3850',borderRadius:'8px',color:'#9d8ec2',fontSize:'0.75rem',cursor:'pointer'}}>📂 로드</button>
                <button onClick={()=>{playSfx('click');setShowAffection(true);}} style={{padding:'6px 14px',background:'rgba(20,18,26,0.9)',border:'1px solid #3d3850',borderRadius:'8px',color:'#d4a0a8',fontSize:'0.75rem',cursor:'pointer'}}>💕</button>
                <button onClick={()=>{playSfx('click');setShowLog(true);}} style={{padding:'6px 14px',background:'rgba(20,18,26,0.9)',border:'1px solid #3d3850',borderRadius:'8px',color:'#8aadc0',fontSize:'0.75rem',cursor:'pointer'}}>📜</button>
                <button onClick={()=>{playSfx('click');setShowVolume(true);}} style={{padding:'6px 14px',background:'rgba(20,18,26,0.9)',border:'1px solid #3d3850',borderRadius:'8px',color:'#a890b8',fontSize:'0.75rem',cursor:'pointer'}}>🔊</button>
                <button onClick={onTitle} style={{padding:'6px 14px',background:'rgba(20,18,26,0.9)',border:'1px solid #3d3850',borderRadius:'8px',color:'#6b6480',fontSize:'0.75rem',cursor:'pointer'}}>타이틀</button>
            </div>

            <div style={{position:'absolute',bottom:0,left:0,right:0,background:'linear-gradient(to top,rgba(10,8,16,0.98),rgba(10,8,16,0.9))',padding:isMobile?'16px':'24px 32px',minHeight:isMobile?'25vh':'28vh'}}>
                {speakerData.name && (
                    <div style={{marginBottom:'8px'}}>
                        <span style={{display:'inline-block',padding:'4px 16px',background:`linear-gradient(135deg,${speakerData.color}20,${speakerData.color}10)`,border:`1px solid ${speakerData.color}40`,borderRadius:'20px',color:speakerData.color,fontSize:isMobile?'0.8rem':'0.9rem',fontWeight:500}}>{speakerData.name}</span>
                    </div>
                )}
                <div style={{color:dialog?.speaker==='narrator'?'#9a96a8':'#e8e6ed',fontSize:isMobile?'0.95rem':'1.1rem',lineHeight:1.8,minHeight:'60px',fontStyle:dialog?.speaker==='narrator'?'italic':'normal'}}>
                    <span className={dialog?.effect?`text-${dialog.effect}`:''}>{displayedText}</span>
                    {isTyping && <span style={{animation:'blink 0.8s infinite'}}>▍</span>}
                </div>
                
                <div style={{position:'absolute',bottom:'12px',right:'16px',display:'flex',alignItems:'center',gap:'12px'}}>
                    <button onClick={goBack} disabled={history.length===0} style={{padding:'6px 12px',background:'rgba(60,50,80,0.5)',border:'1px solid #4a4060',borderRadius:'6px',color:history.length===0?'#3d3850':'#9d8ec2',fontSize:'0.75rem',cursor:history.length===0?'not-allowed':'pointer'}}>← BACK</button>
                    <button onClick={()=>setIsAuto(!isAuto)} style={{padding:'6px 12px',background:isAuto?'rgba(157,142,194,0.3)':'rgba(60,50,80,0.5)',border:`1px solid ${isAuto?'#9d8ec2':'#4a4060'}`,borderRadius:'6px',color:'#9d8ec2',fontSize:'0.75rem',cursor:'pointer'}}>{isAuto?'AUTO ●':'AUTO'}</button>
                    <button onMouseDown={startSkip} onMouseUp={stopSkip} onMouseLeave={stopSkip} onTouchStart={startSkip} onTouchEnd={stopSkip} style={{padding:'6px 12px',background:isSkipping?'rgba(157,142,194,0.3)':'rgba(60,50,80,0.5)',border:`1px solid ${isSkipping?'#9d8ec2':'#4a4060'}`,borderRadius:'6px',color:'#9d8ec2',fontSize:'0.75rem',cursor:'pointer'}}>SKIP ▶▶</button>
                    {!isTyping && canProceed && !showChoices && <div style={{color:'#6b6480',fontSize:'0.8rem',animation:'arrowBounce 1s infinite'}}>▼</div>}
                </div>
            </div>

            {showChoices && scene.choices && (
                <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.7)',display:'flex',justifyContent:'center',alignItems:'center',zIndex:200}}>
                    <div style={{display:'flex',flexDirection:'column',gap:'12px',maxWidth:'80%'}}>
                        {scene.choices.map((choice, idx) => (
                            <button key={idx} onClick={()=>handleChoice(choice)} style={{padding:'16px 32px',background:'rgba(20,18,26,0.95)',border:'1px solid #4a4060',borderRadius:'12px',color:'#e8e6ed',fontSize:isMobile?'0.9rem':'1rem',cursor:'pointer',textAlign:'left',transition:'all 0.2s'}}>
                                {choice.text}
                                {choice.affection&&<span style={{float:'right',color:'#d4a0a8',fontSize:'0.75rem'}}>💕</span>}
                            </button>
                        ))}
                    </div>
                </div>
            )}

            {affectionPopup && (
                <div style={{position:'absolute',top:'20%',left:'50%',transform:'translateX(-50%)',zIndex:300,display:'flex',flexDirection:'column',gap:'8px',animation:'slideDown 0.3s ease'}}>
                    {affectionPopup.map((change, idx) => (
                        <div key={idx} style={{padding:'8px 20px',background:'rgba(20,18,26,0.95)',border:`1px solid ${characters[change.char]?.color||'#9d8ec2'}`,borderRadius:'20px',color:characters[change.char]?.color||'#9d8ec2',fontSize:'0.9rem',animation:'heartPop 0.5s ease'}}>
                            {characters[change.char]?.name} {change.delta > 0 ? `+${change.delta}` : change.delta} 💕
                        </div>
                    ))}
                </div>
            )}

            {showAffection && <AffectionPanel affection={affection} onClose={()=>setShowAffection(false)} isMobile={isMobile}/>}
            {showSaveLoad && <SaveLoadPanel mode={showSaveLoad} onClose={() => setShowSaveLoad(null)} onSave={handleSave} onLoad={handleLoadInGame} currentState={{ currentChapter, sceneIndex, dialogIndex, affection }} isMobile={isMobile}/>}
            {showLog && <DialogLog log={dialogLog} onClose={() => setShowLog(false)} isMobile={isMobile}/>}
            {showVolume && <VolumePanel onClose={() => setShowVolume(false)} isMobile={isMobile}/>}
            
            {showMinigame === 'memory' && (
                <MemoryGame 
                    onPass={handleMinigamePass} 
                    onFail={handleMinigameFail} 
                />
            )}
        </div>
    );
}

function CharacterSite({ onBack }) {
    const [selected, setSelected] = useState(null);
    const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);
    useEffect(() => { const h=()=>setIsMobile(window.innerWidth<=768); window.addEventListener('resize',h); return()=>window.removeEventListener('resize',h); }, []);

    const list = Object.entries(characters);

    return (
        <div style={{minHeight:'100vh',background:'#0a0810',padding:isMobile?'20px 12px':'32px 18px'}}>
            <header style={{textAlign:'center',marginBottom:isMobile?'22px':'36px'}}>
                <button onClick={onBack} style={{position:'absolute',top:'20px',left:'20px',padding:'8px 16px',background:'rgba(60,50,80,0.7)',border:'1px solid #4a4060',color:'#b0a0c8',borderRadius:'8px',cursor:'pointer',fontSize:'0.8rem'}}>← 돌아가기</button>
                <div style={{fontSize:'0.65rem',color:'#6b6480',letterSpacing:'0.2em',marginBottom:'6px'}}>CHARACTER</div>
                <h1 style={{fontFamily:"'Noto Serif KR',serif",fontSize:isMobile?'1.3rem':'1.7rem',color:'#e8e6ed'}}>등장인물</h1>
                <div style={{width:'50px',height:'1px',background:'#3d3850',margin:'10px auto 0'}}/>
            </header>

            <div style={{display:'grid',gridTemplateColumns:isMobile?'repeat(2,1fr)':'repeat(auto-fit,minmax(170px,1fr))',gap:isMobile?'8px':'14px',maxWidth:'980px',margin:'0 auto'}}>
                {list.map(([k,c],i)=>(
                    <div key={k} onClick={()=>{playSfx('click');setSelected(k);}} style={{background:'#14121a',border:'1px solid #1a1820',borderRadius:'10px',overflow:'hidden',cursor:'pointer',animation:`slideUp 0.5s cubic-bezier(0.16,1,0.3,1) ${i*0.05}s both`}}>
                        <div style={{width:'100%',height:isMobile?'140px':'195px',background:'#100e16',display:'flex',justifyContent:'center',alignItems:'center',borderBottom:'1px solid #1a1820'}}>
                            {IMAGES[`full${k.charAt(0).toUpperCase()+k.slice(1)}`]?<img src={IMAGES[`full${k.charAt(0).toUpperCase()+k.slice(1)}`]} style={{maxHeight:'100%',maxWidth:'100%',objectFit:'cover'}}/>:<span style={{color:'#2a2836',fontSize:'0.55rem'}}>[ {c.name} ]</span>}
                        </div>
                        <div style={{padding:isMobile?'9px':'12px'}}>
                            <div style={{color:c.color,fontSize:isMobile?'0.52rem':'0.6rem',marginBottom:'2px'}}>{c.description}</div>
                            <h3 style={{color:'#e8e6ed',fontSize:isMobile?'0.85rem':'0.95rem',marginBottom:'4px',fontWeight:500}}>{c.fullName}</h3>
                            {c.personality&&<div style={{color:'#6b6480',fontSize:isMobile?'0.62rem':'0.7rem'}}>{c.personality}</div>}
                        </div>
                    </div>
                ))}
            </div>

            {selected&&(
                <div onClick={()=>setSelected(null)} style={{position:'fixed',inset:0,background:'rgba(5,4,10,0.95)',display:'flex',justifyContent:'center',alignItems:'center',zIndex:1000,padding:'12px',animation:'fadeIn 0.35s'}}>
                    <div onClick={e=>e.stopPropagation()} style={{width:'100%',maxWidth:isMobile?'100%':'800px',height:isMobile?'86vh':'76vh',maxHeight:isMobile?'none':'540px',background:'#100e16',border:`1px solid ${characters[selected].color}40`,borderRadius:'14px',display:'flex',flexDirection:isMobile?'column':'row',position:'relative',overflow:'hidden'}}>
                        <div style={{flex:isMobile?'0 0 40%':1,background:'#0a0810',display:'flex',justifyContent:'center',alignItems:'center',borderRight:isMobile?'none':'1px solid #1a1820',borderBottom:isMobile?'1px solid #1a1820':'none'}}>
                            {IMAGES[`full${selected.charAt(0).toUpperCase()+selected.slice(1)}`]?<img src={IMAGES[`full${selected.charAt(0).toUpperCase()+selected.slice(1)}`]} style={{maxHeight:'100%',maxWidth:'100%',objectFit:'contain'}}/>:<div style={{color:'#2a2836',fontSize:'0.7rem'}}>[ 전신 이미지 ]</div>}
                        </div>
                        <div style={{flex:1,padding:isMobile?'16px':'24px',display:'flex',flexDirection:'column',overflow:'auto'}}>
                            <button onClick={()=>setSelected(null)} style={{position:'absolute',top:'10px',right:'10px',background:'transparent',border:'1px solid #3d3850',color:'#6b6480',width:'28px',height:'28px',cursor:'pointer',fontSize:'0.9rem',borderRadius:'50%'}}>✕</button>
                            <div style={{marginBottom:'14px'}}>
                                <div style={{color:characters[selected].color,fontSize:'0.65rem',marginBottom:'4px'}}>{characters[selected].description}</div>
                                <h2 style={{color:'#e8e6ed',fontSize:isMobile?'1.3rem':'1.5rem',fontFamily:"'Noto Serif KR',serif"}}>{characters[selected].fullName}</h2>
                            </div>
                            <div style={{display:'flex',flexWrap:'wrap',gap:'5px',marginBottom:'14px'}}>
                                {characters[selected].tags.map((t,i)=><span key={i} style={{padding:'3px 9px',background:`${characters[selected].color}18`,border:`1px solid ${characters[selected].color}30`,borderRadius:'10px',fontSize:'0.65rem',color:characters[selected].color}}>{t}</span>)}
                            </div>
                            <div style={{width:'100%',height:'1px',background:'#1a1820',marginBottom:'14px'}}/>
                            <div style={{padding:'10px 14px',background:'#0a0810',borderRadius:'8px',borderLeft:`2px solid ${characters[selected].color}`,marginBottom:'14px'}}>
                                <div style={{color:'#6b6480',fontSize:'0.6rem',marginBottom:'3px'}}>QUOTE</div>
                                <div style={{color:'#c8c4d4',fontSize:isMobile?'0.82rem':'0.9rem',fontStyle:'italic',lineHeight:1.5}}>"{characters[selected].quote}"</div>
                            </div>
                        </div>
                    </div>
                </div>
            )}

            <footer style={{textAlign:'center',marginTop:isMobile?'30px':'45px',padding:'18px',borderTop:'1px solid #1a1820'}}><p style={{color:'#3d3850',fontSize:'0.6rem'}}>made by CowardMole</p></footer>
        </div>
    );
}

function App() {
    const [screen, setScreen] = useState('popup');
    const [startChapter, setStartChapter] = useState('chapter1');
    const [startSceneIndex, setStartSceneIndex] = useState(0);
    const [startDialogIndex, setStartDialogIndex] = useState(0);
    const [affection, setAffection] = useState({...DEFAULT_AFFECTION});

    const handleStart = () => { 
        setAffection({...DEFAULT_AFFECTION}); 
        setStartChapter('chapter1'); 
        setStartSceneIndex(0);
        setStartDialogIndex(0);
        setScreen('game'); 
    };
    
    const handleLoadFromTitle = (saveData) => {
        setStartChapter(saveData.currentChapter);
        setStartSceneIndex(saveData.sceneIndex);
        setStartDialogIndex(saveData.dialogIndex);
        setAffection(saveData.affection);
        setScreen('game');
    };

    const handleTitle = () => { setScreen('title'); };
    const handleCharacter = () => { setScreen('character'); };

    return (
        <div id="game-container" style={{minHeight:'100vh'}}>
            {screen === 'popup' && <StartPopup onClose={()=>setScreen('title')}/>}
            {screen === 'title' && <TitleScreen onStart={handleStart} onLoad={handleLoadFromTitle} onCharacter={handleCharacter}/>}
            {screen === 'character' && <CharacterSite onBack={()=>setScreen('title')}/>}
            {screen === 'game' && <GameScreen 
                startChapter={startChapter} 
                startSceneIndex={startSceneIndex}
                startDialogIndex={startDialogIndex}
                onGlitch={()=>setScreen('glitch')} 
                onTitle={handleTitle}
                affection={affection} 
                setAffection={setAffection}
            />}
            {screen === 'glitch' && <GlitchScreen onComplete={()=>setScreen('character')}/>}
        </div>
    );
}

ReactDOM.render(<App/>, document.getElementById('root'));
    </script>
</body>
</html>
