<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>제국 최강이 되기까지</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: 'Noto Sans KR', sans-serif; background: #0a0810; color: #e8e6ed; min-height: 100vh; overflow-x: hidden; }
        #root { min-height: 100vh; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes arrowBounce { 0%, 100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(3px); opacity: 0.4; } }
        @keyframes glitchText { 0%, 100% { transform: translate(0); } 20% { transform: translate(-2px, 2px); } 40% { transform: translate(2px, -2px); } 60% { transform: translate(-2px, -2px); } 80% { transform: translate(2px, 2px); } }
        
        @keyframes particleDrift {
            0% { transform: translate(0, 0); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translate(20px, -80px); opacity: 0; }
        }

        .char-idle { animation: float 3s ease-in-out infinite; }
        .char-happy { animation: bounce 0.5s ease-in-out; }
        .char-angry { animation: shake 0.3s ease-in-out; }
        .char-sad { filter: brightness(0.9); }
        .char-surprise { animation: pulse 0.4s ease-in-out; }

        /* 모바일 세로 화면 회전 안내 */
        .rotate-notice {
            display: none;
            position: fixed;
            inset: 0;
            background: #0a0810;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #9d8ec2;
        }
        .rotate-notice .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: rotateIcon 1.5s ease-in-out infinite;
        }
        @keyframes rotateIcon {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        @media (max-width: 768px) and (orientation: portrait) {
            .rotate-notice { display: flex; }
            #game-container { display: none !important; }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #16141c; }
        ::-webkit-scrollbar-thumb { background: #6b6480; border-radius: 2px; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- 모바일 세로 화면 회전 안내 -->
    <div class="rotate-notice">
        <div class="icon">📱</div>
        <div style="font-size: 1.1rem; margin-bottom: 0.5rem;">화면을 가로로 돌려주세요</div>
        <div style="font-size: 0.8rem; color: #6b6480;">Please rotate your device</div>
    </div>
    
    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        // 효과음 / 이미지 설정
        const SOUNDS = { click: null, select: null, type: null, transition: null, glitch: null, error: null };
        const playSound = (type) => { if (SOUNDS[type]) new Audio(SOUNDS[type]).play().catch(() => {}); };

        const IMAGES = {
            titleLogo: 'img/tlogo.png',        // 타이틀 로고
            titleBackground: 'img/tbackground.png',  // 타이틀 배경
            titleCharacter: 'img/tchar.png',   // 타이틀 캐릭터
            gameBackground: 'img/gbackground.png',
            charKairen: null, charLizette: 'img/l.png', charAdeline: 'img/a.png', charKaren: null, charElia: null, charSelene: null, charLuna: null,
            fullKairen: null, fullLizette: 'img/fulll.png', fullAdeline: 'img/fulla.png', fullKaren: null, fullElia: null, fullSelene: null, fullLuna: null,
        };

        // 캐릭터 데이터
        const characters = {
            kairen: { name: "카이른", fullName: "카이른 폰 레이센", color: "#9d8ec2", description: "숨겨진 황자", tags: ["#숨겨진_황자", "#계산적", "#온화한_미소", "#먼치킨"], quote: "모두가 내게 소중한 존재야." },
            lizette: { name: "리제트", fullName: "리제트 밀러", color: "#d4a0a8", personality: "소심 · 집착", description: "남주 소꿉친구 하녀", tags: ["#소꿉친구", "#소심", "#조용한_집착", "#하녀"], quote: "저, 저는 항상 도련님 편이에요.." },
            adeline: { name: "아델린", fullName: "아델린 폰 크로이츠", color: "#c4b090", personality: "츤데레", description: "공작가 영애", tags: ["#공작영애", "#츤데레", "#도도함", "#순정"], quote: "착각하지 마세요. 전 그저 의무를 따를 뿐입니다." },
            karen: { name: "카렌", fullName: "카렌 폰 슈테른", color: "#8aadc0", personality: "무감정", description: "황실 근위대장", tags: ["#근위대장", "#무표정", "#실력주의", "#쿨뷰티"], quote: "...넌 그냥 명령에 따르면 돼." },
            elia: { name: "엘리아", fullName: "엘리아 폰 베른트", color: "#c49898", personality: "욕데레", description: "유저 소꿉친구 기사", tags: ["#소꿉친구", "#욕쟁이", "#츤츤", "#여린_속마음"], quote: "하... 진짜, 너 같은 멍청이는 내가 없으면 안 돼." },
            selene: { name: "셀레네", fullName: "셀레네 아르카디엔", color: "#a890b8", personality: "소유욕", description: "제3황녀", tags: ["#황녀", "#소유욕", "#우아함", "#집착"], quote: "후후, 폐하는 제 것이에요. 누구도 가져갈 수 없죠." },
            luna: { name: "루나", fullName: "루나", color: "#c8909c", personality: "메스가키", description: "유저 의붓동생", tags: ["#의붓동생", "#메스가키", "#츤데레", "#경멸"], quote: "흥, 뭐야 그 눈. 쳐다보지 마." }
        };

        // 파티클 컴포넌트
        function Particles() {
            const particles = useMemo(() => Array.from({ length: 20 }, (_, i) => ({
                id: i,
                left: Math.random() * 100,
                top: 20 + Math.random() * 70,
                size: 2 + Math.random() * 3,
                duration: 8 + Math.random() * 6,
                delay: Math.random() * 8,
                opacity: 0.3 + Math.random() * 0.4
            })), []);

            return (
                <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', pointerEvents: 'none', zIndex: 5 }}>
                    {particles.map(p => (
                        <div key={p.id} style={{
                            position: 'absolute',
                            left: `${p.left}%`,
                            top: `${p.top}%`,
                            width: `${p.size}px`,
                            height: `${p.size}px`,
                            background: `rgba(255, 255, 255, ${p.opacity})`,
                            borderRadius: '50%',
                            boxShadow: `0 0 ${p.size * 2}px rgba(255, 255, 255, 0.3)`,
                            animation: `particleDrift ${p.duration}s ease-in-out ${p.delay}s infinite`
                        }} />
                    ))}
                </div>
            );
        }

        // 타이틀 화면
        function TitleScreen({ onStart }) {
            const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);
            useEffect(() => {
                const h = () => setIsMobile(window.innerWidth <= 768);
                window.addEventListener('resize', h);
                return () => window.removeEventListener('resize', h);
            }, []);

            const TitleLogo = () => IMAGES.titleLogo 
                ? <img src={IMAGES.titleLogo} alt="제국 최강이 되기까지" style={{ maxWidth: isMobile ? '160px' : '320px', height: 'auto' }} />
                : <div style={{ padding: isMobile ? '12px 18px' : '18px 25px', border: '1px dashed #3d3850', borderRadius: '6px' }}>
                    <div style={{ fontSize: '0.55rem', color: '#6b6480', marginBottom: '4px' }}>[ 타이틀 로고 ]</div>
                    <div style={{ fontSize: isMobile ? '1rem' : '1.7rem', fontFamily: "'Noto Serif KR', serif", fontWeight: 700, color: '#d8d4e2' }}>제국 최강이 되기까지</div>
                  </div>;

            const MenuBtn = ({ text, main }) => (
                <button onClick={main ? () => { playSound('select'); onStart(); } : () => playSound('click')} style={{
                    padding: isMobile ? '7px 14px' : '12px 28px', 
                    fontSize: isMobile ? '0.7rem' : '0.88rem', 
                    fontWeight: main ? 600 : 400,
                    background: main ? 'rgba(157, 142, 194, 0.9)' : 'rgba(30, 28, 38, 0.6)',
                    border: main ? 'none' : '1px solid rgba(100, 90, 120, 0.3)',
                    color: main ? '#0a0810' : 'rgba(180, 170, 200, 0.7)',
                    borderRadius: '4px',
                    cursor: main ? 'pointer' : 'default',
                    opacity: main ? 1 : 0.6,
                    width: '100%',
                    maxWidth: isMobile ? '120px' : '180px'
                }}>{main && <span style={{ marginRight: '4px' }}>▶</span>}{text}</button>
            );

            const CharArea = () => IMAGES.titleCharacter 
                ? <img src={IMAGES.titleCharacter} style={{ 
                    maxWidth: '62%', 
                    maxHeight: '62%', 
                    objectFit: 'contain',
                    objectPosition: 'left bottom'
                  }} />
                : <div style={{ color: '#2a2836', fontSize: '0.6rem', padding: '25px', border: '1px dashed #2a2836', borderRadius: '6px' }}>[ 캐릭터 이미지 ]</div>;

            // 모바일 레이아웃 (가로 기준)
            if (isMobile) {
                return (
                    <div style={{ 
                        height: '100vh', 
                        position: 'relative', 
                        overflow: 'hidden',
                        background: IMAGES.titleBackground ? `url(${IMAGES.titleBackground}) center/cover no-repeat` : '#0a0810'
                    }}>
                        <Particles />
                        
                        {/* 캐릭터 - 왼쪽 중앙 */}
                        <div style={{ 
                            position: 'absolute', 
                            left: 0, 
                            top: '50%',
                            transform: 'translateY(-50%)',
                            width: '50%', 
                            height: '85%',
                            display: 'flex',
                            justifyContent: 'center',
                            alignItems: 'center'
                        }}>
                            <CharArea />
                        </div>
                        
                        {/* 메뉴 영역 - 오른쪽 */}
                        <div style={{ 
                            position: 'absolute', 
                            right: 0, 
                            top: 0,
                            bottom: 0,
                            width: '50%',
                            background: 'linear-gradient(90deg, transparent, rgba(10,8,16,0.85) 15%)',
                            display: 'flex', 
                            flexDirection: 'column', 
                            justifyContent: 'center',
                            alignItems: 'center',
                            zIndex: 10
                        }}>
                            <div style={{ marginBottom: '14px' }}><TitleLogo /></div>
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '5px', alignItems: 'center' }}>
                                {['GAME START', 'DATA LOAD', 'CONFIG', 'GALLERY', 'EXIT'].map(t => 
                                    <MenuBtn key={t} text={t} main={t === 'GAME START'} />
                                )}
                            </div>
                        </div>
                        
                        <div style={{ position: 'absolute', bottom: '8px', right: '12px', fontSize: '0.5rem', color: '#3d3850', zIndex: 10 }}>made by CowardMole</div>
                    </div>
                );
            }

            // PC 레이아웃
            return (
                <div style={{ 
                    height: '100vh', 
                    position: 'relative', 
                    overflow: 'hidden',
                    background: IMAGES.titleBackground ? `url(${IMAGES.titleBackground}) center/cover no-repeat` : '#0a0810'
                }}>
                    <Particles />
                    
                    {/* 캐릭터 */}
                    <div style={{ 
                        position: 'absolute', 
                        left: '-3%', 
                        top: '50%',
                        transform: 'translateY(-45%)',
                        justifyContent: 'center',
                        alignItems: 'center'
                    }}>
                        <CharArea />
                    </div>
                    
                    {/* 오른쪽 그라데이션 + 메뉴 */}
                    <div style={{ 
                        position: 'absolute', 
                        right: 0, 
                        top: 0, 
                        bottom: 0, 
                        width: '45%', 
                        background: 'linear-gradient(90deg, transparent, rgba(10,8,16,0.85) 20%)',
                        display: 'flex', 
                        flexDirection: 'column', 
                        justifyContent: 'center', 
                        alignItems: 'center',
                        zIndex: 10
                    }}>
                        <div style={{ marginBottom: '35px' }}><TitleLogo /></div>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', alignItems: 'center' }}>
                            {['GAME START', 'DATA LOAD', 'CONFIG', 'GALLERY', 'EXIT'].map(t => 
                                <MenuBtn key={t} text={t} main={t === 'GAME START'} />
                            )}
                        </div>
                        <div style={{ position: 'absolute', bottom: '16px', fontSize: '0.6rem', color: '#3d3850' }}>made by CowardMole</div>
                    </div>
                </div>
            );
        }

        // 로딩 화면
        function LoadingScreen({ onComplete }) {
            const [progress, setProgress] = useState(0);
            const [done, setDone] = useState(false);

            useEffect(() => {
                const i = setInterval(() => setProgress(p => { if (p >= 100) { clearInterval(i); setTimeout(() => setDone(true), 250); return 100; } return p + Math.random() * 20 + 10; }), 120);
                return () => clearInterval(i);
            }, []);

            useEffect(() => { if (done) { const t = setTimeout(onComplete, 1600); return () => clearTimeout(t); } }, [done, onComplete]);

            return (
                <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', background: '#0a0810' }}>
                    {!done ? (
                        <>
                            <div style={{ marginBottom: '1rem', color: '#6b6480', letterSpacing: '0.12em', fontSize: '0.8rem' }}>Now Loading...</div>
                            <div style={{ width: '240px', height: '3px', background: '#1a1820', borderRadius: '2px', overflow: 'hidden' }}>
                                <div style={{ width: `${Math.min(progress, 100)}%`, height: '100%', background: '#9d8ec2', transition: 'width 0.12s' }} />
                            </div>
                        </>
                    ) : (
                        <div style={{ textAlign: 'center', animation: 'fadeIn 0.3s' }}>
                            <div style={{ fontSize: '1rem', color: '#b8b0c8', marginBottom: '0.6rem' }}>저장 데이터 발견</div>
                            <div style={{ fontSize: '0.85rem', color: '#8880a0' }}>마지막 체크포인트에서 시작합니다</div>
                            <div style={{ marginTop: '1rem', fontSize: '0.75rem', color: '#6b6480', padding: '8px 20px', background: '#14121a', borderRadius: '14px' }}>Chapter 12: 황제의 즉위식</div>
                        </div>
                    )}
                </div>
            );
        }

        // 호감도 UI
        function AffectionUI({ affections, isMobile }) {
            const list = ['lizette', 'adeline', 'karen', 'elia', 'selene', 'luna'];
            return (
                <div style={{ position: 'absolute', top: isMobile ? '6px' : '14px', right: isMobile ? '6px' : '14px', background: 'rgba(10, 8, 16, 0.95)', border: '1px solid #252230', borderRadius: isMobile ? '6px' : '10px', padding: isMobile ? '6px 8px' : '16px 18px', minWidth: isMobile ? '90px' : '220px', zIndex: 100 }}>
                    <div style={{ textAlign: 'center', fontSize: isMobile ? '0.48rem' : '0.8rem', color: '#9d8ec2', marginBottom: isMobile ? '4px' : '14px', paddingBottom: isMobile ? '3px' : '10px', borderBottom: '1px solid #252230' }}>♥ AFFECTION</div>
                    {list.map(k => (
                        <div key={k} style={{ marginBottom: isMobile ? '3px' : '10px' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: isMobile ? '0.44rem' : '0.78rem', marginBottom: isMobile ? '1px' : '4px' }}>
                                <span style={{ color: characters[k].color }}>{characters[k].name}</span>
                                <span style={{ color: '#c8c4d4' }}>{affections[k]}</span>
                            </div>
                            <div style={{ height: isMobile ? '2px' : '6px', background: '#1a1820', borderRadius: '3px', overflow: 'hidden' }}>
                                <div style={{ width: `${affections[k]}%`, height: '100%', background: characters[k].color, transition: 'width 0.3s' }} />
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        // 게임 화면
        function GameScreen({ onGlitch }) {
            const [dialogIndex, setDialogIndex] = useState(0);
            const [showChoices, setShowChoices] = useState(false);
            const [selectedChoice, setSelectedChoice] = useState(null);
            const [charEmotion, setCharEmotion] = useState('idle');
            const [displayedText, setDisplayedText] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [phase, setPhase] = useState('dialog');
            const [affections, setAffections] = useState({ lizette: 97, adeline: 89, karen: 85, elia: 82, selene: 94, luna: 78 });
            const [afterChoiceIndex, setAfterChoiceIndex] = useState(0);
            const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);
            const [currentSpeaker, setCurrentSpeaker] = useState(null);
            const [isAuto, setIsAuto] = useState(false);
            const [canProceed, setCanProceed] = useState(false);

            useEffect(() => { const h = () => setIsMobile(window.innerWidth <= 768); window.addEventListener('resize', h); return () => window.removeEventListener('resize', h); }, []);

            const dialogs = useMemo(() => [
                { speaker: "selene", text: "폐하, 오늘 즉위식 정말 멋지셨어요.", emotion: "happy" },
                { speaker: "selene", text: "역시 제 남편이시네요. 후후.", emotion: "happy" },
                { speaker: "adeline", text: "...흥, 황후라고 너무 나서는 거 아니에요?", emotion: "angry" },
                { speaker: "adeline", text: "폐하께서는 모두의 것이에요.", emotion: "angry" },
                { speaker: "selene", text: "후후, 무슨 말씀이세요. 폐하는 제 것인걸요.", emotion: "happy" },
                { speaker: "lizette", text: "저, 저기... 저도 폐하 곁에 있고 싶어요...", emotion: "sad" },
                { speaker: "elia", text: "하... 진짜 꼴보기 싫다. 너네 둘 다 좀 조용히 해.", emotion: "angry" },
                { speaker: "luna", text: "흥, 언니들 싸우는 거 재밌네요~ 폐하는 어떻게 생각하세요?", emotion: "happy" },
                { speaker: "karen", text: "...시끄럽군.", emotion: "idle" },
                { speaker: "narrator", text: "여섯 쌍의 눈이 당신을 바라본다.", emotion: "idle" }
            ], []);

            const choices = useMemo(() => [
                { text: "셀레네의 손을 잡으며 웃는다", effects: { selene: +5, adeline: -8, lizette: -5, luna: -3 } },
                { text: "조용히 미소만 짓는다", effects: { karen: +3 } },
                { text: "리제트에게 다가가 머리를 쓰다듬는다", effects: { lizette: +10, selene: -10, adeline: -5, luna: -5 } }
            ], []);

            const afterDialogs = useMemo(() => [
                [{ speaker: "selene", text: "후후... 역시 폐하는 절 가장 사랑하시는 거죠?", emotion: "happy" }, { speaker: "adeline", text: "...!", emotion: "surprise" }, { speaker: "lizette", text: "도련님... 아, 폐하...", emotion: "sad" }],
                [{ speaker: "luna", text: "에이~ 폐하 비겁해요! 확실히 말해주세요!", emotion: "angry" }, { speaker: "karen", text: "...현명한 판단이군.", emotion: "idle" }, { speaker: "elia", text: "뭐야, 재미없게. 그냥 아무나 찍어.", emotion: "angry" }],
                [{ speaker: "lizette", text: "폐, 폐하...! 저, 저는... 행복해요...", emotion: "happy" }, { speaker: "selene", text: "...폐하?", emotion: "angry" }, { speaker: "adeline", text: "저, 저 하녀한테...?!", emotion: "surprise" }]
            ], []);

            const getCurrent = useCallback(() => phase === 'afterChoice' && selectedChoice !== null ? afterDialogs[selectedChoice][afterChoiceIndex] : dialogs[dialogIndex], [phase, selectedChoice, afterChoiceIndex, dialogIndex, afterDialogs, dialogs]);

            useEffect(() => {
                const cur = getCurrent(); if (!cur) return;
                setIsTyping(true); setDisplayedText(''); setCharEmotion(cur.emotion); setCurrentSpeaker(cur.speaker); setCanProceed(false);
                let i = 0;
                const iv = setInterval(() => { if (i < cur.text.length) { setDisplayedText(cur.text.slice(0, i + 1)); i++; } else { clearInterval(iv); setIsTyping(false); setCanProceed(true); } }, 28);
                return () => clearInterval(iv);
            }, [dialogIndex, afterChoiceIndex, phase, selectedChoice, getCurrent]);

            useEffect(() => { if (!isAuto || isTyping || !canProceed) return; const t = setTimeout(proceed, 1300); return () => clearTimeout(t); }, [isAuto, isTyping, canProceed]);

            const proceed = useCallback(() => {
                if (!canProceed) return;
                if (phase === 'dialog') { if (dialogIndex < dialogs.length - 1) setDialogIndex(d => d + 1); else { setPhase('choice'); setShowChoices(true); } }
                else if (phase === 'afterChoice' && selectedChoice !== null) { if (afterChoiceIndex < afterDialogs[selectedChoice].length - 1) setAfterChoiceIndex(i => i + 1); else { setPhase('glitch'); onGlitch(); } }
            }, [canProceed, phase, dialogIndex, dialogs.length, afterDialogs, selectedChoice, afterChoiceIndex, onGlitch]);

            const handleChoice = (i) => {
                playSound('select'); setShowChoices(false); setSelectedChoice(i);
                const fx = choices[i].effects;
                setAffections(p => { const n = { ...p }; Object.entries(fx).forEach(([k, v]) => { n[k] = Math.max(0, Math.min(100, n[k] + v)); }); return n; });
                setAfterChoiceIndex(0); setPhase('afterChoice');
            };

            const handleClick = (e) => { if (showChoices || e.target.closest('button') || isTyping) return; proceed(); };

            const cur = getCurrent(); if (!cur) return null;
            const spk = cur.speaker === 'narrator' ? { name: '', color: '#7a7888' } : { name: characters[cur.speaker]?.name || '', color: characters[cur.speaker]?.color || '#fff' };
            const emoClass = { happy: 'char-happy', angry: 'char-angry', sad: 'char-sad', surprise: 'char-surprise', idle: 'char-idle' }[charEmotion] || 'char-idle';

            return (
                <div onClick={handleClick} style={{ height: '100vh', position: 'relative', background: '#0a0810', overflow: 'hidden', cursor: showChoices ? 'default' : 'pointer' }}>
                    <div style={{ position: 'absolute', inset: 0, background: IMAGES.gameBackground ? `url(${IMAGES.gameBackground}) center/cover` : '#100e16' }}>
                        {!IMAGES.gameBackground && <div style={{ position: 'absolute', top: '40%', left: '50%', transform: 'translate(-50%, -50%)', color: '#1a1820', fontSize: '0.7rem' }}>[ 배경 이미지 ]</div>}
                    </div>

                    {!isMobile && (
                        <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: '42px', background: 'linear-gradient(#0a0810, transparent)', display: 'flex', alignItems: 'center', padding: '0 16px', gap: '6px' }}>
                            {['SAVE', 'LOAD', 'TITLE', 'CONFIG'].map(t => <button key={t} onClick={e => { e.stopPropagation(); playSound('click'); }} style={{ padding: '4px 12px', fontSize: '0.68rem', background: 'transparent', border: '1px solid #252230', color: '#6b6480', borderRadius: '10px', cursor: 'pointer' }}>{t}</button>)}
                        </div>
                    )}

                    <AffectionUI affections={affections} isMobile={isMobile} />

                    <div className={emoClass} style={{ position: 'absolute', bottom: isMobile ? '160px' : '190px', left: '50%', transform: 'translateX(-50%)', width: isMobile ? '240px' : '360px', height: isMobile ? '280px' : '440px', display: 'flex', justifyContent: 'center', alignItems: 'flex-end' }}>
                        {IMAGES[`char${currentSpeaker?.charAt(0).toUpperCase()}${currentSpeaker?.slice(1)}`]
                            ? <img src={IMAGES[`char${currentSpeaker?.charAt(0).toUpperCase()}${currentSpeaker?.slice(1)}`]} style={{ maxHeight: '100%', maxWidth: '100%', objectFit: 'contain' }} />
                            : <div style={{ color: '#1a1820', fontSize: '0.65rem', padding: '22px', border: '1px dashed #1a1820', borderRadius: '6px' }}>[ {spk.name || '캐릭터'} ]</div>}
                    </div>

                    <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, padding: isMobile ? '10px' : '16px' }}>
                        <div style={{ maxWidth: '880px', margin: '0 auto', background: 'rgba(10, 8, 16, 0.96)', border: '1px solid #252230', borderRadius: isMobile ? '8px' : '10px', padding: isMobile ? '12px 14px' : '18px 24px', position: 'relative' }}>
                            {spk.name && <div style={{ position: 'absolute', top: isMobile ? '-11px' : '-13px', left: isMobile ? '12px' : '20px', background: spk.color, padding: isMobile ? '2px 12px' : '3px 16px', borderRadius: '12px', color: '#0a0810', fontSize: isMobile ? '0.72rem' : '0.78rem', fontWeight: 600 }}>{spk.name}</div>}
                            <div style={{ fontSize: isMobile ? '0.88rem' : '0.98rem', lineHeight: 1.8, color: cur.speaker === 'narrator' ? '#7a7888' : '#e8e6ed', fontStyle: cur.speaker === 'narrator' ? 'italic' : 'normal', minHeight: isMobile ? '42px' : '52px', paddingTop: spk.name ? '6px' : 0, display: 'flex', alignItems: 'center' }}>
                                <span>{displayedText}</span>
                                {isTyping && <span style={{ borderRight: '2px solid #9d8ec2', marginLeft: '1px', animation: 'blink 0.5s infinite' }}>&nbsp;</span>}
                                {!isTyping && canProceed && <span style={{ marginLeft: '8px', color: '#9d8ec2', fontSize: '0.75rem', animation: 'arrowBounce 0.7s infinite' }}>▼</span>}
                            </div>
                            <div style={{ position: 'absolute', bottom: isMobile ? '7px' : '10px', right: isMobile ? '8px' : '14px', display: 'flex', gap: isMobile ? '4px' : '6px' }}>
                                {['SKIP', 'AUTO', 'LOG'].map(t => <button key={t} onClick={e => { e.stopPropagation(); if (t === 'AUTO') setIsAuto(!isAuto); }} style={{ padding: isMobile ? '2px 8px' : '4px 10px', fontSize: isMobile ? '0.56rem' : '0.66rem', background: t === 'AUTO' && isAuto ? 'rgba(157, 142, 194, 0.2)' : 'transparent', border: `1px solid ${t === 'AUTO' && isAuto ? '#9d8ec2' : '#252230'}`, color: t === 'AUTO' && isAuto ? '#b8aed0' : '#6b6480', borderRadius: '8px', cursor: 'pointer' }}>{t}</button>)}
                            </div>
                        </div>
                    </div>

                    {showChoices && (
                        <div style={{ position: 'absolute', top: isMobile ? '35%' : '45%', left: '50%', transform: 'translate(-50%, -50%)', display: 'flex', flexDirection: 'column', gap: isMobile ? '5px' : '9px', animation: 'fadeIn 0.2s', zIndex: 200, width: isMobile ? '75%' : 'auto', maxWidth: '380px' }}>
                            {choices.map((c, i) => <button key={i} onClick={() => handleChoice(i)} style={{ padding: isMobile ? '8px 12px' : '15px 26px', fontSize: isMobile ? '0.72rem' : '0.92rem', background: 'rgba(10, 8, 16, 0.96)', border: '1px solid #3d3850', color: '#e8e6ed', cursor: 'pointer', borderRadius: '8px', textAlign: 'left', width: '100%' }}><span style={{ color: '#9d8ec2', marginRight: '6px' }}>▸</span>{c.text}</button>)}
                        </div>
                    )}
                </div>
            );
        }

        // 글리치 화면
        function GlitchScreen({ onComplete }) {
            const [phase, setPhase] = useState(0);
            const msgs = ["ERROR: UNEXPECTED_ENTITY_DETECTED", "WARNING: NARRATIVE_BREACH", "FATAL: OBSERVER_OVERFLOW", "SYSTEM FAILURE..."];

            useEffect(() => {
                const timers = [setTimeout(() => setPhase(1), 200), setTimeout(() => setPhase(2), 700), setTimeout(() => setPhase(3), 1200), setTimeout(() => setPhase(4), 1700), setTimeout(onComplete, 2800)];
                return () => timers.forEach(clearTimeout);
            }, [onComplete]);

            return (
                <div style={{ height: '100vh', background: '#050508', display: 'flex', justifyContent: 'center', alignItems: 'center', position: 'relative', overflow: 'hidden' }}>
                    <div style={{ position: 'absolute', inset: 0, background: 'repeating-linear-gradient(0deg, rgba(0,0,0,0.08), rgba(0,0,0,0.08) 1px, transparent 1px, transparent 2px)' }} />
                    {phase >= 1 && [...Array(8)].map((_, i) => <div key={i} style={{ position: 'absolute', top: `${Math.random() * 100}%`, left: 0, right: 0, height: `${Math.random() * 2 + 1}px`, background: `rgba(160, 100, 130, ${Math.random() * 0.25 + 0.05})`, transform: `translateX(${Math.random() * 8 - 4}px)` }} />)}
                    <div style={{ fontFamily: 'monospace', fontSize: '0.85rem', color: '#a06880', textShadow: '0 0 6px rgba(160, 100, 130, 0.5)', animation: 'glitchText 0.15s infinite', textAlign: 'center', zIndex: 10 }}>{phase > 0 && msgs[phase - 1]}</div>
                </div>
            );
        }

        // 캐릭터 사이트
        function CharacterSite() {
            const [selected, setSelected] = useState(null);
            const [showIntro, setShowIntro] = useState(true);
            const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);

            useEffect(() => { const h = () => setIsMobile(window.innerWidth <= 768); window.addEventListener('resize', h); return () => window.removeEventListener('resize', h); }, []);
            useEffect(() => { const t = setTimeout(() => setShowIntro(false), 2200); return () => clearTimeout(t); }, []);

            if (showIntro) return (
                <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', background: '#0a0810', animation: 'fadeIn 0.5s', padding: '20px', textAlign: 'center' }}>
                    <div style={{ fontSize: '1rem', color: '#9d8ec2', marginBottom: '0.6rem' }}>당신은 미연시 『제국 최강이 되기까지』속으로</div>
                    <div style={{ fontSize: '2rem', color: '#e8e6ed', fontWeight: 700, fontFamily: "'Noto Serif KR', serif" }}>빙의했습니다.</div>
                    <div style={{ marginTop: '2rem', padding: '12px 28px', background: '#14121a', borderRadius: '16px' }}>
                        <div style={{ color: '#9d8ec2', fontSize: '0.7rem', marginBottom: '3px' }}>YOUR ROLE</div>
                        <div style={{ color: '#d8d4e2', fontSize: '0.95rem' }}>이름 없는 엑스트라 기사</div>
                    </div>
                </div>
            );

            const list = Object.entries(characters);

            return (
                <div style={{ minHeight: '100vh', background: '#0a0810', padding: isMobile ? '20px 12px' : '32px 18px' }}>
                    <header style={{ textAlign: 'center', marginBottom: isMobile ? '22px' : '36px' }}>
                        <div style={{ fontSize: '0.65rem', color: '#6b6480', letterSpacing: '0.2em', marginBottom: '6px' }}>CHARACTER</div>
                        <h1 style={{ fontFamily: "'Noto Serif KR', serif", fontSize: isMobile ? '1.3rem' : '1.7rem', color: '#e8e6ed' }}>등장인물</h1>
                        <div style={{ width: '50px', height: '1px', background: '#3d3850', margin: '10px auto 0' }} />
                    </header>

                    <div style={{ display: 'grid', gridTemplateColumns: isMobile ? 'repeat(2, 1fr)' : 'repeat(auto-fit, minmax(170px, 1fr))', gap: isMobile ? '8px' : '14px', maxWidth: '980px', margin: '0 auto' }}>
                        {list.map(([k, c], i) => (
                            <div key={k} onClick={() => setSelected(k)} style={{ background: '#14121a', border: '1px solid #1a1820', borderRadius: '10px', overflow: 'hidden', cursor: 'pointer', animation: `slideUp 0.3s ease ${i * 0.03}s both` }}>
                                <div style={{ width: '100%', height: isMobile ? '140px' : '195px', background: '#100e16', display: 'flex', justifyContent: 'center', alignItems: 'center', borderBottom: '1px solid #1a1820' }}>
                                    {IMAGES[`full${k.charAt(0).toUpperCase()}${k.slice(1)}`] ? <img src={IMAGES[`full${k.charAt(0).toUpperCase()}${k.slice(1)}`]} style={{ maxHeight: '100%', maxWidth: '100%', objectFit: 'cover' }} /> : <span style={{ color: '#1a1820', fontSize: '0.55rem' }}>[ 이미지 ]</span>}
                                </div>
                                <div style={{ padding: isMobile ? '9px' : '12px' }}>
                                    <div style={{ color: c.color, fontSize: isMobile ? '0.52rem' : '0.6rem', marginBottom: '2px' }}>{c.description}</div>
                                    <h3 style={{ color: '#e8e6ed', fontSize: isMobile ? '0.85rem' : '0.95rem', marginBottom: '4px', fontWeight: 500 }}>{c.fullName}</h3>
                                    {c.personality && <div style={{ color: '#6b6480', fontSize: isMobile ? '0.62rem' : '0.7rem' }}>{c.personality}</div>}
                                </div>
                            </div>
                        ))}
                    </div>

                    {selected && (
                        <div onClick={() => setSelected(null)} style={{ position: 'fixed', inset: 0, background: 'rgba(5, 4, 10, 0.95)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 1000, padding: '12px', animation: 'fadeIn 0.15s' }}>
                            <div onClick={e => e.stopPropagation()} style={{ width: '100%', maxWidth: isMobile ? '100%' : '800px', height: isMobile ? '86vh' : '76vh', maxHeight: isMobile ? 'none' : '540px', background: '#100e16', border: `1px solid ${characters[selected].color}40`, borderRadius: '14px', display: 'flex', flexDirection: isMobile ? 'column' : 'row', position: 'relative', overflow: 'hidden' }}>
                                <div style={{ flex: isMobile ? '0 0 40%' : 1, background: '#0a0810', display: 'flex', justifyContent: 'center', alignItems: 'center', borderRight: isMobile ? 'none' : '1px solid #1a1820', borderBottom: isMobile ? '1px solid #1a1820' : 'none' }}>
                                    {IMAGES[`full${selected.charAt(0).toUpperCase()}${selected.slice(1)}`] ? <img src={IMAGES[`full${selected.charAt(0).toUpperCase()}${selected.slice(1)}`]} style={{ maxHeight: '100%', maxWidth: '100%', objectFit: 'contain' }} /> : <div style={{ color: '#1a1820', fontSize: '0.7rem' }}>[ 전신 이미지 ]</div>}
                                </div>
                                <div style={{ flex: 1, padding: isMobile ? '16px' : '24px', display: 'flex', flexDirection: 'column', overflow: 'auto' }}>
                                    <button onClick={() => setSelected(null)} style={{ position: 'absolute', top: '10px', right: '10px', background: 'transparent', border: '1px solid #3d3850', color: '#6b6480', width: '28px', height: '28px', cursor: 'pointer', fontSize: '0.9rem', borderRadius: '50%' }}>✕</button>
                                    <div style={{ marginBottom: '14px' }}>
                                        <div style={{ color: characters[selected].color, fontSize: '0.65rem', marginBottom: '4px' }}>{characters[selected].description}</div>
                                        <h2 style={{ color: '#e8e6ed', fontSize: isMobile ? '1.3rem' : '1.5rem', fontFamily: "'Noto Serif KR', serif" }}>{characters[selected].fullName}</h2>
                                    </div>
                                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '5px', marginBottom: '14px' }}>
                                        {characters[selected].tags.map((t, i) => <span key={i} style={{ padding: '3px 9px', background: `${characters[selected].color}18`, border: `1px solid ${characters[selected].color}30`, borderRadius: '10px', fontSize: '0.65rem', color: characters[selected].color }}>{t}</span>)}
                                    </div>
                                    <div style={{ width: '100%', height: '1px', background: '#1a1820', marginBottom: '14px' }} />
                                    <div style={{ padding: '10px 14px', background: '#0a0810', borderRadius: '8px', borderLeft: `2px solid ${characters[selected].color}`, marginBottom: '14px' }}>
                                        <div style={{ color: '#6b6480', fontSize: '0.6rem', marginBottom: '3px' }}>QUOTE</div>
                                        <div style={{ color: '#c8c4d4', fontSize: isMobile ? '0.82rem' : '0.9rem', fontStyle: 'italic', lineHeight: 1.5 }}>"{characters[selected].quote}"</div>
                                    </div>
                                    {characters[selected].affection && (
                                        <div>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '5px' }}>
                                                <span style={{ color: '#6b6480', fontSize: '0.65rem' }}>AFFECTION</span>
                                                <span style={{ color: characters[selected].color, fontSize: '0.8rem', fontWeight: 600 }}>♥ {characters[selected].affection}%</span>
                                            </div>
                                            <div style={{ height: '6px', background: '#1a1820', borderRadius: '3px', overflow: 'hidden' }}>
                                                <div style={{ width: `${characters[selected].affection}%`, height: '100%', background: characters[selected].color }} />
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    <footer style={{ textAlign: 'center', marginTop: isMobile ? '30px' : '45px', padding: '18px', borderTop: '1px solid #1a1820' }}>
                        <p style={{ color: '#1a1820', fontSize: '0.6rem' }}>made by CowardMole</p>
                    </footer>
                </div>
            );
        }

        function App() {
            const [screen, setScreen] = useState('title');
            return <div id="game-container" style={{ minHeight: '100vh' }}>
                {screen === 'title' && <TitleScreen onStart={() => setScreen('loading')} />}
                {screen === 'loading' && <LoadingScreen onComplete={() => setScreen('game')} />}
                {screen === 'game' && <GameScreen onGlitch={() => setScreen('glitch')} />}
                {screen === 'glitch' && <GlitchScreen onComplete={() => setScreen('site')} />}
                {screen === 'site' && <CharacterSite />}
            </div>;
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
